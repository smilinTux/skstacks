apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - metallb-config.yaml
  - cluster-issuer.yaml
  - traefik-helmchart.yaml   # Traefik v3 as Gateway API controller (replaces ingress-nginx)
  - gateway.yaml             # GatewayClass + shared skstacks Gateway

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  skstacks.io/managed: "true"
