# SKStacks v2 — Gateway API (Traefik) — replaces ingress-nginx (EOL Mar 2026).
# We standardize in-cluster ingress on Traefik v3 (the same engine as the
# skfence edge) acting as a Gateway API controller. One ingress stack, edge→cluster.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: skstacks
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    # HTTP — typically redirected to HTTPS by an HTTPRoute filter.
    - name: web
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # HTTPS — terminates the wildcard cert issued by cert-manager (skca/step-ca).
    - name: websecure
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: skstacks-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
