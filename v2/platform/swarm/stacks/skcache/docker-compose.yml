# skcache — Valkey on Docker Swarm  (RATIFIED: Valkey, the BSD-3 Redis fork)
#
# Required env (.env / Ansible):
#   VALKEY_PASSWORD   — auth password (resolve from the secret backend at deploy)
#   SKCACHE_DATA_DIR  — host path for persistence (optional; named volume default)
services:
  valkey:
    image: valkey/valkey:8-alpine
    command:
      - "valkey-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${VALKEY_PASSWORD}"
    networks:
      - skstacks
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          memory: 512M

volumes:
  valkey-data:

networks:
  skstacks:
    external: true
