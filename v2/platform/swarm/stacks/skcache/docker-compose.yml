# skcache — Valkey on Docker Swarm  (RATIFIED: Valkey, the BSD-3 Redis fork)
#
# Required env (.env / Ansible):
#   VALKEY_PASSWORD   — auth password (resolve from the secret backend at deploy)
#   SKCACHE_DATA_DIR  — host path for persistence (optional; named volume default)
services:
  valkey:
    image: valkey/valkey:8-alpine
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
      # valkey-cli (8.x) reads REDISCLI_AUTH itself, so the healthcheck below
      # never needs -a <password> on its own command line.
      - REDISCLI_AUTH=${VALKEY_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mkdir -p /usr/local/etc/valkey
        umask 077
        printf 'requirepass %s\n' "$$VALKEY_PASSWORD" > /usr/local/etc/valkey/valkey.conf
        exec valkey-server /usr/local/etc/valkey/valkey.conf --appendonly yes
    networks:
      - skstacks
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          memory: 512M

volumes:
  valkey-data:

networks:
  skstacks:
    external: true
