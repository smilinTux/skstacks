# skbus — NATS JetStream server config (Swarm). Passwords are interpolated from
# env at runtime (sourced from the secret backend at deploy — NEVER hard-coded).
server_name: $NATS_SERVER_NAME

jetstream {
  store_dir: /data
  max_memory_store: 1GB
  max_file_store: 10GB
}

# Clustered for HA — routes discover peers via the overlay DNS name `nats`.
cluster {
  name: skbus
  port: 6222
  routes: [ "nats-route://nats:6222" ]
}

accounts {
  SYS: {
    users: [ { user: sys, password: $NATS_SYS_PASSWORD } ]
  }
  SKCOMMS: {
    jetstream: enabled
    users: [ { user: skcomms, password: $NATS_SKCOMMS_PASSWORD } ]
  }
}
system_account: SYS

# TLS for client + cluster (certs from skca/step-ca, mounted volume).
tls {
  cert_file: "/certs/nats.crt"
  key_file:  "/certs/nats.key"
  timeout: 3
}
