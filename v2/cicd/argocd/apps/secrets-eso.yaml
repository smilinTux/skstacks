---
# Secret plane — ESO ClusterSecretStore → OpenBao (vault provider, Kubernetes
# auth, no pre-shared secret) + ExternalSecrets. See v2/secrets/BOOTSTRAP.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skstacks-secrets-eso
  namespace: argocd
  labels:
    skstacks.io/managed: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: skstacks
  source:
    repoURL: https://github.com/smilinTux/skstacks.git
    targetRevision: main
    path: v2/secrets/eso
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
