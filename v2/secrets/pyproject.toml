# SKStacks v2 — secrets package
#
# Consumed by the deploy tooling via PYTHONPATH=<repo>/v2 (so `import secrets.factory`
# resolves to this package). NOTE: the import name `secrets` shadows the Python
# stdlib `secrets` module when v2/ is on sys.path first — this is intentional for
# the deploy-tooling context but means you should NOT `pip install` this into a
# general-purpose environment as a top-level package. A rename to `sksecrets` is
# tracked as a follow-up (see the sv-20260611 board tasks).
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skstacks-secrets"
version = "0.1.0"
description = "SKStacks v2 pluggable secret backends (vault-file / OpenBao / HashiCorp Vault / capauth) behind one SKSecretBackend interface."
readme = "SECURITY-BACKENDS.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "smilinTux / SKWorld" }]
dependencies = []   # core (interface/factory/vault-file) has no hard deps beyond stdlib + ansible-vault CLI

[project.optional-dependencies]
# Server backends (OpenBao is wire-compatible with HashiCorp Vault → same client)
openbao = ["hvac>=2.0"]
hashicorp = ["hvac>=2.0"]
# Sovereign PGP backend
capauth = ["python-gnupg>=0.5"]
# vault-file uses the ansible-vault CLI
vault-file = ["ansible-core>=2.16"]
# Everything + test tooling
dev = ["hvac>=2.0", "python-gnupg>=0.5", "ansible-core>=2.16", "pytest>=8.0"]

[tool.setuptools]
packages = [
  "secrets",
  "secrets.vault_file",
  "secrets.openbao",
  "secrets.hashicorp_vault",
  "secrets.capauth",
]
package-dir = { "secrets" = "." }

[tool.pytest.ini_options]
# Put v2/ (this package's parent) on the path so `import secrets.*` resolves here.
pythonpath = [".."]
testpaths = ["tests"]
addopts = "-q"
