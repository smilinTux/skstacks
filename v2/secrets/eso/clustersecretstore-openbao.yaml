# SKStacks v2 — ESO ClusterSecretStore for OpenBao
# =================================================
# External Secrets Operator has no dedicated OpenBao provider, but OpenBao is
# wire-compatible with HashiCorp Vault, so we use ESO's `vault` provider pointed
# at the OpenBao server. Auth is the **Kubernetes auth method** — the ESO
# controller's ServiceAccount JWT is the credential, so NO secret is pre-shared
# (this is the no-catch-22 secure-introduction path; see ../BOOTSTRAP.md).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      # OpenBao speaks the Vault HTTP API; ESO's vault provider works unchanged.
      server: "https://openbao.openbao.svc:8200"
      path: "kv"            # KV-v2 mount
      version: "v2"
      # Path convention: kv/data/skstacks/{env}/{scope}/{key}
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "skstacks"          # OpenBao role bound to the ESO ServiceAccount
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
      caProvider:
        type: "ConfigMap"
        name: "openbao-ca"
        key: "ca.crt"
        namespace: "external-secrets"
