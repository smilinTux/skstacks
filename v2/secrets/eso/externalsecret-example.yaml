# Example ExternalSecret — sync skfence's prod secrets from OpenBao into a
# native K8s Secret that the workload mounts. The OpenBao KV path follows the
# SKStacks convention kv/data/skstacks/{env}/{scope}/{key} (value under "value").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skfence-prod
  namespace: skfence
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: skfence-prod          # the K8s Secret that gets created
    creationPolicy: Owner
  data:
    - secretKey: cloudflare_dns_token
      remoteRef:
        key: "skstacks/prod/skfence/cloudflare_dns_token"
        property: "value"
