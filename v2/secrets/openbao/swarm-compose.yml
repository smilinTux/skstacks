# OpenBao server — HA Raft cluster on Docker Swarm (the default secret server).
# 3 nodes, integrated Raft storage, TLS. Init/unseal via ../bootstrap.sh (PGP,
# no-catch-22 — NEVER a plaintext init JSON). See ../BOOTSTRAP.md.
services:
  openbao:
    image: openbao/openbao:2.5.4
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    # Per-task overlay hostname (e.g. `openbao.1.<taskid>`) — DNS-resolvable by
    # peers, so Raft nodes can actually reach each other to form quorum.
    hostname: "{{.Task.Name}}"
    environment:
      - BAO_RAFT_NODE_ID={{.Task.Slot}}          # stable raft identity per replica (1,2,3)
      - BAO_CLUSTER_ADDR_HOST={{.Task.Name}}     # routable host this node advertises
      - SKIP_SETCAP=true
    cap_add: [IPC_LOCK]
    networks: [skstacks]
    volumes:
      - ${OPENBAO_CONFIG_DIR}/openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/data
      - openbao-tls:/openbao/tls:ro              # cert/key from skca/step-ca
    healthcheck:
      # 200=unsealed active, 429=standby, 501=not-init, 503=sealed — any HTTP = alive
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost:8200/v1/sys/health?standbyok=true"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 3
      restart_policy: { condition: any }
      placement:
        max_replicas_per_node: 1                 # spread the Raft cluster (HA)

volumes:
  openbao-data:
  openbao-tls:

networks:
  skstacks:
    external: true
