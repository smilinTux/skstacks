# OpenBao server — HA Raft on K8s/RKE2 via the OpenBao Helm chart (helm-controller).
# The default secret SERVER backend (sovereign, MPL-2.0, wire-compatible w/ Vault).
#
# Init/unseal is the NO-CATCH-22 bootstrap (../bootstrap.sh): `bao operator init`
# with -pgp-keys / -root-token-pgp-key so unseal shares + root token are
# PGP-encrypted to capauth keys — NEVER a plaintext init JSON. See ../BOOTSTRAP.md.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: openbao
  namespace: kube-system
spec:
  repo: https://openbao.github.io/charts
  chart: openbao
  version: "0.10.0"
  targetNamespace: openbao
  createNamespace: true
  valuesContent: |-
    server:
      image:
        repository: openbao/openbao
        tag: "2.5.4"
      ha:
        enabled: true
        replicas: 3                      # odd: 3 or 5 (Raft quorum)
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true
            listener "tcp" {
              tls_disable   = 0          # NEVER disable TLS in prod
              address       = "[::]:8200"
              tls_cert_file = "/openbao/userconfig/openbao-tls/tls.crt"
              tls_key_file  = "/openbao/userconfig/openbao-tls/tls.key"
            }
            storage "raft" {
              path = "/openbao/data"
              retry_join { leader_api_addr = "https://openbao-0.openbao-internal:8200" }
              retry_join { leader_api_addr = "https://openbao-1.openbao-internal:8200" }
              retry_join { leader_api_addr = "https://openbao-2.openbao-internal:8200" }
            }
            service_registration "kubernetes" {}
      dataStorage:
        enabled: true
        storageClassName: longhorn       # skblock
        size: 10Gi
      # TLS cert/key from cert-manager (skca/step-ca) into the openbao-tls Secret
      volumes:
        - name: userconfig-openbao-tls
          secret: { secretName: openbao-tls }
      volumeMounts:
        - name: userconfig-openbao-tls
          mountPath: /openbao/userconfig/openbao-tls
          readOnly: true
    # Kubernetes auth (enabled by bootstrap.sh) gives pods/ESO secure introduction
    # with NO pre-shared secret — keeps the no-catch-22 property end-to-end.
    injector:
      enabled: false                     # we use ESO (External Secrets Operator), not the injector
