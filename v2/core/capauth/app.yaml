# SKStacks v2: capauth app descriptor (STUB)
#
# This is a capability stub (structure only, NO real secrets).
# Replace CHANGEME_* placeholders with real values before deploy.
# Provider is the recommended sovereign adapter from the skos capability map.
#
# See: docs/superpowers/specs/2026-06-09-skos-capability-map.md
#
# STATUS: no deploy: block, by design. capauth in this catalog is the
# loopback authz PDP that actually runs today: a systemd --user unit,
# loopback-bound, token-gated (skgateway's authz PDP delegate), one instance
# per node that runs a PEP. It is a bare process, not a container, and the
# CapAuth server code refuses to sit on a public interface without a warning
# (--host 0.0.0.0 still works but is not the intended shape).
#
# DECISION (Chef, 2026-09-26; see docs/decisions/capauth-loopback-pdp.md):
# capauth in this catalog means this per-node PDP, not the separate
# standalone verification-service container (challenge/verify/callback for
# passwordless PGP OIDC login). That standalone mode and the
# ghcr.io/smilintux/capauth image are DEPRECATED. PGP passwordless login for
# apps is covered by ghcr.io/smilintux/authentik-capauth (an Authentik stage,
# via sksso), not this descriptor. See docs/services/capauth.md for the full
# deployment shapes.

name: capauth
description: "Sovereign machine-to-machine auth: PGP-based CapAuth for agent identity, secret access, and an authz PDP, without OAuth."
capability: "Sovereign M2M auth: PGP-based identity and secret access without OAuth"
scope: capauth
ha: true            # redundant per node: every node that needs a PDP runs its own instance, not a clustered/replicated service
min_replicas: 3     # read as "at least this many independent per-node PDP instances fleet-wide", not replicas of one exposed service
version: "CHANGEME_VERSION"
platforms: [docker-swarm, bare-metal]
provider: CapAuth (sovereign PGP-based; skcapstone MCP integration)
alternates:
  - Zitadel (OIDC M2M for human+agent hybrid)
  - SPIFFE/SPIRE (workload identity)

# Secret keys this service needs (values resolved from secret backend at deploy time).
# These are the capauth-service process's own runtime secrets (src/capauth/service/app.py),
# not the per-agent CapAuth identity keys under ~/.capauth/ (those are provisioned separately,
# per agent, and never flow through this descriptor).
secrets:
  - key: capauth_admin_token
    description: "Bearer token gating the capauth-service admin API (CAPAUTH_ADMIN_TOKEN)"
    rotation_days: 90
    required: true
    sensitive: true
  - key: capauth_jwt_secret
    description: "Secret signing CapAuth-issued session JWTs (CAPAUTH_JWT_SECRET)"
    rotation_days: 90
    required: true
    sensitive: true
  - key: capauth_authz_token
    description: "Bearer token gating the /v1/authz/decide PDP endpoint (CAPAUTH_AUTHZ_TOKEN); unset = endpoint disabled/503"
    rotation_days: 90
    required: true
    sensitive: true
  - key: capauth_server_key_armor
    description: "Optional armored PGP private key the server uses to sign challenge nonces (CAPAUTH_SERVER_KEY_ARMOR)"
    required: false
    sensitive: true
  - key: capauth_server_key_passphrase
    description: "Passphrase for capauth_server_key_armor (CAPAUTH_SERVER_KEY_PASSPHRASE)"
    required: false
    sensitive: true

# Non-sensitive config (overridden by overlay values)
config:
  LOG_LEVEL: INFO
  DOMAIN: "${SKSTACKS_DOMAIN}"
  CLUSTER: "${SKSTACKS_CLUSTER}"

# Health check (fill in real URL/path before deploy). Points at the service's
# actual self-report route today: GET /capauth/v1/status. There is no
# /healthz route (see docs/services/capauth.md).
healthcheck:
  url: "https://CHANGEME_HOST.{${SKSTACKS_DOMAIN}}/capauth/v1/status"
  interval: 30s
  timeout: 5s
  retries: 3

# No deploy: block, by design. See STATUS note above,
# docs/services/capauth.md, and docs/decisions/capauth-loopback-pdp.md.
