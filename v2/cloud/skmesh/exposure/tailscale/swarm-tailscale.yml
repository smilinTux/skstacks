# exposure/tailscale (Swarm) — a tailscale node that `serve`s the Traefik Gateway
# onto the tailnet (TLS-terminated MagicDNS name). Auth key from the secret backend.
services:
  tailscale:
    image: tailscale/tailscale:v1.86.0
    hostname: skstacks-gateway
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}            # from secret backend (skmesh/tailscale_authkey)
      - TS_STATE_DIR=/var/lib/tailscale
      # Proxy tailnet :443 → the in-cluster Traefik service on the overlay net.
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--advertise-tags=tag:skstacks
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ${TS_CONFIG_DIR}/serve.json:/config/serve.json:ro
    cap_add: [NET_ADMIN, SYS_MODULE]
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: any
# serve.json maps https://skstacks-gateway:443 → http(s)://traefik:443
volumes:
  tailscale-state:
networks:
  traefik-public:
    external: true
    name: traefik-public-${ENV:-prod}
