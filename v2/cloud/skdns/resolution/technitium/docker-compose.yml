# skdns/technitium — self-hosted all-in-one DNS (authoritative + recursive +
# filtering + DoH/DoT/DoQ). The sovereign consolidation of PowerDNS+AdGuard.
services:
  technitium:
    image: technitium/dns-server:13
    environment:
      - DNS_SERVER_DOMAIN=${SKSTACKS_DOMAIN}
      - DNS_SERVER_ADMIN_PASSWORD_FILE=/run/secrets/technitium_admin_password
      # secure transport ON; plaintext :53 served only on the LAN
      - DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_HTTPS=true
      - DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_TLS=true
      - DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_QUIC=true
      - DNS_SERVER_RECURSION=AllowOnlyForPrivateNetworks
    ports:
      - { target: 53,  published: 53,  protocol: udp, mode: host }   # LAN resolver
      - { target: 53,  published: 53,  protocol: tcp, mode: host }
      - { target: 853, published: 853, protocol: tcp, mode: host }   # DoT
      - { target: 853, published: 853, protocol: udp, mode: host }   # DoQ
      - { target: 443, published: 5443, protocol: tcp, mode: host }  # DoH (avoid Traefik :443 clash)
    secrets:
      - technitium_admin_password
    volumes:
      - technitium-config:/etc/dns
    deploy:
      replicas: 1
      restart_policy:
        condition: any

secrets:
  technitium_admin_password:
    external: true                 # from the secret backend, never committed

volumes:
  technitium-config:
