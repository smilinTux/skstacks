# SKStacks v2 — skbackup app descriptor (STUB)
#
# This is a capability stub — structure only, NO real secrets.
# Replace CHANGEME_* placeholders with real values before deploy.
# Provider is the recommended sovereign adapter from the skos capability map.
#
# See: docs/superpowers/specs/2026-06-09-skos-capability-map.md

name: skbackup
description: "Backup — Restic to Garage S3 backend (replaces Duplicati which has corruption-bug history)."
capability: "Backup — encrypted deduplicated snapshots to sovereign object storage"
depends_on: [skobject]   # wiring (bridge → skwire needs)
scope: skbackup
version: "CHANGEME_VERSION"
platforms: [docker-swarm, bare-metal]
provider: Restic (→ Garage S3); Kopia (GUI alt) / Borg (fast local restore) as alternatives
alternates:
  - Kopia (GUI)
  - Borg (fast local restore)

# Secret keys this service needs (values resolved from secret backend at deploy time)
secrets:
  - key: restic_repository_password
    description: "Restic repository encryption password"
    rotation_days: 365
    required: true
    sensitive: true
  - key: restic_s3_access_key
    description: "S3 access key for Garage backend"
    required: true
  - key: restic_s3_secret_key
    description: "S3 secret key for Garage backend"
    required: true
    sensitive: true

# Non-sensitive config (overridden by overlay values)
config:
  LOG_LEVEL: INFO
  DOMAIN: "${SKSTACKS_DOMAIN}"
  CLUSTER: "${SKSTACKS_CLUSTER}"

# Health check (fill in real URL/path before deploy)
healthcheck:
  url: "https://CHANGEME_HOST.{${SKSTACKS_DOMAIN}}/healthz"
  interval: 30s
  timeout: 5s
  retries: 3
