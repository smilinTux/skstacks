# skpulse — Gatus on Docker Swarm (config-as-code uptime; feeds skops ITIL).
services:
  gatus:
    image: twinproduction/gatus:v5.13.1
    environment:
      - GATUS_CONFIG_PATH=/config/gatus-config.yaml
    volumes:
      - ${SKPULSE_CONFIG_DIR}/gatus-config.yaml:/config/gatus-config.yaml:ro
      - gatus-data:/data
    networks: [skstacks]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy: { condition: any }

volumes:
  gatus-data:

networks:
  skstacks:
    external: true
