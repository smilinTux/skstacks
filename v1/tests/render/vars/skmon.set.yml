# Second render pass: merged over skmon.example.yml to drive the optional
# hooks down their "set" path. Fake values only.
skmon:
  EXTRA_SCRAPE_TARGETS:
    - {job_name: example, target: "app.render.example.test:9100"}
  EXTRA_SCRAPE_CONFIGS:
    - job_name: example-dns
      dns_sd_configs:
        - {names: [tasks.example], type: A, port: 9100}
  PROBES:
    - {name: app, url: "https://app.render.example.test", severity: critical, expect: "2xx|3xx", forward_auth: true}
    - {name: edge, url: "https://203.0.113.5/health", severity: warning, expect: 200}
  AUTHENTIK_HOST: sso.render.example.test
  replicas: 0
  GRAFANA_PLUGINS: [grafana-clock-panel]
  GRAFANA_HEALTH_START_PERIOD: 5m
