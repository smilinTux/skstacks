# needs to render. example.test / 192.0.2.0/24 only; no real secrets.
skmesh:
  CLUSTERNAME: render
  DOMAIN: example.test
  POSTGRES_PASSWORD: example-postgres-password-not-a-secret
  NETBIRD_AUTH_CLIENT_ID: netbird
  TURN_USER: turn
  TURN_PASSWORD: example-turn-password-not-a-secret
  NETBIRD_RELAY_ENDPOINT: rels://relay.render.example.test:443
  NETBIRD_RELAY_AUTH_SECRET: example-netbird-relay-auth-secret-not-a-secret
  NETBIRD_DATASTORE_ENC_KEY: example-netbird-datastore-enc-key-not-a-secret
  TURN_SECRET: example-turn-secret-not-a-secret
  COTURN_EXTERNAL_IP: 192.0.2.20
  SSO_HOST_IP: 192.0.2.5
