# Second render pass: merged over sksso.example.yml to drive the optional
# hooks down their "set" path. Fake values only.
sksso:
  CLOUDFLARED: true
  placement_use_worker_constraint: false
  placement_exclude_nodes: [render-node-2]
  csrf_extra_origins: [https://sso.example.test]
  extra_env: {AUTHENTIK_EXAMPLE_FLAG: "true"}
  email_host: smtp.example.test
