# The "set" pass: every optional knob set, fake values only.
skcorpus:
  CORPORA:
    - name: example-legal
      description: "Example legal corpus (fixture)"
      collections: [example-chunks-v1, example-reference-v1]
      graph: example-graph
      embed_model: example-embed
      query_prefix: ""
      name_property: name
    - name: example-notes
      collections: [example-notes-v1]
      embed_model: example-embed
      vector_name: dense
