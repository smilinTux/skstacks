  PLEX_TOKEN: example-plex-token-not-a-secret
  PLEX_TOKEN_IS_SERVER_TOKEN: false
  LAN_BIND_ADDRESS: 192.0.2.10
  SERVER_REGIONS: Example Region
  FLARESOLVERR_ENABLED: false
  STREAM_NETWORK: ""
  TRAEFIK_DYNAMIC_DIR: /var/data/config/skfenceha-dev/dynamic
  TRAEFIK_MIDDLEWARES: ["authentik@file"]
  BRIDGE_SUBNET: 10.99.7.0/24
