# Public, obviously fake example vault for the real-Ansible render gate
# (v1/tests/render/render_playbooks.py). Minimal: only what the deploy
# needs to render. example.test / 192.0.2.0/24 only; no real secrets.
skmon:
  CLUSTERNAME: render
  DOMAIN: example.test
  ESTATE: example
  DATA_NODE: node-1.render.example.test
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASSWORD: example-grafana-admin-password-not-a-secret
  GRAFANA_SECRET_KEY: example-grafana-secret-key-not-a-secret
  GRAFANA_ROOT_URL: https://skmon.render.example.test
  # The render inventory's only host has no address; the allowlist wants an IPv4 literal.
  AGENT_LISTEN_ADDR:
    localhost: 192.0.2.10
  # Estate address allowed to reach /healthz (RFC 5737). PROBES stays unset here so this pass
  # takes the default discovery path; the set pass gives it a fake list.
  HEALTHZ_ALLOW:
    - 198.51.100.7
  # The estate's own sk-alert script, read on the controller and pinned by its sha256. A relative
  # path resolves against the SKStacks repository root (an absolute path is used as given); this
  # one is the test stub that ships with the repository, never the real script.
  SKALERT_SCRIPT_SRC: v1/tests/fixtures/skmon/fake_sk_alert
  SKALERT_SCRIPT_SHA256: c0809061607f79a66430dad19af667d7ad2d16fd8dfc1b1b88ed539fef5f7738
  # sk-alert's alert.env and alert.secret, one NAME=value per line (single-line values only).
  ALERT_ROUTING:
    TELEGRAM_CHAT_ID: "-1000000000"
    TALK_URL: https://talk.example.test/room/example-not-real
  ALERT_SECRETS:
    TELEGRAM_BOT_TOKEN: example-telegram-token-not-a-secret
  # A channel that does not run on the monitored estate (telegram or talk-external).
  ALERT_OUT_OF_DOMAIN_CHANNEL: telegram
