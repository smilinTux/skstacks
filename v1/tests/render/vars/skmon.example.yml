# Public, obviously fake example vault for the real-Ansible render gate
# (v1/tests/render/render_playbooks.py). Minimal: only what the deploy
# needs to render. example.test / 192.0.2.0/24 only; no real secrets.
skmon:
  CLUSTERNAME: render
  DOMAIN: example.test
  ESTATE: example
  DATA_NODE: node-1.render.example.test
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASSWORD: example-grafana-admin-password-not-a-secret
  GRAFANA_SECRET_KEY: example-grafana-secret-key-not-a-secret
  GRAFANA_ROOT_URL: https://skmon.render.example.test
  # Grafana signs in through Authentik (fake, 32+ characters each).
  GRAFANA_OIDC_CLIENT_ID: example-grafana-oidc-client-id-not-real-0123
  GRAFANA_OIDC_CLIENT_SECRET: example-grafana-oidc-client-secret-not-real-0123
  AUTHENTIK_HOST: sso.render.example.test
  # The render inventory's only host has no address; the allowlist wants an IPv4 literal.
  AGENT_LISTEN_ADDR:
    localhost: 192.0.2.10
  # Estate address allowed to reach /healthz (RFC 5737). PROBES stays unset here so this pass
  # takes the default discovery path; the set pass gives it a fake list.
  HEALTHZ_ALLOW:
    - 198.51.100.7
  # The estate's own sk-alert script, read on the controller and pinned by its sha256. A relative
  # path resolves against the directory of this vault file (an absolute path or ~/... is used as
  # given), so the real script lives beside the vault, not in the repository. The render gate
  # stages the test stub (v1/tests/fixtures/skmon/fake_sk_alert) next to the vault under this name.
  SKALERT_SCRIPT_SRC: fake_sk_alert
  SKALERT_SCRIPT_SHA256: c0809061607f79a66430dad19af667d7ad2d16fd8dfc1b1b88ed539fef5f7738
  # sk-alert's alert.env and alert.secret, one NAME=value per line (single-line values only).
  ALERT_ROUTING:
    TELEGRAM_CHAT_ID: "-1000000000"
    TALK_URL: https://talk.example.test/room/example-not-real
  ALERT_SECRETS:
    TELEGRAM_BOT_TOKEN: example-telegram-token-not-a-secret
  # A channel that does not run on the monitored estate (telegram or talk-external).
  ALERT_OUT_OF_DOMAIN_CHANNEL: telegram

  # Every other documented key, at its default or a fake value, so the README contract is checked
  # against a vault that sets it. PROBES stays unset (default discovery); PVE and PROFILING are
  # present but off, so the base pass renders the default stack.
  AUTHENTIK_PROVISION: true
  AUTHENTIK_TILE: true
  # AUTHENTIK_VAULT_FILE: sksso-render_vault.yml  (documented; left unset so the pass does not load a vault file)
  AUTHENTIK_INTERNAL_URL: http://sksso-prod_server:9000
  AUTHENTIK_NETWORK: sksso-prod
  FORWARD_AUTH_MIDDLEWARE: authentik@file
  METRICS_RETENTION: 90d
  LOGS_RETENTION: 30d
  PROFILES_RETENTION: 14d
  SCRAPE_INTERVAL_FAST: 15s
  SCRAPE_INTERVAL: 30s
  AGENT_PORT: 12345
  HEALTHZ_PORT: 9095
  LOKI_PUSH_PORT: 3100
  PYROSCOPE_PORT: 4040
  PROFILING:
    enabled: false
    hosts: []
  PVE:
    enabled: false
    targets: []
    verify_ssl: true
  PVE_TOKEN_ID: "monitor@pve!skmon"
  PVE_TOKEN_SECRET: example-pve-token-secret-not-a-secret
  PVE_UID: 65534
  SKSWARM_UID: 65534
  BRIDGE_UID: 65534
  ALERT_TALK: false
  ALERT_ACCEPT_IN_DOMAIN_ONLY: false
  ALERT_ACCEPT_IN_DOMAIN_ONLY_REASON: "not used while an out-of-domain channel is set"
  D_STATE_THRESHOLD: 10
  EXTRA_SCRAPE_CONFIGS: []
  TRAEFIK_SCRAPE_NAME: tasks.skfence-prod_traefik
  GRAFANA_PLUGINS: []
  GRAFANA_HEALTH_START_PERIOD: 60s
  SMTP_ENABLED: false
  SMTP_HOST: smtp.example.test
  SMTP_PORT: 587
  SMTP_USER: alerts@example.test
  SMTP_PASSWORD: example-smtp-password-not-a-secret
  SMTP_FROM_ADDRESS: alerts@example.test
  SMTP_FROM_NAME: Grafana
  SMTP_SECURE: true
  INSTANCE: skmon-prod
  APP_ENV: prod
  replicas: 1
  networks:
    - {name: skmon-prod, subnet: 198.51.100.0/24, driver: overlay, attachable: true}
    - {name: cloud-public-prod, subnet: 203.0.113.0/24, driver: overlay, attachable: true}
  DATA_PATH: /srv/local/skmon-prod
  # Image pins and resource knobs, at the shipped defaults (see src/config/skmon/pins.yml).
  VICTORIAMETRICS_IMAGE: 'victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df'
  VICTORIAMETRICS_CPU_LIMIT: '1.0'
  VICTORIAMETRICS_CPU_RESERVATION: '0.1'
  VICTORIAMETRICS_MEMORY_LIMIT: '1G'
  VICTORIAMETRICS_MEMORY_RESERVATION: '256M'
