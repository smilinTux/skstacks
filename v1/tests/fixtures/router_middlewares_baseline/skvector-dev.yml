version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    env_file: /var/data/config/skvector-dev/skvector.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Main storage - NFS backed for persistence
      - /var/data/skvector-dev/storage:/qdrant/storage
      # Snapshots - NFS backed for backup/recovery
      - /var/data/skvector-dev/snapshots:/qdrant/snapshots
      # Config file for advanced settings
    networks:
      - skvector-dev
      - cloud-public-dev
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
      mode: replicated
      replicas: 1
      placement:
        constraints: []
      resources:
        limits:
          # Optimized for large document ingestion from SKAid
          # Handles chunked embeddings from 150MB PDFs
          cpus: '2.00'
          memory: 4096M
        reservations:
          cpus: '0.50'
          memory: 1024M
      labels:
        # === TRAEFIK: HTTP ===
        - "traefik.enable=true"
        - "traefik.swarm.network=cloud-public-dev"

        # === TRAEFIK: REQUEST SIZE for Large Batch Uploads ===
        # Support batch embedding uploads from SKAid document ingestion
        - "traefik.http.middlewares.skvector-dev-buffering.buffering.maxRequestBodyBytes=104857600"
        - "traefik.http.middlewares.skvector-dev-buffering.buffering.memRequestBodyBytes=10485760"

        # === TRAEFIK: ROUTERS ===
        - "traefik.http.routers.skvector-dev.rule=Host(`skvector-dev.render.example.test`)"
        - "traefik.http.routers.skvector-dev.entrypoints=websecure"
        - "traefik.http.routers.skvector-dev.tls=true"
        - "traefik.http.routers.skvector-dev.tls.certresolver=main"
        - "traefik.http.routers.skvector-dev.tls.options=intermediate@file"
        - "traefik.http.routers.skvector-dev.middlewares=skvector-dev-buffering,default-no-crowdsec@file"
        - "traefik.http.routers.skvector-dev.service=skvector-dev"

        # === TRAEFIK: SERVICES ===
        - "traefik.http.services.skvector-dev.loadbalancer.server.port=6333"

        # === TRAEFIK: gRPC ROUTER (for high-performance batch operations) ===
        - "traefik.http.routers.skvector-dev-grpc.rule=Host(`skvector-dev.render.example.test`) && PathPrefix(`/qdrant.`)"
        - "traefik.http.routers.skvector-dev-grpc.entrypoints=websecure"
        - "traefik.http.routers.skvector-dev-grpc.tls=true"
        - "traefik.http.routers.skvector-dev-grpc.tls.certresolver=main"
        - "traefik.http.routers.skvector-dev-grpc.tls.options=intermediate@file"
        - "traefik.http.routers.skvector-dev-grpc.middlewares=default-no-crowdsec@file"
        - "traefik.http.routers.skvector-dev-grpc.service=skvector-dev-grpc"
        - "traefik.http.services.skvector-dev-grpc.loadbalancer.server.port=6334"
        - "traefik.http.services.skvector-dev-grpc.loadbalancer.server.scheme=h2c"

        # === TRAEFIK: HEALTH CHECK ===
        - "traefik.http.services.skvector-dev.loadbalancer.healthcheck.path=/healthz"
        - "traefik.http.services.skvector-dev.loadbalancer.healthcheck.interval=30s"
        - "traefik.http.services.skvector-dev.loadbalancer.healthcheck.timeout=10s"

volumes:
  skvector-dev-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/data/skvector-dev/storage
  skvector-dev-snapshots:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/data/skvector-dev/snapshots

networks:
  skvector-dev:
    external: true
  cloud-public-dev:
    external: true
