version: '3.8'

services:
  skpeek:
    image: docker.io/searxng/searxng@sha256:a31763b7af3caf6ae9aac1816ba774214eb550252e06a4998f276ded8d60461b
    env_file: /var/data/config/skpeek-prod/skpeek.env

    logging:
      driver: json-file
      options:
        max-size: 4m
        max-file: "1"

    volumes:
      - /var/data/skpeek-prod/etc:/etc/searxng:rw
      - /var/data/skpeek-prod/img/skpeek.png:/usr/local/searxng/searx/static/themes/simple/img/searxng.png:rw

    networks:
      - cloud-public-prod
      - skpeek-prod

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        # === TRAEFIK: HTTP ===
        - "traefik.enable=true"
        - "traefik.swarm.network=cloud-public-prod"
        # === TRAEFIK: ROUTERS ===
        - "traefik.http.routers.skpeek.rule=Host(`skpeek.render.example.test`)"
        - "traefik.http.routers.skpeek.entrypoints=websecure"
        - "traefik.http.routers.skpeek.tls=true"
        - "traefik.http.routers.skpeek.tls.certresolver=main"
        - "traefik.http.routers.skpeek.tls.options=intermediate@file"
        - "traefik.http.routers.skpeek.middlewares=default-no-crowdsec@file"
        - "traefik.http.routers.skpeek.service=skpeek"
        # === TRAEFIK: SERVICES ===
        - "traefik.http.services.skpeek.loadbalancer.server.port=8080"

  redis:
    image: docker.io/valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    command: valkey-server --save 30 1 --loglevel warning
    logging:
      driver: json-file
      options:
        max-size: 4m
        max-file: "1"

    networks:
      - skpeek-prod
    volumes:
      - /var/data/runtime/skpeek-prod/redis:/data

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  cloud-public-prod:
    external: true
  skpeek-prod:
    external: true

