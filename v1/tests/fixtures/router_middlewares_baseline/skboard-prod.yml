version: '3.8'

services:
  vikunja:
    # Pinned: see README.md "Upgrading Vikunja" before ever bumping this.
    image: vikunja/vikunja:0.24.6
    env_file: /var/data/config/skboard-prod/skboard.env

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      # Never mount over /app/vikunja: it is the image's install dir and
      # holds the binary (a mount there hid it: "exec /app/vikunja/vikunja:
      # no such file", v2.19.0 rc4). The data dir keeps its single-volume
      # layout (vikunja.db + files/), mounted at /db, with files/ also at
      # the image's default files path, so existing data needs no moves.
      - /var/data/skboard-prod/data:/db
      - /var/data/skboard-prod/data/files:/app/vikunja/files

    networks:
      - cloud-public-prod
      - skboard-prod

    # No Docker-level healthcheck: the vikunja/vikunja image ships no shell
    # and no wget/curl (verified: docker exec fails with "executable file
    # not found in $PATH" for both), so a CMD-style test cannot run inside
    # the container. The upstream image itself defines no HEALTHCHECK either.
    # Swarm still detects and restarts a genuinely crashed process via the
    # container exit code and the restart_policy below.

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
      restart_policy:
        # No max_attempts/window: with the single-node pin, one outage of that
        # node spent the old budget of 3 and Swarm never rescheduled vikunja
        # again (0/1 for months). See README.md "Restart policy".
        condition: any
        delay: 10s
      labels:
        # === TRAEFIK: HTTP ===
        - "traefik.enable=true"
        - "traefik.swarm.network=cloud-public-prod"
        # === TRAEFIK: ROUTERS ===
        - "traefik.http.routers.skboard.rule=Host(`skboard.render.example.test`)"
        - "traefik.http.routers.skboard.entrypoints=websecure"
        - "traefik.http.routers.skboard.tls=true"
        - "traefik.http.routers.skboard.tls.certresolver=main"
        - "traefik.http.routers.skboard.tls.options=intermediate@file"
        - "traefik.http.routers.skboard.middlewares=default-no-crowdsec@file"
        - "traefik.http.routers.skboard.service=skboard"
        # === TRAEFIK: SERVICES ===
        - "traefik.http.services.skboard.loadbalancer.server.port=3456"

networks:
  cloud-public-prod:
    external: true
  skboard-prod:
    external: true
