version: '3.8'

services:
  skpeek:
    image: docker.io/searxng/searxng@sha256:670bd1076097640fc25221bf92a8af7d344503ce17ba3305abedf28e3634e807
    env_file: /var/data/config/skpeek-staging/skpeek.env

    logging:
      driver: json-file
      options:
        max-size: 4m
        max-file: "1"

    volumes:
      - /var/data/skpeek-staging/etc:/etc/searxng:rw
      - /var/data/skpeek-staging/img/skpeek.png:/usr/local/searxng/searx/static/themes/simple/img/searxng.png:rw

    networks:
      - cloud-public-staging
      - skpeek-staging

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        # === TRAEFIK: HTTP ===
        - "traefik.enable=true"
        - "traefik.swarm.network=cloud-public-staging"
        # === TRAEFIK: ROUTERS ===
        - "traefik.http.routers.skpeek-staging.rule=Host(`skpeek-staging.render.example.test`)"
        - "traefik.http.routers.skpeek-staging.entrypoints=websecure"
        - "traefik.http.routers.skpeek-staging.tls=true"
        - "traefik.http.routers.skpeek-staging.tls.certresolver=main"
        - "traefik.http.routers.skpeek-staging.tls.options=intermediate@file"
        - "traefik.http.routers.skpeek-staging.middlewares=default-no-crowdsec@file"
        - "traefik.http.routers.skpeek-staging.service=skpeek-staging"
        # === TRAEFIK: SERVICES ===
        - "traefik.http.services.skpeek-staging.loadbalancer.server.port=8080"

  redis:
    image: docker.io/valkey/valkey:8.1.5-alpine@sha256:3c3ccc8571d4866ec5ac5ffb2519b6b6a1fdbf6b5ff5fdab075413026fbff273
    command: valkey-server --save 30 1 --loglevel warning
    logging:
      driver: json-file
      options:
        max-size: 4m
        max-file: "1"

    networks:
      - skpeek-staging
    volumes:
      - /var/data/runtime/skpeek-staging/redis:/data

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  cloud-public-staging:
    external: true
  skpeek-staging:
    external: true

