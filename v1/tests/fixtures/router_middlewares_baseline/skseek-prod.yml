version: '3.8'

# skseek: Perplexica, an AI-powered search UI that answers from live search
# results (via SearXNG/skpeek as its backend) instead of just a model's
# training data. Depends on skpeek being deployed on the same instance;
# reaches it as skpeek-prod_skpeek over the shared skpeek-prod
# overlay network rather than a public URL.

services:
  skseek:
    image: itzcrazykns1337/perplexica:latest@sha256:343d2a02858cc3c15bb35bf94b3249923f4eb5de16eb80d266eddfef6d84951d
    env_file: /var/data/config/skseek-prod/skseek.env
    logging:
      driver: json-file
      options:
        max-size: 4m
        max-file: "1"

    volumes:
      - /var/data/skseek-prod/data:/home/perplexica/data:rw
      - /var/data/config/skseek-prod/config.toml:/home/perplexica/config.toml:ro

    networks:
      - cloud-public-prod
      - skseek-prod
      - skpeek-prod

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      labels:
        # === TRAEFIK: HTTP ===
        - "traefik.enable=true"
        - "traefik.swarm.network=cloud-public-prod"
        # === TRAEFIK: ROUTERS ===
        - "traefik.http.routers.skseek.rule=Host(`skseek.render.example.test`)"
        - "traefik.http.routers.skseek.entrypoints=websecure"
        - "traefik.http.routers.skseek.tls=true"
        - "traefik.http.routers.skseek.tls.certresolver=main"
        - "traefik.http.routers.skseek.tls.options=intermediate@file"
        - "traefik.http.routers.skseek.middlewares=default-no-crowdsec@file"
        - "traefik.http.routers.skseek.service=skseek"
        # === TRAEFIK: SERVICES ===
        - "traefik.http.services.skseek.loadbalancer.server.port=3000"

networks:
  cloud-public-prod:
    external: true
  skseek-prod:
    external: true
  skpeek-prod:
    external: true
