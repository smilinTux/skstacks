version: '3.8'

services:
  skpulse:
    image: louislam/uptime-kuma:2.5.5
    env_file:
      - /var/data/config/skpulse-prod/skpulse.env

    logging:
      driver: json-file
      options:
        max-size: 4m
        max-file: "1"

    volumes:
      - /var/data/skpulse-prod/uptime-kuma:/app/data

    networks:
      - cloud-public-prod
      - skpulse-prod

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      labels:
        # === TRAEFIK: HTTP ===
        - "traefik.enable=true"
        - "traefik.swarm.network=cloud-public-prod"
        # === TRAEFIK: ROUTERS ===
        - "traefik.http.routers.skpulse.rule=Host(`skpulse.render.example.test`)"
        - "traefik.http.routers.skpulse.entrypoints=websecure"
        - "traefik.http.routers.skpulse.tls=true"
        - "traefik.http.routers.skpulse.tls.certresolver=main"
        - "traefik.http.routers.skpulse.tls.options=intermediate@file"
        - "traefik.http.routers.skpulse.middlewares=default-no-crowdsec@file"
        - "traefik.http.routers.skpulse.service=skpulse"
        # === TRAEFIK: SERVICES ===
        - "traefik.http.services.skpulse.loadbalancer.server.port=3001"
        # === STICKY SESSIONS: Required for stateful web app ===
        - "traefik.http.services.skpulse.loadBalancer.sticky=true"
        - "traefik.http.services.skpulse.loadBalancer.sticky.cookie=true"
        - "traefik.http.services.skpulse.loadBalancer.sticky.cookie.name=skpulse_session"
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  cloud-public-prod:
    external: true
  skpulse-prod:
    external: true

