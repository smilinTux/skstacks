version: '3.8'

# skstor: Garage (S3-compatible object storage). Single-node
# (replication_factor=1), matching this framework's single-manager Swarm
# pattern. See docs/decisions/skstor-backend.md for why Garage replaced
# MinIO (MinIO's images and repo are gone -- verified 2026-09-25) and this
# service's README.md for the one-time layout/key/bucket bootstrap Garage
# needs before it will serve S3 traffic.
#
# meta/data are bind mounts onto /var/data/skstor-prod, the shared
# NFS filesystem every other service on this estate stores under (matching
# prod), NOT named Docker volumes: a named local-driver volume is
# host-local, so if Swarm ever reschedules this replicas=1 service onto a
# different manager, a named volume would silently start it on an empty
# volume on the new host instead of the data on shared storage.

networks:
  skstor-prod:
    external: true
  cloud-public-prod:
    external: true

services:
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    env_file: /var/data/config/skstor-prod/skstor.env
    volumes:
      - /var/data/config/skstor-prod/garage.toml:/etc/garage.toml:ro
      - /var/data/skstor-prod/meta:/var/lib/garage/meta
      - /var/data/skstor-prod/data:/var/lib/garage/data
    networks:
      cloud-public-prod: {}
      skstor-prod:
        # underscore-free name for S3 clients (skstor-prod_garage is rejected as a hostname)
        aliases:
          - skstor-prod-garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 1024M
        reservations:
          cpus: '0.1'
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=cloud-public-prod"

        # S3 API
        - "traefik.http.routers.skstor.rule=Host(`skstor.render.example.test`)"
        - "traefik.http.routers.skstor.entrypoints=websecure"
        - "traefik.http.routers.skstor.tls=true"
        - "traefik.http.routers.skstor.tls.certresolver=main"
        - "traefik.http.routers.skstor.tls.options=intermediate@file"
        - "traefik.http.routers.skstor.middlewares=default-no-crowdsec@file"
        - "traefik.http.routers.skstor.service=skstor"
        - "traefik.http.services.skstor.loadbalancer.server.port=3900"
