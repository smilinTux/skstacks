version: '3.8'

services:
  stirling-pdf:
    image: frooodle/s-pdf:2.14.3
    env_file: /var/data/config/skpdf-staging/skpdf.env
    logging:
      driver: json-file
      options:
        max-size: 4m
        max-file: "1"
    volumes:
      # OCR training data (Tesseract language files)
      - /var/data/skpdf-staging/trainingData:/usr/share/tessdata
      # Stirling-PDF configuration files
      - /var/data/skpdf-staging/extraConfigs:/configs
      # Custom files (templates, fonts, etc.)
      - /var/data/skpdf-staging/customFiles:/customFiles
      # Pipeline configurations
      - /var/data/skpdf-staging/pipeline:/pipeline
      # Logs directory
      - /var/data/skpdf-staging/logs:/logs
    networks:
      - skpdf-staging
      - cloud-public-staging
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 10s
      mode: replicated
      replicas: 1
      placement:
        constraints: []
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      labels:
        # === TRAEFIK: HTTP ===
        - "traefik.enable=true"
        - "traefik.swarm.network=cloud-public-staging"
        # === TRAEFIK: ROUTERS ===
        - "traefik.http.routers.skpdf-staging.rule=Host(`skpdf-staging.render.example.test`)"
        - "traefik.http.routers.skpdf-staging.entrypoints=websecure"
        - "traefik.http.routers.skpdf-staging.tls=true"
        - "traefik.http.routers.skpdf-staging.tls.certresolver=main"
        - "traefik.http.routers.skpdf-staging.tls.options=intermediate@file"
        # 2026-08-16: the skpdf-*-upload buffering middleware below was DEFINED but
        # never attached to this router, so MAX_UPLOAD_SIZE / MAX_RESPONSE_SIZE had
        # no effect and large PDFs hit Traefik's defaults. Appended to the chain.
        # Bare name resolves within the same (swarm) provider, i.e. ...-upload@swarm.
        - "traefik.http.routers.skpdf-staging.middlewares=default-no-crowdsec@file,skpdf-staging-upload"
        - "traefik.http.routers.skpdf-staging.service=skpdf-staging"
        # === TRAEFIK: SERVICES ===
        - "traefik.http.services.skpdf-staging.loadbalancer.server.port=8080"
        # === LARGE FILE UPLOAD: Enable for PDF processing ===
        # PDF files can be large, increase upload limits
        - "traefik.http.middlewares.skpdf-staging-upload.buffering.maxRequestBodyBytes=500000000"
        - "traefik.http.middlewares.skpdf-staging-upload.buffering.maxResponseBodyBytes=500000000"

networks:
  cloud-public-staging:
    external: true
  skpdf-staging:
    external: true
