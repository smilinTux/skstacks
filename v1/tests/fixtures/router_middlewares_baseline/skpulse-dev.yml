version: '3.8'

services:
  skpulse:
    image: louislam/uptime-kuma:2.5.5
    env_file:
      - /var/data/config/skpulse-dev/skpulse.env

    logging:
      driver: json-file
      options:
        max-size: 4m
        max-file: "1"

    volumes:
      - /var/data/skpulse-dev/uptime-kuma:/app/data

    networks:
      - cloud-public-dev
      - skpulse-dev

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      labels:
        # === TRAEFIK: HTTP ===
        - "traefik.enable=true"
        - "traefik.swarm.network=cloud-public-dev"
        # === TRAEFIK: ROUTERS ===
        - "traefik.http.routers.skpulse-dev.rule=Host(`skpulse-dev.render.example.test`)"
        - "traefik.http.routers.skpulse-dev.entrypoints=websecure"
        - "traefik.http.routers.skpulse-dev.tls=true"
        - "traefik.http.routers.skpulse-dev.tls.certresolver=main"
        - "traefik.http.routers.skpulse-dev.tls.options=intermediate@file"
        - "traefik.http.routers.skpulse-dev.middlewares=default-no-crowdsec@file"
        - "traefik.http.routers.skpulse-dev.service=skpulse-dev"
        # === TRAEFIK: SERVICES ===
        - "traefik.http.services.skpulse-dev.loadbalancer.server.port=3001"
        # === STICKY SESSIONS: Required for stateful web app ===
        - "traefik.http.services.skpulse-dev.loadBalancer.sticky=true"
        - "traefik.http.services.skpulse-dev.loadBalancer.sticky.cookie=true"
        - "traefik.http.services.skpulse-dev.loadBalancer.sticky.cookie.name=skpulse_session"
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  cloud-public-dev:
    external: true
  skpulse-dev:
    external: true

