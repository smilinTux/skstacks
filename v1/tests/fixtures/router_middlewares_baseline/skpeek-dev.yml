version: '3.8'

services:
  skpeek:
    image: docker.io/searxng/searxng@sha256:a31763b7af3caf6ae9aac1816ba774214eb550252e06a4998f276ded8d60461b
    env_file: /var/data/config/skpeek-dev/skpeek.env

    logging:
      driver: json-file
      options:
        max-size: 4m
        max-file: "1"

    volumes:
      - /var/data/skpeek-dev/etc:/etc/searxng:rw
      - /var/data/skpeek-dev/img/skpeek.png:/usr/local/searxng/searx/static/themes/simple/img/searxng.png:rw

    networks:
      - cloud-public-dev
      - skpeek-dev

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        # === TRAEFIK: HTTP ===
        - "traefik.enable=true"
        - "traefik.swarm.network=cloud-public-dev"
        # === TRAEFIK: ROUTERS ===
        - "traefik.http.routers.skpeek-dev.rule=Host(`skpeek-dev.render.example.test`)"
        - "traefik.http.routers.skpeek-dev.entrypoints=websecure"
        - "traefik.http.routers.skpeek-dev.tls=true"
        - "traefik.http.routers.skpeek-dev.tls.certresolver=main"
        - "traefik.http.routers.skpeek-dev.tls.options=intermediate@file"
        - "traefik.http.routers.skpeek-dev.middlewares=default-no-crowdsec@file"
        - "traefik.http.routers.skpeek-dev.service=skpeek-dev"
        # === TRAEFIK: SERVICES ===
        - "traefik.http.services.skpeek-dev.loadbalancer.server.port=8080"

  redis:
    image: docker.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command: valkey-server --save 30 1 --loglevel warning
    logging:
      driver: json-file
      options:
        max-size: 4m
        max-file: "1"

    networks:
      - skpeek-dev
    volumes:
      - /var/data/runtime/skpeek-dev/redis:/data

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  cloud-public-dev:
    external: true
  skpeek-dev:
    external: true

