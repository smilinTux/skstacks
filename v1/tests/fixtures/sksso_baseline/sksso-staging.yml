version: '3.8'

networks:
  sksso-staging:
    external: true
  cloud-public-staging:
    external: true

# sksso.DATA_NODE pins postgres + redis to one node (node.hostname ==); with
# POSTGRES_DATA_PATH / REDIS_DATA_PATH on local disk an NFS hang on any other
# node no longer takes Authentik down. See README.md "Local database on a
# pinned node". Defaults keep the NFS paths under /var/data/runtime.
services:
  postgres:
    image: postgres:16.2
    env_file: /var/data/config/sksso-staging/sksso.env
    environment:
      - PGTEMP=/var/lib/postgresql/data/tmp
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: ["node.role == worker"]
      resources:
        reservations:
          memory: 256M
          cpus: '.25'
        limits:
          memory: 2G
          cpus: '1.0'
      restart_policy:
        condition: any
        delay: 10s
    volumes:
      - /var/data/runtime/sksso-staging/postgres:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - sksso-staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres-db-backup:
    image: postgres:16.2
    env_file: /var/data/config/sksso-staging/sksso-backup.env
    environment:
      - PGTEMP=/dump/tmp
    volumes:
      - /var/data/sksso-staging/database-dump:/dump
      - /etc/localtime:/etc/localtime:ro
    # One shell runs this script (list form, no `bash -s <<EOF` heredoc): an
    # unquoted heredoc made the OUTER shell expand the date once at container
    # start, so every run overwrote one file and a failed dump truncated the
    # only copy. Each run now gets its own name, dumps to a hidden temp file
    # renamed only on success, and prunes dumps older than BACKUP_KEEP_DAYS
    # only after a good dump (a run of failures never ages out the last one).
    # Every $ is $$ so docker stack deploy does not interpolate it.
    entrypoint:
      - bash
      - -c
      - |
        set -o pipefail
        trap 'exit 0' HUP INT TERM
        rm -f /dump/.dump_*.tmp
        sleep 2m & wait $$!
        while true; do
          NAME=dump_$$(date +%d-%m-%Y_%H_%M_%S).psql
          TMP=/dump/.$${NAME}.tmp
          if pg_dump -Fc -h postgres -U "$${PGUSER}" -d "$${PGDATABASE}" -f "$${TMP}" && [ -s "$${TMP}" ]; then
            mv -f "$${TMP}" "/dump/$${NAME}"
            echo "[backup] OK /dump/$${NAME} ($$(stat -c %s "/dump/$${NAME}") bytes)"
            DAYS=$${BACKUP_KEEP_DAYS:-7}
            [ "$${DAYS}" -ge 1 ] 2>/dev/null || DAYS=1
            find /dump -maxdepth 1 -type f -name 'dump_*.psql' ! -name "$${NAME}" -mmin +$$((DAYS * 1440)) -print -delete
          else
            echo "[backup] FAIL: dump failed or empty, previous dumps kept" >&2
            rm -f "$${TMP}"
          fi
          sleep "$${BACKUP_FREQUENCY:-1d}" & wait $$!
        done
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: ["node.role == worker"]
      resources:
        reservations:
          memory: 64M
          cpus: '.05'
        limits:
          memory: 256M
          cpus: '.05'
      restart_policy:
        condition: any
        delay: 10s
    networks:
      - sksso-staging

  redis:
    image: docker.io/library/redis:7.2.4
    env_file: /var/data/config/sksso-staging/sksso.env
    command: redis-server --dir /data --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: ["node.role == worker"]
      resources:
        reservations:
          memory: 64M
          cpus: '.05'
        limits:
          memory: 256M
          cpus: '1.0'
      restart_policy:
        condition: any
        delay: 10s
    volumes:
      - /var/data/runtime/sksso-staging/redis:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - sksso-staging

  server:
    image: "ghcr.io/goauthentik/server:2024.4.2"
    env_file: /var/data/config/sksso-staging/sksso.env
    command: server
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: ["node.role == worker"]
      resources:
        reservations:
          memory: 512M
          cpus: '.5'
        limits:
          memory: 2G
          cpus: '2.0'
      restart_policy:
        condition: any
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=cloud-public-staging"
        - "traefik.http.routers.sksso-staging-server.rule=Host(`sso-staging.${BASE_DOMAIN}`)"
        - "traefik.http.routers.sksso-staging-server.priority=5"
        - "traefik.http.routers.sksso-staging-server.entrypoints=websecure"
        - "traefik.http.routers.sksso-staging-server.tls=true"
        - "traefik.http.routers.sksso-staging-server.tls.certresolver=main"
        - "traefik.http.routers.sksso-staging-server.tls.options=intermediate@file"
        - "traefik.http.routers.sksso-staging-server.service=sksso-staging-server"
        - "traefik.http.services.sksso-staging-server.loadbalancer.server.scheme=http"
        - "traefik.http.services.sksso-staging-server.loadbalancer.server.port=9000"
        - "traefik.http.services.sksso-staging-server.loadbalancer.sticky=true"
        - "traefik.http.services.sksso-staging-server.loadbalancer.sticky.cookie=true"
        - "traefik.http.services.sksso-staging-server.loadbalancer.sticky.cookie.name=authentik-session"
        - "traefik.http.services.sksso-staging-server.loadbalancer.sticky.cookie.secure=true"
        - "traefik.http.services.sksso-staging-server.loadbalancer.sticky.cookie.httpOnly=true"
        - "traefik.http.services.sksso-staging-server.loadbalancer.sticky.cookie.sameSite=strict"
        # Avoids cross-origin POST CSRF issues (Django rejects a cross-origin
        # POST that carries cookies)
        - "traefik.http.services.sksso-staging-http.loadbalancer.server.scheme=http"
        - "traefik.http.services.sksso-staging-http.loadbalancer.server.port=9000"
    volumes:
      - /var/data/sksso-staging/media:/media
      - /var/data/sksso-staging/custom-templates:/templates
      - /etc/localtime:/etc/localtime:ro
    networks:
      - cloud-public-staging
      - sksso-staging
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/-/health/live/').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  worker:
    image: "ghcr.io/goauthentik/server:2024.4.2"
    env_file: /var/data/config/sksso-staging/sksso.env
    command: worker
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: ["node.role == worker"]
      resources:
        reservations:
          memory: 256M
          cpus: '.25'
        limits:
          memory: 1G
          cpus: '1.0'
      restart_policy:
        condition: any
        delay: 10s
    networks:
      - sksso-staging
    volumes:
      - /var/data/sksso-staging/media:/media
      - /var/data/sksso-staging/certs:/certs
      - /var/data/sksso-staging/custom-templates:/templates
      - /etc/localtime:/etc/localtime:ro
    # A worker is a process with a `worker` argument and `manage` (`python -m
    # manage worker`: 2024.x runs celery in it, 2025.10+ dramatiq) or a celery
    # executable (older releases).
    # argv elements are compared exactly, so this check cannot match itself.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os; procs = [p for p in os.listdir('/proc') if p.isdigit()]; argvs = [open(f'/proc/{p}/cmdline').read().split(chr(0)) for p in procs if os.path.exists(f'/proc/{p}/cmdline')]; workers = [a for a in argvs if 'worker' in a and ('manage' in a or any(x.endswith('celery') for x in a))]; exit(0 if workers else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
