version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:v4.18.8
    env_file: /var/data/config/skgraph-prod/skgraph.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Main data storage - NFS backed for persistence.
      # NOTE: falkordb/falkordb stores its RDB/AOF under /var/lib/falkordb/data
      # (NOT /data). Binding the NFS dir at the image's real data dir is what
      # makes the graph data actually persist across container reschedules.
      - /var/data/skgraph-prod/data:/var/lib/falkordb/data
    ports:
      # Publish FalkorDB on the host via the swarm ingress routing mesh so
      # external clients can reach it directly at
      # <any-node-ip>:16379. Redis protocol on container port 6379.
      - target: 6379
        published: 16379
        protocol: tcp
        mode: ingress
    networks:
      - skgraph-prod
      - cloud-public-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 512M
      # FalkorDB uses Redis protocol (TCP 6379) - no web UI
      # Access via internal overlay network from other services
      # No Traefik labels needed

networks:
  skgraph-prod:
    external: true
  cloud-public-prod:
    external: true
