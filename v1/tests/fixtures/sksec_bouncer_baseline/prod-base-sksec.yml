# Docker Compose for sksec (CrowdSec Security) - Single & Multi-Node HA Support
#
# UNIFIED CONFIGURATION: Works seamlessly for both single-node and multi-node clusters
# Traefik service auto-detection: Automatically detects skfence or skfenceha during deployment
#
# Single-Node Mode:
#   - CrowdSec runs on any manager node (handles database + log analysis)
#   - Reads Traefik logs from: /var/data/logs/{traefik_service_name}-{env}/traefik/
#   - traefik_service_name is auto-detected (skfence or skfenceha)
#
# Multi-Node HA Mode:
#   - Reads Traefik logs from the shared /var/data mount the same way in
#     every mode: both the worker/ and acme/ subdirectories (every node
#     appends to its own file there; see acquis.yaml.j2). CrowdSec does not
#     need to run on any particular node to read them.
#   - Without sksec.DATA_NODE: pinned to the traefik.acme.master node (one
#     always exists, so this is just a cheap way to land on a single
#     stable node when there is no LAPI-db reason to pick one -- NOT
#     because CrowdSec needs anything local to the ACME master itself).
#   - With sksec.DATA_NODE: pinned to DATA_NODE only (see "LAPI db
#     location" below) -- the acme-master label is NOT also required.
#     skfenceha's manager selection is an ordered failover pick, not
#     guaranteed to land on any fixed hostname, so ANDing both constraints
#     together made the service permanently unschedulable the moment the
#     label landed on a manager other than DATA_NODE (found live on the
#     skstack06 lab, 2026-10-25, coord card sksec-ha-placement).
#   - traefik_service_name is auto-detected (skfence or skfenceha)
#   - Set TRAEFIK_HA_MODE=true in vault to enable HA mode
#
# Required environment variables (see sksec.env):
#   - TRAEFIK_HA_MODE (optional, defaults to false/auto-detect)
#   - CROWDSEC_BOUNCER_API_KEY
#   - Other CrowdSec configuration variables
#
# LAPI db location (see README.md "Moving the LAPI db off NFS"):
#   - sksec.DATA_NODE (optional): pins the crowdsec service to this node
#   - sksec.CROWDSEC_DB_PATH (optional): default is the legacy NFS path;
#     a path outside /var/data is local disk and REQUIRES DATA_NODE

version: '3.8'

networks:
  sksec-prod:
    external: true
  cloud-public-prod:
    external: true

services:
  # CrowdSec Service - Security event analysis and threat detection
  # In HA mode: Pinned to ACME master node (exclusive database write access)
  # In single-node: Runs on any manager node
  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.11
    env_file: /var/data/config/sksec-prod/sksec.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # === NFS DATA - DIRECT BIND (NO NAMED VOLUME) ===
      # CrowdSec needs to write hub data, collections, parsers during initialization
      # acquis.yaml is copied into this directory during deployment
      # The config dir (machine creds, hub data, acquis.yaml) stays on shared
      # storage regardless of sksec.DATA_NODE: it is read-mostly and small.
      - /var/data/runtime/sksec-prod/crowdsec-config:/etc/crowdsec/
      # The LAPI SQLite db is the hot path: every bouncer request reads it
      # and writes last_pull. On NFS this serializes under load and the
      # bouncer fails CLOSED (403) once a lookup passes CROWDSEC_TIMEOUT.
      # sksec.CROWDSEC_DB_PATH (+ sksec.DATA_NODE) moves it to local disk on
      # one pinned node, same pattern as sksso's DATA_NODE for postgres/redis.
      - /var/data/runtime/sksec-prod/crowdsec-db:/var/lib/crowdsec/data/
      # Traefik logs (Node-aware: Mount parent directories to enable wildcard patterns)
      # CrowdSec acquis.yaml uses wildcard patterns to read from all node-specific directories
      # Uses detected traefik_service_name (skfence or skfenceha) - auto-detected during deployment
      # HA mode (skfenceha): entrypoint.sh writes <log_dir>/{worker,acme}/access-<node>.log
      # (see skfenceha logrotate.conf.j2); mount the whole log dir read-only.
      - /var/data/logs/skfenceha-prod/traefik:/var/log/traefik:ro
    depends_on:
      - bouncer-traefik
    networks:
      - sksec-prod
      - cloud-public-prod
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
      mode: replicated
      replicas: 1
      placement:
        # sksec.DATA_NODE set: pin to the node holding the local LAPI db
        # ONLY (a path outside /var/data is local disk; moving crowdsec
        # without its db is an empty db, same risk sksso's DATA_NODE guards
        # against for postgres/redis). This is the single source of truth
        # for where crowdsec runs once a local db exists -- it is NOT also
        # ANDed with the HA acme-master label: skfenceha's manager
        # selection (an ordered failover pick) is not guaranteed to land on
        # any fixed hostname, so requiring both made the service
        # permanently unschedulable whenever they disagreed, with no
        # self-heal (found live on the skstack06 lab, 2026-10-25).
        # HA mode without DATA_NODE (not yet moved off NFS): pin to
        # whichever manager currently holds the acme-master label, same as
        # before -- a stable single node to run on, nothing more.
        # Neither set: single-node, runs on any node.
        preferences:
          - spread: node.labels.zone
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "cscli", "metrics", "--output", "json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bouncer-traefik:
    image: docker.io/fbonalair/traefik-crowdsec-bouncer:0.5.0
    env_file: /var/data/config/sksec-prod/sksec.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sksec-prod
      - cloud-public-prod
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
      mode: replicated
      replicas: 1
      placement:
        preferences:
          - spread: node.labels.zone
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    # Note: Bouncer healthcheck disabled due to API limitations
    # Consider implementing custom health check if needed

# No named volumes - all mounts are direct bind mounts
# Simpler, faster, zero-config
