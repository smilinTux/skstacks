    check:
      type: line_floor
      source: tag
      tag_pattern: '(\d+\.\d+\.\d+)'
      min_versions:
        "8.6": 3
    summary: >
      A client able to run the RESTORE command can trigger memory
      corruption leading to RCE. Fixed in 8.6.3. Honeypot-observed
