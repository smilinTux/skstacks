  - id: traefik-2026-10-22-batch
    cve_ids:
      - CVE-2026-114635
      - CVE-2026-114637
      - CVE-2026-114640
      - CVE-2026-114641
      - CVE-2026-114642
      - CVE-2026-114656
    aka: ""
    title: "Traefik auth-bypass / mTLS-spoofing batch"
    severity: high
    cvss: 8.7
    published: "2026-10-22"
    images: ["traefik"]
    check:
      type: min_fixed_version
      tag_pattern: 'v?(\d+\.\d+\.\d+)'
      fixed_version: "3.7.14"
    summary: >
      Six issues disclosed together on 2026-10-22, CVSS 3.7-8.7: forwarded
      Ssl-Client-* header spoofing on the Kubernetes Ingress-NGINX
      provider, an mTLS/NTLM connection-pool reuse bug, an SNI check bypass
      over HTTP/2, and TLS client-config reuse across services - several
      let an unauthenticated client skip a client-certificate requirement
      that Traefik is supposed to enforce. Fixed in 2.11.58 / 3.7.14. Our
      fleet runs the 3.6.x line, older than either fixed line and not
      itself covered by a dedicated patch per the sources found, so it is
      treated as affected regardless of per-router auth config: these bugs
      are in Traefik's own TLS/routing layer, ahead of any app-level or
      forward-auth middleware. Secondary-source confirmed (strix.ai,
      thehackerwire, vuldb); Traefik's own GitHub security-advisories page
      was not reachable to cross-check primary-source wording before this
      register was written - worth a follow-up read before patching.
    sources:
      - https://www.strix.ai/cve/CVE-2026-114640
      - https://www.thehackerwire.com/vulnerability/CVE-2026-114637/
      - https://www.strix.ai/cve/CVE-2026-114635
      - https://www.strix.ai/cve/CVE-2026-114642
      - https://vuldb.com/vuln/425115

