---
# skfenceha: the HA (multi-node) Traefik reverse proxy / load balancer.
# Adapted from core/skfence (the single-node variant); the two are not
# interchangeable (see src/error-pages/README.md and
# v1/ansible/core/skfence/README.md for why a fresh single-node instance
# should use skfence instead).
#
# HA shape: one manager node is labeled traefik.acme.master=true and runs
# traefik-acme (certificate renewal only, one replica). Every manager runs
# traefik-worker in global mode (all real routing, host-mode ports so client
# IPs are never SNATed). Workers read the ACME master's acme.json read-only;
# they never perform a certificate challenge themselves.
#
# TLS has the same instance-selectable modes as skfence (see
# src/config/skfenceha/skfenceha.env.j2 and traefik.yml.j2):
#   - skfenceha.ACME_ENABLED: false (default) -> Traefik's own self-signed
#     certificate. No public DNS or Cloudflare account needed.
#   - skfenceha.ACME_ENABLED: true -> Let's Encrypt via Cloudflare DNS-01.
#     Requires skfenceha.CLOUDFLARE_EMAIL and the vault secret
#     vault_skfenceha_cloudflare_dns_token (no defaults; both instance vars).
#
# Security features beyond skfence:
#   - skfenceha.DASHBOARD_AUTH_MODE: sso (default) | basic | lan. sso gates the
#     dashboard with the authentik forward-auth middleware only (no htpasswd is
#     rendered); basic needs skfenceha.DASHBOARD_AUTH_HASH (pre-hashed,
#     htpasswd -nbB; generate with src/skfenceha/create_user_password.sh);
#     lan admits only DASHBOARD_FALLBACK_ALLOW_CIDRS.
#   - skfenceha.DASHBOARD_SSO_MIDDLEWARE: sso mode's middleware name, default
#     authentik@file.
#   - skfenceha.WHITELIST_IPS: list of CIDRs/IPs, empty by default. When
#     non-empty, an ipAllowList middleware is added to the default chain.
#   - skfenceha.CROWDSEC_ENABLED: opt-in reference to an externally deployed
#     crowdsec-bouncer@file middleware + LAPI key; this stack does not run
#     CrowdSec itself.
#
# TODO before deploy: register the skfenceha-{{ env }} edge/socket-proxy
# overlay subnets in shared/networks if these placeholders collide on your
# estate (cloud-public-{{ env }} is intentionally shared across core
# services; cloud-edge/cloud-socket-proxy are the shared "current edge"
# networks, so their subnet must match whichever edge service - skfence or
# skfenceha - is actually active). Set the skfenceha vault vars (see v1/ansible/core/skfence/README.md
# for the full reference); ensure images are pullable on swarm nodes; label
# exactly one manager node traefik.acme.master=true before the first deploy
# (this playbook manages that label for you, moving it to target_manager_group's
# selected manager on every run).
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: select the manager that will hold the ACME-master role.
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Validate required target group
      assert:
        that:
          - target_manager_group is defined
          - target_manager_group != ''
          - target_manager_group != 'swarm_managers'
        fail_msg: "ERROR: 'target_manager_group' must be specified and cannot be the default 'swarm_managers'."

    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group }}"

# Step 2: deploy to the selected manager.
- hosts: selected_manager_group
  become: true
  vars:
    app: skfenceha
    env: staging
    service_name: skfenceha
    service_type: core
  pre_tasks:
    - name: Validate environment variable
      assert:
        that:
          - env is defined
          - env == 'staging'
        fail_msg: "ERROR: 'env' variable must be set to 'staging' for this playbook."

    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Validate skfenceha.DROP_FORWARDED_HEADERS (list of header names)
      vars:
        _drop_headers: "{{ skfenceha.DROP_FORWARDED_HEADERS | default([], true) }}"
      assert:
        that:
          - _drop_headers is sequence and _drop_headers is not string and _drop_headers is not mapping
          - _drop_headers | map('string') | reject('match', '^[A-Za-z0-9][A-Za-z0-9-]*$') | list | length == 0
        fail_msg: >-
          ERROR: skfenceha.DROP_FORWARDED_HEADERS must be a YAML list of HTTP
          header names, e.g. [X-Forwarded-Host].
        quiet: true

    - name: Define default network variables when not provided in vault
      set_fact:
        app_networks: "{{ skfenceha_staging_networks | default([
          { 'name': 'cloud-edge-staging', 'subnet': '172.16.204.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'cloud-public-staging', 'subnet': '172.16.201.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'cloud-socket-proxy-staging', 'subnet': '172.16.207.0/24', 'driver': 'overlay', 'attachable': true }
        ]) }}"
      tags:
        - networks
        - config

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    # traefik-worker runs on every manager (global) and each node writes its
    # own access-<hostname>.log into the shared log dir. Every manager gets
    # its own logrotate file naming only its own logs, because a node can
    # only signal its own Traefik. The name is the hostname Swarm hands
    # entrypoint.sh as NODE_HOSTNAME, read from each node.
    - name: Ensure logrotate is installed
      apt:
        name: logrotate
        state: present
        update_cache: yes
      delegate_to: "{{ item }}"
      loop: "{{ groups[target_manager_group] }}"

    - name: Read each manager hostname for its Traefik log file names
      command: hostname
      delegate_to: "{{ item }}"
      loop: "{{ groups[target_manager_group] }}"
      register: skfenceha_logrotate_nodes
      changed_when: false

    - name: Create logrotate configuration for {{ app }} logs
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/logrotate.conf.j2"
        dest: "/etc/logrotate.d/{{ app }}-{{ env }}"
        owner: root
        group: root
        mode: '0644'
      delegate_to: "{{ item.item }}"
      loop: "{{ skfenceha_logrotate_nodes.results }}"
      loop_control:
        label: "{{ item.item }}"
      vars:
        log_dir: "/var/data/logs/{{ app }}-{{ env }}/traefik"
        logrotate_node: "{{ item.stdout | trim }}"
        retention_days: "{{ skfenceha.LOGROTATE_ROTATE | default('7' if env == 'prod' else '3') }}"

    # Host-mode ports the traefik-worker publishes on every manager. Keep the
    # kernel NFS client off the ones inside its reserved range (993 with
    # MAIL_ENTRYPOINTS); see shared/tasks/nfs_resvport_guard.yml.
    - name: Keep NFS client source ports off the worker's host-mode ports
      include_tasks: ../../shared/tasks/nfs_resvport_guard.yml
      vars:
        nfs_resvport_guard_hosts: "{{ groups[target_manager_group] }}"
        nfs_resvport_guard_ports: "{{ [80, 443, 222, 8082] + ([25, 465, 587, 143, 993] if (skfenceha.MAIL_ENTRYPOINTS | default(false) | string | lower) in ['true', 'yes', '1', 'on'] else []) }}"
      tags: [sunrpc]

    - name: Create the {{ app }} directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "/var/data/{{ app }}-{{ env }}"
        - "/var/data/config/{{ app }}-{{ env }}"
        - "/var/data/config/{{ app }}-{{ env }}/dynamic"
        - "/var/data/config/{{ app }}-{{ env }}/dynamic_acme"
        - "/var/data/config/{{ app }}-{{ env }}/error-pages"
        - "/var/data/runtime/{{ app }}-{{ env }}"
        - "/var/data/runtime/{{ app }}-{{ env }}/acme"
        - "/var/data/runtime/{{ app }}-{{ env }}/certs"
        - "/var/data/logs/{{ app }}-{{ env }}"
        - "/var/data/logs/{{ app }}-{{ env }}/traefik"

    - name: Ensure acme.json exists and is locked down
      file:
        path: "/var/data/runtime/{{ app }}-{{ env }}/acme/acme.json"
        state: touch
        owner: root
        group: root
        mode: '0600'

    # HA mode: exactly one manager holds the ACME-master role. The label is
    # STICKY: when exactly one manager in the group carries it and that node
    # is Ready and Active, it stays there. It moves to this run's
    # selected_manager only when no manager has it, more than one has it, or
    # the holder is down or drained. skfenceha.ACME_MASTER_NODE pins it to a
    # named manager. (It used to move to whichever manager this run selected,
    # so a deploy that picked another manager moved traefik-acme too and left
    # skha's keepalived priorities, rendered from this label, out of date
    # until the next skha deploy.)
    - name: Keep or place the ACME master label (sticky)
      shell: |
        set -u
        pin={{ (skfenceha.ACME_MASTER_NODE | default('', true)) | string | quote }}
        sel={{ selected_manager | quote }}
        managers="{{ (groups[target_manager_group] | default([])) | join(' ') }}"
        has_label() {
          [ "$(docker node inspect "$1" --format '{{ '{{ index .Spec.Labels "traefik.acme.master" }}' }}' 2>/dev/null)" = "true" ]
        }
        labeled=""
        for n in $managers; do has_label "$n" && labeled="$labeled $n"; done
        set -- $labeled
        if [ -n "$pin" ]; then
          case " $managers " in *" $pin "*) ;; *) echo "ACME_MASTER_NODE '$pin' is not a manager in this group: $managers"; exit 3;; esac
          target=$pin; why=pinned
        elif [ $# -eq 1 ] && [ "$(docker node inspect "$1" --format '{{ '{{ .Status.State }} {{ .Spec.Availability }}' }}' 2>/dev/null)" = "ready active" ]; then
          target=$1; why=kept
        else
          target=$sel; why="moved (labeled:${labeled:- none})"
        fi
        changed=0
        for n in $labeled; do
          [ "$n" = "$target" ] && continue
          docker node update --label-rm traefik.acme.master "$n" >/dev/null && changed=1
        done
        if ! has_label "$target"; then
          docker node update --label-add traefik.acme.master=true "$target" >/dev/null || exit 4
          changed=1
        fi
        echo "ACME master: $target ($why)"
        [ $changed = 1 ] && echo CHANGED
        exit 0
      register: acme_label_result
      changed_when: "'CHANGED' in acme_label_result.stdout"
      failed_when: acme_label_result.rc | default(0) != 0
      tags:
        - labels
        - ha

    - name: Show HA mode info
      debug:
        msg: |
          {{ ((acme_label_result.stdout | default('', true)) or 'ACME master: (label task did not run)').splitlines()[0] }} (label traefik.acme.master=true)
          Managers in {{ target_manager_group }}: {{ (groups[target_manager_group] | default([])) | join(', ') }}
      tags:
        - labels

    - name: Deploy error-pages source files
      copy:
        src: "{{ playbook_dir }}/src/error-pages/{{ item }}"
        dest: "/var/data/config/{{ app }}-{{ env }}/error-pages/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - Dockerfile
        - server.py

    - name: Copy error-pages HTML template (server.py fills it per request)
      copy:
        src: "{{ playbook_dir }}/src/error-pages/error.html.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/error-pages/error.html"
        owner: root
        group: root
        mode: '0644'

    - name: Build error-pages Docker image
      community.docker.docker_image:
        name: "{{ app }}-{{ env }}-error-pages:latest"
        source: build
        build:
          path: "/var/data/config/{{ app }}-{{ env }}/error-pages"
          dockerfile: Dockerfile
        force_source: "{{ force_rebuild_error_pages | default(false) }}"

    - name: Process {{ app }} environment templates
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0640'
      loop:
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env" }
        - { src: "{{ app }}.sh.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env" }
      tags:
        - templates

    - name: Deploy Traefik entrypoint script
      copy:
        src: "{{ playbook_dir }}/src/config/{{ app }}/entrypoint.sh"
        dest: "/var/data/config/{{ app }}-{{ env }}/entrypoint.sh"
        owner: root
        group: root
        mode: '0755'

    - name: Deploy traefik-certs-watch sidecar script
      copy:
        src: "{{ playbook_dir }}/src/config/{{ app }}/certs-watch.sh"
        dest: "/var/data/config/{{ app }}-{{ env }}/certs-watch.sh"
        owner: root
        group: root
        mode: '0755'

    # Traefik's file provider reads the dynamic directory RECURSIVELY, hidden
    # directories included, and the first definition of a router or
    # middleware name wins. A leftover backup directory (for example a
    # `.bak-<date>` copy of the old files) therefore shadows every file this
    # play renders: the deploy reports changed, the edge keeps serving the old
    # config. Found on a production edge where two such directories had
    # silently disabled every dynamic change for three weeks. Fail loudly.
    - name: Find directories inside the dynamic config directories (they shadow the rendered files)
      find:
        paths:
          - "/var/data/config/{{ app }}-{{ env }}/dynamic"
          - "/var/data/config/{{ app }}-{{ env }}/dynamic_acme"
        file_type: directory
        hidden: true
        recurse: false
      register: skfenceha_dynamic_subdirs
      tags:
        - config
        - dynamic

    - name: Refuse to deploy dynamic config while a subdirectory shadows it
      assert:
        that:
          - ((skfenceha_dynamic_subdirs.files | default([])) | length == 0) or (skfenceha.ALLOW_DYNAMIC_SUBDIRS | default(false) | bool)
        fail_msg: >-
          Traefik's file provider reads these directories recursively and the first definition of a name wins, so
          {{ (skfenceha_dynamic_subdirs.files | default([])) | map(attribute='path') | list }} shadow the files this play renders.
          Move them out of the dynamic directories (backups belong under /var/data/backups), or set
          skfenceha.ALLOW_DYNAMIC_SUBDIRS: true if they are intentional.
      tags:
        - config
        - dynamic

    - name: Deploy dynamic config (routers, services, middlewares, TLS options) to both the worker and ACME-master directories
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.1.src }}"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ item.0 }}/{{ item.1.dest }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ ['dynamic', 'dynamic_acme'] | product(dynamic_config_files) | list }}"
      vars:
        dynamic_config_files:
          - { src: "routers.yml.j2", dest: "routers.yml" }
          - { src: "services.yml.j2", dest: "services.yml" }
          - { src: "dynamic-middlewares.yml.j2", dest: "middlewares.yml" }
          - { src: "dynamic-tls.yml.j2", dest: "tls.yml" }
      tags:
        - config
        - dynamic

    # Instance-owned dynamic files (skfenceha.EXTRA_DYNAMIC_FILES, default
    # empty = no-op). See this service's README.
    - name: Render instance EXTRA_DYNAMIC_FILES into the dynamic config dir(s)
      include_tasks:
        file: ../../shared/tasks/render_extra_dynamic_files.yml
        apply:
          tags:
            - config
            - dynamic
      when: (skfenceha.EXTRA_DYNAMIC_FILES | default([])) | length > 0
      vars:
        extra_dynamic_files: "{{ skfenceha.EXTRA_DYNAMIC_FILES | default([]) }}"
        extra_dynamic_config_dir: "/var/data/config/{{ app }}-{{ env }}"
        extra_dynamic_acme_supported: true
        extra_dynamic_reserved:
          - routers.yml
          - services.yml
          - middlewares.yml
          - tls.yml
          - sksec.yml
          - certs-generated.yml
          # rendered by the skmesh playbook (its 503 fallback router)
          - "skmesh-{{ env }}.yml"
      tags:
        - config
        - dynamic

    # The CrowdSec bouncer runs inside Traefik as a local plugin (sksec
    # BOUNCER_MODE: plugin). Install and checksum-verify the vendored source
    # BEFORE the static config and the stack that mount it are rendered.
    - name: Install the CrowdSec bouncer Traefik local plugin
      include_tasks:
        file: ../../shared/tasks/traefik_crowdsec_plugin.yml
        apply:
          tags:
            - config
            - compose
            - plugins
      vars:
        traefik_plugin_config_dir: "/var/data/config/{{ app }}-{{ env }}"
      when: skfenceha.CROWDSEC_PLUGIN_ENABLED | default(true) | bool
      tags:
        - config
        - compose
        - plugins

    - name: Render traefik.yml (ACME-master role) from template with vault secrets
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/traefik.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/traefik.yml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - config
        - secrets

    - name: Render traefik-worker.yml (routing role) from template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/traefik-worker.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/traefik-worker.yml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - config

    - name: Render {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - compose

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags:
        - deploy-script

    - name: Create {{ app }} control script symlink
      file:
        src: "/var/data/{{ app }}-{{ env }}/deploy"
        dest: "/var/data/deploy_{{ app }}-{{ env }}"
        force: yes
        owner: root
        group: root
        mode: '0755'
        state: link
      tags:
        - deploy-script

    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags:
        - networks

    - name: Pre-pull the stack images (a registry refusal must not take a running service down)
      include_tasks:
        file: ../../shared/tasks/prepull_images.yml
        apply:
          tags:
            - deploy
            - prepull
      tags:
        - deploy
        - prepull

    - name: Deploy {{ app }} stack
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        ./deploy
      register: deploy_output
      tags:
        - deploy

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags:
        - deploy

    - name: Create or update the skfenceha portal tile in Authentik
      # On by default (AUTHENTIK_TILE: true); opt out per instance with
      # AUTHENTIK_TILE: false. The dashboard is Traefik's own, gated by
      # the dashboard-chain middleware (DASHBOARD_AUTH_HASH/WHITELIST_IPS),
      # not necessarily the Authentik catch-all; this adds a bookmark tile
      # with no provider, same shape as every other role's.
      # See shared/tasks/authentik_portal_tile.yml.
      include_tasks: ../../shared/tasks/authentik_portal_tile.yml
      vars:
        portal_tile:
          enabled: "{{ skfenceha.AUTHENTIK_TILE | default(true) | bool }}"
          slug: "{{ skfenceha.AUTHENTIK_TILE_SLUG | default(app, true) }}"
          name: "{{ skfenceha.AUTHENTIK_TILE_NAME | default('SKFenceHA (Traefik Dashboard)', true) }}"
          launch_url: "https://{{ skfenceha.DASHBOARD_HOST | default('skfenceha' + ('-' + env if env != 'prod' else '') + '.' + (skfenceha.CLUSTERNAME | default(cluster_name)) + '.' + (skfenceha.DOMAIN | default(domain))) }}/dashboard/"
          group: "{{ skfenceha.AUTHENTIK_TILE_GROUP | default('skadmin', true) }}"
          icon: "{{ skfenceha.AUTHENTIK_TILE_ICON | default('fa://fa-route', true) }}"
          icon_file: "{{ skfenceha.AUTHENTIK_TILE_ICON_FILE | default('icon.png', true) }}"
          icon_name: "{{ skfenceha.AUTHENTIK_TILE_ICON_NAME | default('traefik', true) }}"
          open_in_new_tab: "{{ skfenceha.AUTHENTIK_TILE_OPEN_IN_NEW_TAB | default(true) | bool }}"
          description: "{{ skfenceha.AUTHENTIK_TILE_DESCRIPTION | default('', true) }}"
      tags:
        - config
        - authentik
