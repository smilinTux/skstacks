---
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
# Run on all hosts to ensure it executes even with -l limit
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: sksec
    env: dev
    service_name: sksec
    service_type: core
    sksec_crowdsec_db_path: "{{ sksec.CROWDSEC_DB_PATH | default('/var/data/runtime/sksec-dev/crowdsec-db', true) }}"
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml
    
    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Fail closed on a local CrowdSec LAPI db path without a pinned data node
      # A path outside /var/data is local disk on one node. Without
      # DATA_NODE, swarm may reschedule crowdsec elsewhere and start it
      # against an empty db: a fresh db still gets a working bouncer key
      # (CrowdSec re-registers BOUNCER_KEY_traefik from sksec.env at every
      # container start), but every local ban and CAPI/console sync state
      # is silently lost. Same guard shape as sksso's DATA_NODE for postgres/redis.
      assert:
        that:
          - >-
            (sksec.DATA_NODE | default('') | string | length > 0) or
            ((sksec_crowdsec_db_path | string).startswith('/var/data/'))
        fail_msg: >-
          sksec.CROWDSEC_DB_PATH points at local disk ({{ sksec_crowdsec_db_path }})
          but sksec.DATA_NODE is empty. Set DATA_NODE to the node holding the data.

    - name: Validate the bouncer knobs (BOUNCER_REPLICAS, BOUNCER_TRUSTED_PROXIES)
      vars:
        _sksec_proxies: "{{ sksec.BOUNCER_TRUSTED_PROXIES | default([], true) }}"
      assert:
        that:
          - (sksec.BOUNCER_REPLICAS | default('') | string) is match('^([1-9][0-9]*)?$')
          - _sksec_proxies is sequence and _sksec_proxies is not string and _sksec_proxies is not mapping
          - _sksec_proxies | map('string') | reject('match', '^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$') | list | length == 0
          - _sksec_proxies | map('string') | select('match', '^(0\\.0\\.0\\.0|::)/0$') | list | length == 0
        fail_msg: >-
          ERROR: sksec.BOUNCER_REPLICAS must be a whole number >= 1, and
          sksec.BOUNCER_TRUSTED_PROXIES a YAML list of IP addresses or CIDRs
          (not 0.0.0.0/0 or ::/0, which is the unsafe default it replaces).
        quiet: true

    # fbonalair's bouncer appends no port: a bare service name dials the
    # LAPI on 80 while it listens on 8080, every check fails, and the
    # bouncer fails closed (403 on every protected router).
    - name: Validate CROWDSEC_AGENT_HOST (<host>:<port>)
      assert:
        that:
          - (sksec.CROWDSEC_AGENT_HOST | default('', true) | string) is match('^([A-Za-z0-9._-]+:[0-9]{1,5})?$')
        fail_msg: >-
          ERROR: sksec.CROWDSEC_AGENT_HOST must be <host>:<port> with no scheme,
          e.g. sksec-{{ env }}_crowdsec:8080 (leave it unset for that default).
          Without the port the bouncer dials port 80 and answers 403 to everything.
        quiet: true

    - name: Define default network variables when not provided in vault
      # ⚠️ IMPORTANT: Network subnets MUST match shared/networks registry
      # Reference: See shared/networks for all registered network subnets
      # Networks are created by create_networks.yml shared task (included below)
      set_fact:
        app_networks: "{{ sksec_dev_networks | default([
          { 'name': 'sksec-dev', 'subnet': '172.16.240.0/24' },
          { 'name': 'cloud-public-dev', 'subnet': '172.16.202.0/24' }
        ]) }}"
      tags:
        - networks

    - name: Check Traefik ACME master label presence (warn-only)
      shell: |
        for n in {{ (groups[target_manager_group | default('swarm_managers')] | default([])) | join(' ') }}; do
          echo -n "$n: "; docker node inspect $n --format '{{'{{ .Spec.Labels }}'}}' | grep -q 'traefik.acme.master' && echo "✓ Has ACME master label" || echo "✗ Missing ACME master label"
        done
      register: label_check
      changed_when: false
      failed_when: false
      tags:
        - labels
      delegate_to: >-
        {{ selected_manager }}
    - name: Show manual command to add ACME master label if missing (HA mode)
      debug:
        msg: |
          {% if sksec.TRAEFIK_HA_MODE | default(false) | bool %}
          HA Mode Enabled: CrowdSec is constrained to the node labelled traefik.acme.master=true.
          skfenceha's deploy owns that label; sksec only reads it and never moves it.
          {% else %}
          Single-Node Mode: No ACME master label required (only one manager node)
          {% endif %}
          Managers detected: {{ (groups[target_manager_group | default('swarm_managers')] | default([])) | join(', ') }}
          Selected manager: {{ selected_manager }}
      when: label_check is defined
  tasks:
    - name: deploying {{ app }}
      debug:
        msg: Running Skstack deploy {{ app }} scripts...

    - name: Detect Traefik setup (skfence or skfenceha)
      ansible.builtin.include_tasks: ../../shared/tasks/detect_traefik_setup.yml
      tags:
        - always
        - traefik
        - config

    - name: Ensure logrotate is installed
      apt:
        name: logrotate
        state: present
        update_cache: yes

    - name: Create the {{ app }} directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: 0755
      loop:
        - /var/data/{{ app }}-{{ env }}
        - /var/data/config/{{ app }}-{{ env }}
        - /var/data/runtime/{{ app }}-{{ env }}
        - /var/data/{{ app }}-{{ env }}/crowdsec/config
        - /var/data/{{ app }}-{{ env }}/crowdsec/crowdsec-config
        - /var/data/runtime/{{ app }}-{{ env }}/crowdsec-config
        # Traefik access log dir (read-only in the crowdsec container)
        - /var/data/logs/{{ traefik_service_name | default('skfence') }}-{{ env }}/traefik

    - name: Create the {{ app }} LAPI db directory on shared storage
      # Only when it is still the legacy NFS path; a local path is created
      # on DATA_NODE below, and an old NFS dir is left alone once it moved
      # (see README.md "Moving the LAPI db off NFS").
      file:
        path: "{{ sksec_crowdsec_db_path }}"
        state: directory
        owner: root
        group: root
        mode: 0755
      when: (sksec_crowdsec_db_path | string).startswith('/var/data/')

    - name: Create the {{ app }} local LAPI db directory on the data node (not recursive)
      file:
        path: "{{ sksec_crowdsec_db_path }}"
        state: directory
        owner: root
        group: root
        mode: 0750
      when: not (sksec_crowdsec_db_path | string).startswith('/var/data/')
      # Ansible templates delegate_to for every task before it evaluates
      # when, so this must render with DATA_NODE unset too (the assert
      # above already requires DATA_NODE whenever this task actually runs).
      delegate_to: "{{ sksec.DATA_NODE | default(inventory_hostname, true) }}"

    - name: Ensure secret directory exists
      file:
        path: /var/data/config/{{ app }}-{{ env }}/secret
        state: directory
        owner: root
        group: root
        mode: 0750

    - name: Check if persisted bouncer key exists
      stat:
        path: /var/data/config/{{ app }}-{{ env }}/secret/bouncer.key
      register: bouncer_key_file

    - name: Generate and persist bouncer key if missing and not provided in vault
      shell: |
        umask 027
        openssl rand -base64 32 | tr -d '\n' > /var/data/config/{{ app }}-{{ env }}/secret/bouncer.key
      args:
        executable: /bin/bash
      when: not bouncer_key_file.stat.exists and ((sksec.CROWDSEC_BOUNCER_API_KEY | default('') | length) == 0)

    # Read whenever the vault gives no key: the file exists by now either way
    # (persisted earlier, or generated just above). Gating this on the stat
    # taken BEFORE the generation skipped the read on a first install, left
    # the computed key empty and stopped the deploy below.
    - name: Read persisted bouncer key (vault key unset)
      slurp:
        src: /var/data/config/{{ app }}-{{ env }}/secret/bouncer.key
      register: persisted_bouncer_key
      when: (sksec.CROWDSEC_BOUNCER_API_KEY | default('') | length) == 0

    - name: Set computed bouncer key (vault overrides persisted)
      set_fact:
        computed_bouncer_key: "{{ (sksec.CROWDSEC_BOUNCER_API_KEY | default('')) | ternary(sksec.CROWDSEC_BOUNCER_API_KEY, (persisted_bouncer_key.content | default('') | b64decode | trim)) }}"

    - name: Fail if bouncer key still missing (safety)
      fail:
        msg: "CROWDSEC_BOUNCER_API_KEY could not be determined"
      when: computed_bouncer_key | length == 0

    - name: Copy {{ app }} config files except templates
      copy:
        src: "{{ item }}"
        dest: /var/data/config/{{ app }}-{{ env }}/
        owner: root
        group: root
        mode: 0644
      with_fileglob:
        - "src/config/{{ app }}/*"
      when: "'.j2' not in item"
      tags:
        - config

    - name: Copy {{ app }} base src files (excluding templates)
      copy:
        src: "{{ item }}"
        dest: "/var/data/{{ app }}-{{ env }}/{{ item | basename }}"
        owner: root
        group: root
        mode: '0644'
      with_fileglob:
        - "src/{{ app }}/*"
      when: "'.j2' not in item"
      tags:
        - parentdir
        - backup

    - name: Check if {{ app }}.sh.env already exists on target
      stat:
        path: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env"
      register: sh_env_exists
      tags:
        - templates

    - name: Process {{ app }} environment templates from config directory (excluding .sh.env if it exists)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '{{ item.mode | default("0644") }}'
      loop:
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env", mode: "0640" }
        - { src: "{{ app }}.yml.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml", mode: "0644" }
      when: item.src != "{{ app }}.sh.env.j2"
      tags:
        - templates

    - name: Create {{ app }}.sh.env only if it doesn't exist
      ansible.builtin.template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.sh.env.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env"
        owner: root
        group: root
        mode: '0640'
      when: not sh_env_exists.stat.exists
      tags:
        - templates

    # The bouncer is registered by CrowdSec itself at container start from
    # BOUNCER_KEY_traefik in sksec.env (docker_start.sh register_bouncer), so
    # no cscli call carries the key on a command line.

    - name: Ensure the CrowdSec local s02-enrich parser dir exists
      ansible.builtin.file:
        path: "/var/data/runtime/{{ app }}-{{ env }}/crowdsec-config/parsers/s02-enrich"
        state: directory
        owner: root
        group: root
        mode: '0755'
      tags:
        - templates
        - allowlist

    - name: Render the sksec allowlist parser (sksec.ALLOWLIST_CIDRS)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/src/{{ app }}/crowdsec/config/parsers/s02-enrich/sksec-allowlist.yaml.j2"
        dest: "/var/data/runtime/{{ app }}-{{ env }}/crowdsec-config/parsers/s02-enrich/sksec-allowlist.yaml"
        owner: root
        group: root
        mode: '0644'
      when: (sksec.ALLOWLIST_CIDRS | default([])) | length > 0
      tags:
        - templates
        - allowlist

    - name: Remove the sksec allowlist parser when ALLOWLIST_CIDRS is empty
      ansible.builtin.file:
        path: "/var/data/runtime/{{ app }}-{{ env }}/crowdsec-config/parsers/s02-enrich/sksec-allowlist.yaml"
        state: absent
      when: (sksec.ALLOWLIST_CIDRS | default([])) | length == 0
      tags:
        - templates
        - allowlist

    - name: Process {{ app }} acquis.yaml template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/src/{{ app }}/crowdsec/config/acquis.yaml.j2"
        dest: "/var/data/{{ app }}-{{ env }}/crowdsec/config/acquis.yaml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - templates

    - name: Copy acquis.yaml into crowdsec-config directory (for reference)
      ansible.builtin.copy:
        src: "/var/data/{{ app }}-{{ env }}/crowdsec/config/acquis.yaml"
        dest: "/var/data/{{ app }}-{{ env }}/crowdsec/crowdsec-config/acquis.yaml"
        owner: root
        group: root
        mode: '0644'
        remote_src: yes
      tags:
        - templates

    - name: Copy acquis.yaml into runtime config directory (for container)
      ansible.builtin.copy:
        src: "/var/data/{{ app }}-{{ env }}/crowdsec/config/acquis.yaml"
        dest: "/var/data/runtime/{{ app }}-{{ env }}/crowdsec-config/acquis.yaml"
        owner: root
        group: root
        mode: '0644'
        remote_src: yes
      tags:
        - templates

    # Traefik routing is now configured via Docker labels (Docker provider)
    # No file provider deployment needed - all labels in compose file per new SOP
    # Certificates: Provided by traefik-certs-dumper (runs on skfence/skfenceha ACME master node)

    # skfenceha runs two Traefik roles: the workers read dynamic/, the
    # ACME master reads dynamic_acme/. Both chains name crowdsec-bouncer@file
    # once skfenceha has CROWDSEC_ENABLED, so both need the middleware, or
    # every router there using it is disabled. skfence has one dir.
    - name: Ensure the Traefik dynamic directories exist
      ansible.builtin.file:
        path: "/var/data/config/{{ traefik_service_name | default('skfence') }}-{{ env }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: "{{ ['dynamic'] + (['dynamic_acme'] if (traefik_service_name | default('skfence')) == 'skfenceha' else []) }}"
      tags:
        - templates

    - name: Deploy CrowdSec bouncer middleware configuration (flat structure)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/sksec-dynamic.yml.j2"
        dest: "/var/data/config/{{ traefik_service_name | default('skfence') }}-{{ env }}/{{ item }}/sksec.yml"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ ['dynamic'] + (['dynamic_acme'] if (traefik_service_name | default('skfence')) == 'skfenceha' else []) }}"
      tags:
        - templates

    - name: Process {{ app }} deploy script template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags:
        - templates
        - deploy-script

    - name: create {{ app }} control script symlink
      file:
          src: /var/data/{{ app }}-{{ env }}/deploy 
          dest: /var/data/deploy_{{ app }}-{{ env }}
          force: yes
          owner: root
          group: root
          mode: 0755
          state: link 

    - name: create {{ app }} docker-compose.yml symlink
      file:
        src: /var/data/config/{{ app }}-{{ env }}/{{ app }}.yml
        dest: /var/data/config/{{ app }}-{{ env }}/docker-compose.yml
        force: yes
        owner: root
        group: root
        mode: 0755
        state: link 

    - name: Ensure overlay networks exist from sk_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags:
        - networks

    # WAL is only safe once the db is on local disk (sksec.DATA_NODE set):
    # on NFS, WAL's shared-memory file semantics are not reliably safe
    # across clients and are exactly the failure mode this move avoids.
    - name: Enable SQLite WAL mode for the local-disk CrowdSec LAPI db
      include_tasks:
        file: tasks/enable_wal.yml
        apply:
          tags:
            - wal
            - deploy
      when: (sksec.DATA_NODE | default('')) | string | length > 0
      tags:
        - wal
        - deploy

    - name: Deploy {{ app }} stack
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        ./deploy
      register: deploy_output
      tags:
        - deploy

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags:
        - deploy

    # The parser above only filters LOCAL detections. A LAPI allowlist is
    # applied to every decision (CAPI community blocklist, console
    # blocklists, cscli decisions add), so sync ALLOWLIST_CIDRS into one too.
    - name: Sync ALLOWLIST_CIDRS into the CrowdSec LAPI allowlist
      include_tasks:
        file: tasks/lapi_allowlist.yml
        apply:
          tags:
            - allowlist
            - deploy
      when: sksec.LAPI_ALLOWLIST_ENABLED | default(true) | bool
      tags:
        - allowlist
        - deploy
