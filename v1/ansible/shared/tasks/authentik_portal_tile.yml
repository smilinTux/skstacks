# Shared task: create or update a provider-less Authentik portal tile
# (core.Application, no provider, bound to a group) for a service that
# already sits behind the cluster's domain-wide Traefik ForwardAuth
# catch-all. This gives it a dashboard bookmark on the Authentik portal
# without touching auth itself.
#
# Caller contract: set `app` and `env` as usual, and define a `portal_tile`
# dict before including this file:
#   portal_tile:
#     enabled: true                      # opt-in; nothing runs when false
#     slug: skpulse                      # Application slug
#     name: "SKPulse (Uptime Kuma)"      # Application display name
#     launch_url: "https://skpulse.example.com"
#     group: "authentik Admins"          # must already exist in Authentik
#     icon: "fa://fa-heart-pulse"        # optional fallback, "fa://fa-..." or an
#                                         # already-uploaded "application-icons/<file>"
#     icon_file: "icon.png"              # optional: a file the role ships at
#                                         # src/config/<app>/<icon_file>. When present
#                                         # (checked on the controller) this wins over
#                                         # `icon`: it is copied to sksso's own media
#                                         # volume (/var/data/sksso-<env>/media/public/
#                                         # application-icons/sk/<icon_name><ext>) and
#                                         # meta_icon is set to that path. Authentik
#                                         # 2025.12+ has no API endpoint to set an
#                                         # application's icon from a URL/upload (the
#                                         # old set_icon action now answers 405); a
#                                         # file placed directly in its media volume,
#                                         # referenced by meta_icon, is the only way.
#     icon_name: "uptime-kuma"           # optional: the uploaded file's basename
#                                         # (default: `slug`). Set this to the same
#                                         # name across dev/staging/prod (a bare
#                                         # service name, no env suffix) so every
#                                         # environment shares one uploaded copy
#                                         # instead of writing three, and so it
#                                         # matches a name already uploaded by hand
#                                         # (this repo's own icon-sourcing note, or an
#                                         # instance's pre-existing upload) rather than
#                                         # orphaning it on the next deploy.
#     open_in_new_tab: true              # optional, default true
#     description: ""                    # optional
#     category: ""                       # optional, the portal's own UI grouping label
#
# Needs sksso's automation token (sksso.api_token in sksso's vault,
# bootstrapped once per cluster with sksso's src/sksso/ensure-api-token.sh,
# the same token optional/skrac and optional/skmesh already use). sksso's
# vault file is found the same way those roles find it: this app's own
# vault filename with its `<app>-` prefix swapped for `sksso-`.
#
# Nothing here creates the group: a typo in `portal_tile.group`, or a
# cluster where that group does not exist yet, fails loudly instead of
# silently shipping a tile nobody can see.

- name: "Portal tile ({{ app }}): locate sksso's vault (holds sksso.api_token)"
  set_fact:
    portal_tile_sksso_vault_file: >-
      {{ portal_tile.authentik_vault_file | default((vault_file_path | dirname) ~ '/'
         ~ (vault_file_path | basename | regex_replace('^' ~ app ~ '-', 'sksso-'))) }}
  when: portal_tile.enabled | default(false) | bool

- name: "Portal tile ({{ app }}): load sksso's vault"
  include_vars:
    file: "{{ portal_tile_sksso_vault_file }}"
    name: portal_tile_sksso_vault
  no_log: true
  when: portal_tile.enabled | default(false) | bool

- name: "Portal tile ({{ app }}): check the Authentik automation token is present"
  assert:
    that:
      - (portal_tile_sksso_vault.sksso.api_token | default('') | string | length) >= 32
    fail_msg: >-
      sksso.api_token (32+ chars) is missing from {{ portal_tile_sksso_vault_file }}.
      Generate it (openssl rand -hex 32), add it to sksso's vault, and register it in
      Authentik once with sksso's src/sksso/ensure-api-token.sh (see the sksso README).
    quiet: true
  when: portal_tile.enabled | default(false) | bool

- name: "Portal tile ({{ app }}): check whether the role ships an icon file"
  stat:
    path: "{{ playbook_dir }}/src/config/{{ app }}/{{ portal_tile.icon_file }}"
  register: portal_tile_icon_stat
  delegate_to: localhost
  become: false
  when: (portal_tile.enabled | default(false) | bool) and (portal_tile.icon_file | default('') | length > 0)

- name: "Portal tile ({{ app }}): ensure sksso's uploaded-icons directory exists"
  file:
    path: "/var/data/sksso-{{ env }}/media/public/application-icons/sk"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0755'
  when: (portal_tile.enabled | default(false) | bool) and (portal_tile_icon_stat.stat.exists | default(false))

- name: "Portal tile ({{ app }}): copy the role's icon file into sksso's media"
  # Authentik 2025.12+ has no API endpoint to set an icon from a URL/upload
  # (the old set_icon action answers 405); a file placed directly in its
  # media volume, referenced by meta_icon below, is the only way.
  copy:
    src: "{{ playbook_dir }}/src/config/{{ app }}/{{ portal_tile.icon_file }}"
    dest: >-
      /var/data/sksso-{{ env }}/media/public/application-icons/sk/{{ portal_tile.icon_name | default(portal_tile.slug, true) }}{{
      (portal_tile.icon_file | regex_search('(\.[A-Za-z0-9]+)$')) | default('.png', true) }}
    owner: '1000'
    group: '1000'
    mode: '0644'
  when: (portal_tile.enabled | default(false) | bool) and (portal_tile_icon_stat.stat.exists | default(false))

- name: "Portal tile ({{ app }}): resolve the icon (an uploaded file wins over the fa:// fallback)"
  set_fact:
    portal_tile_resolved_icon: >-
      {{ ('application-icons/sk/' ~ (portal_tile.icon_name | default(portal_tile.slug, true)) ~
          ((portal_tile.icon_file | default('', true) | regex_search('(\.[A-Za-z0-9]+)$')) | default('.png', true)))
         if (portal_tile_icon_stat.stat.exists | default(false))
         else (portal_tile.icon | default('')) }}
  when: portal_tile.enabled | default(false) | bool

- name: "Portal tile ({{ app }}): build the provisioner input"
  set_fact:
    portal_tile_input:
      url: "{{ portal_tile.authentik_internal_url | default('http://sksso-' ~ env ~ '_server:9000') }}"
      host: "{{ portal_tile.sso_host | default('sso' ~ ('' if env == 'prod' else '-' ~ env) ~ '.' ~ (portal_tile.base_domain | default(domain))) }}"
      token: "{{ portal_tile_sksso_vault.sksso.api_token }}"
      slug: "{{ portal_tile.slug }}"
      name: "{{ portal_tile.name }}"
      launch_url: "{{ portal_tile.launch_url }}"
      group: "{{ portal_tile.group | default('authentik Admins') }}"
      icon: "{{ portal_tile_resolved_icon | default('') }}"
      open_in_new_tab: "{{ portal_tile.open_in_new_tab | default(true) | bool }}"
      description: "{{ portal_tile.description | default('') }}"
      category: "{{ portal_tile.category | default('') }}"
  no_log: true
  when: portal_tile.enabled | default(false) | bool

- name: "Portal tile ({{ app }}): stage the provisioner"
  copy:
    src: "{{ playbook_dir }}/../../shared/src/authentik_portal_tile.py"
    dest: "/var/data/config/{{ app }}-{{ env }}/authentik_portal_tile.py"
    owner: root
    group: root
    mode: '0644'
  when: portal_tile.enabled | default(false) | bool

- name: "Portal tile ({{ app }}): create or update the Application and its group binding"
  command:
    argv:
      - docker
      - run
      - --rm
      - -i
      - --network
      - "{{ portal_tile.authentik_network | default('sksso-' ~ env) }}"
      - -v
      - "/var/data/config/{{ app }}-{{ env }}/authentik_portal_tile.py:/authentik_portal_tile.py:ro"
      - "{{ portal_tile.provisioner_image | default('python:3.13.15-alpine@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f') }}"
      - python
      - /authentik_portal_tile.py
    stdin: "{{ portal_tile_input | to_json }}"
  register: portal_tile_provision
  changed_when: "'created' in portal_tile_provision.stdout or 'updated (' in portal_tile_provision.stdout"
  failed_when: false
  no_log: true
  when: portal_tile.enabled | default(false) | bool

# The provisioner prints status lines only (never a secret), so its output
# is safe to show; the task above is no_log because its stdin is secret.
- name: "Portal tile ({{ app }}): show the provisioner result"
  debug:
    msg: "{{ (portal_tile_provision.stdout_lines | default([])) + (portal_tile_provision.stderr_lines | default([])) }}"
  when: portal_tile.enabled | default(false) | bool

- name: "Portal tile ({{ app }}): fail if provisioning failed"
  fail:
    msg: "Authentik portal tile provisioning failed (rc={{ portal_tile_provision.rc | default('?') }}), see the lines above"
  when: (portal_tile.enabled | default(false) | bool) and (portal_tile_provision.rc | default(1)) != 0
