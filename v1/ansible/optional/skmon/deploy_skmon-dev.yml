---
# skmon: monitoring stack (VictoriaMetrics, Grafana, Loki,
# Alertmanager), adapted from
# optional/skgraph and optional/skmem-pg SOP.
# TODO before deploy: register the skmon-{{ env }} overlay subnet in
# shared/networks (pick a free /24 if these placeholders collide on your
# estate); set the skmon vault vars (see src/config/skmon/skmon.env.j2 and
# skmon.sh.env.j2 for the full list); ensure images are pullable on swarm
# nodes.
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skmon
    env: dev
    service_name: skmon
    service_type: optional
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined
      no_log: true

    - name: Check the skmon vault and derive the data facts
      include_tasks: "{{ playbook_dir }}/tasks/guards.yml"
      tags:
        - always

    - name: Derive the skmon agent scrape targets
      include_tasks: "{{ playbook_dir }}/tasks/agent_targets.yml"
      tags:
        - always

    - name: Check the skmon agent addresses
      include_tasks: "{{ playbook_dir }}/tasks/agent_guards.yml"
      tags:
        - always

    - name: Create the skmon local data directories
      include_tasks: "{{ playbook_dir }}/tasks/data_dirs.yml"
      tags:
        - always

    - name: Restrict the skmon agent, Loki push, Pyroscope and healthz ports on DATA_NODE
      include_tasks: "{{ playbook_dir }}/tasks/port_allowlist.yml"
      vars:
        skmon_fw_node: "{{ skmon_data_node }}"
      tags:
        - always

    - name: Define network variables (⚠️ TODO register subnet in shared/networks — placeholder)
      # Networks are created idempotently by the create_networks.yml shared
      # task below. Reference: See shared/networks for all registered
      # network subnets.
      set_fact:
        app_networks: "{{ skmon.networks | default([
          { 'name': 'skmon-dev', 'subnet': '172.16.225.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'cloud-public-dev', 'subnet': '172.16.202.0/24', 'driver': 'overlay', 'attachable': true }
        ]) }}"
      tags:
        - networks
        - config

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    - name: Create the {{ app }} directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "/var/data/{{ app }}-{{ env }}", owner: "root", group: "root", mode: "0755" }
        - { path: "/var/data/config/{{ app }}-{{ env }}", owner: "root", group: "root", mode: "0755" }
        - { path: "/var/data/config/{{ app }}-{{ env }}/configs", owner: "root", group: "root", mode: "0750" }
        - { path: "/var/data/config/{{ app }}-{{ env }}/secrets", owner: "root", group: "root", mode: "0700" }

    - name: Process {{ app }} environment templates
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0640'
      loop:
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env" }
        - { src: "{{ app }}.sh.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env" }
      tags:
        - templates

    # --- probe list for the agent play (R9) -------------------------------------------
    # skmon_probes is set here, on the selected manager, because agent.yml reads it from
    # that host's hostvars; it comes before the config render because vm-scrape.yml.j2 turns
    # it into the alloy-blackbox targets (the series labels probe, severity, forward_auth).
    # On a first install the stack's own routers do not exist yet and appear on the next
    # deploy. skmon.PROBES wins when set; otherwise one probe per Traefik
    # router host on the estate, read from every service's labels (the parsing is the
    # skmon_probes_from_services filter in filter_plugins/). The Authentik health probe is
    # appended when skmon can tell the sksso host (skmon.AUTHENTIK_HOST, else sksso's
    # vault); without either the entry is omitted and the deploy carries on.

    - name: List the Swarm service IDs
      command: docker service ls -q
      register: skmon_service_ids
      changed_when: false
      when: not skmon_parked and (skmon.PROBES | default([], true) | length) == 0
      tags:
        - config
        - probes

    - name: Inspect every service for its Traefik router labels
      command:
        argv: "{{ ['docker', 'service', 'inspect'] + skmon_service_ids.stdout_lines }}"
      register: skmon_service_inspect
      changed_when: false
      when:
        - not skmon_parked
        - (skmon.PROBES | default([], true) | length) == 0
        - skmon_service_ids.stdout_lines | default([]) | length > 0
      tags:
        - config
        - probes

    - name: Locate sksso's vault (for the Authentik health probe host)
      set_fact:
        skmon_sksso_vault_file: >-
          {{ (vault_file_path | dirname) ~ '/'
             ~ (vault_file_path | basename | regex_replace('^skmon-', 'sksso-')) }}
      when: vault_file_path is defined and (skmon.AUTHENTIK_HOST | default('', true)) == ''
      tags:
        - config
        - probes

    - name: Load sksso's vault when it exists
      include_vars:
        file: "{{ skmon_sksso_vault_file }}"
        name: skmon_sksso_vault
      when: skmon_sksso_vault_file is defined and (lookup('ansible.builtin.fileglob', skmon_sksso_vault_file) | length) > 0
      no_log: true
      tags:
        - config
        - probes

    - name: Derive the Authentik host for the health probe
      set_fact:
        skmon_authentik_host: >-
          {{ skmon.AUTHENTIK_HOST | default('', true)
             or (('sso' ~ ('' if env == 'prod' else '-' ~ env) ~ '.'
                  ~ ((skmon_sksso_vault.sksso.DOMAIN | string) if (skmon_sksso_vault.sksso.CLOUDFLARED | default(false) | bool)
                     else ((skmon_sksso_vault.sksso.CLUSTERNAME | string) ~ '.' ~ (skmon_sksso_vault.sksso.DOMAIN | string))))
                 if (skmon_sksso_vault is defined and (skmon_sksso_vault.sksso.DOMAIN | default('', true)) != '') else '') }}
      tags:
        - config
        - probes

    - name: Say that the Authentik health probe is left out
      debug:
        msg: >-
          skmon cannot tell the sksso host (no skmon.AUTHENTIK_HOST and no sksso vault with
          DOMAIN), so the authentik health probe is omitted. Set skmon.AUTHENTIK_HOST to add it.
      when: skmon_authentik_host == ''
      tags:
        - config
        - probes

    - name: Set the skmon probe list
      set_fact:
        skmon_probes: >-
          {{ ((skmon.PROBES | default([], true)) if (skmon.PROBES | default([], true) | length) > 0
              else (skmon_service_inspect.stdout | default('[]', true) | from_json
                    | skmon_probes_from_services(skmon.FORWARD_AUTH_MIDDLEWARE | default('authentik@file'))))
             | skmon_with_authentik_probe(skmon_authentik_host) }}
      tags:
        - config
        - probes

    # MonitorDiskFilling (rules/meta.yml.j2) watches the filesystem that holds DATA_PATH.
    - name: Find the filesystem that holds DATA_PATH on the data node
      command:
        argv: ["findmnt", "-n", "-o", "TARGET", "-T", "{{ skmon_data_path }}"]
      register: skmon_data_findmnt
      delegate_to: "{{ skmon_data_node }}"
      changed_when: false
      failed_when: false
      tags:
        - config

    - name: Set the DATA_PATH mountpoint
      # The root filesystem when findmnt fails (DATA_PATH not created yet, findmnt missing).
      set_fact:
        skmon_data_mountpoint: >-
          {{ (skmon_data_findmnt.stdout | default('', true) | trim)
             if (skmon_data_findmnt.rc | default(1)) == 0 and (skmon_data_findmnt.stdout | default('', true) | trim) != ''
             else '/' }}
      tags:
        - config

    - name: Render the {{ app }} Swarm config contents
      # Contents live in a variable (the compose template names each config after
      # the sha256 of its content) and are written to disk only so the docker CLI
      # can read them once at stack deploy; the running stack never reads /var/data.
      set_fact:
        skmon_configs:
          vm-scrape: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/vm-scrape.yml.j2') }}"
          loki: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/loki-config.yml.j2') }}"
          alertmanager: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/alertmanager-config.yml.j2') }}"
          rules-node: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/rules/node.yml.j2') }}"
          rules-storage: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/rules/storage.yml.j2') }}"
          rules-http: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/rules/http.yml.j2') }}"
          rules-cert: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/rules/cert.yml.j2') }}"
          rules-capacity: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/rules/capacity.yml.j2') }}"
          rules-container: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/rules/container.yml.j2') }}"
          rules-swarm: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/rules/swarm.yml.j2') }}"
          rules-meta: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/rules/meta.yml.j2') }}"
          loki-rules: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/loki-rules/storage.yml.j2') }}"
          # The bridge script from this repository and the estate's sk-alert from the controller
          # (SKALERT_SCRIPT_SRC, hash-checked by tasks/guards.yml). rstrip=False keeps the bytes exact.
          skmon_bridge.py: "{{ lookup('ansible.builtin.file', playbook_dir + '/src/skmon/bridge/skmon_bridge.py', rstrip=False) }}"
          sk-alert: "{{ lookup('ansible.builtin.file', skmon_skalert_src, rstrip=False) }}"
          # The Swarm exporter script, delivered like the bridge script.
          skswarm_exporter.py: "{{ lookup('ansible.builtin.file', playbook_dir + '/src/skmon/swarm_exporter/skswarm_exporter.py', rstrip=False) }}"
      no_log: true
      tags:
        - config

    - name: Write the {{ app }} Swarm config sources
      copy:
        content: "{{ item.value }}"
        dest: "/var/data/config/{{ app }}-{{ env }}/configs/{{ item.key }}"
        owner: root
        group: root
        mode: '0640'
      loop: "{{ skmon_configs | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true
      tags:
        - config

    - name: Render the {{ app }} Docker secret contents
      # sk-alert's alert.env (ALERT_ROUTING) and alert.secret (ALERT_SECRETS), and pve.yml. Like the configs,
      # the compose template names each secret after the sha256 of its content.
      set_fact:
        skmon_secrets:
          alert_env: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/alert.env.j2') }}"
          alert_secret: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/alert.secret.j2') }}"
          # prometheus-pve-exporter's config with the API token. Rendered with empty values when
          # PVE is off, so the stack stays valid at replicas 0.
          pve_config: "{{ lookup('template', playbook_dir + '/src/config/' + app + '/pve.yml.j2') }}"
      no_log: true
      tags:
        - config

    - name: Write the {{ app }} Docker secret sources
      copy:
        content: "{{ item.value }}"
        dest: "/var/data/config/{{ app }}-{{ env }}/secrets/{{ item.key }}"
        owner: root
        group: root
        mode: '0600'
      loop: "{{ skmon_secrets | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true
      tags:
        - config

    - name: Create the Grafana provisioning directories on the data node
      file:
        path: "{{ skmon_data_path }}/grafana-provisioning/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      delegate_to: "{{ skmon_data_node }}"
      loop:
        - datasources
        - dashboards
        - dashboards/apps
        - dashboards/skmon internals
        - dashboards/infrastructure
      tags:
        - config
        - dashboards

    - name: Process Grafana provisioning templates on the data node
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/grafana/{{ item.src }}"
        dest: "{{ skmon_data_path }}/grafana-provisioning/{{ item.dest }}"
        owner: root
        group: root
        mode: '0644'
      delegate_to: "{{ skmon_data_node }}"
      loop:
        - { src: "datasources.yml.j2", dest: "datasources/datasources.yml" }
        - { src: "dashboards.yml.j2", dest: "dashboards/dashboards.yml" }
      tags:
        - config

    - name: Copy the dashboards tree to the data node
      copy:
        src: "{{ playbook_dir }}/src/config/{{ app }}/dashboards/"
        dest: "{{ skmon_data_path }}/grafana-provisioning/dashboards/"
        owner: root
        group: root
        mode: '0644'
        directory_mode: '0755'
      delegate_to: "{{ skmon_data_node }}"
      tags:
        - dashboards

    - name: Process {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - compose

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags:
        - compose

    # Traefik routing is configured via Docker labels (Docker provider).
    # No file provider deployment needed - all labels are in the compose
    # file. Certificates: provided by traefik-certs-dumper (runs on the
    # ACME master node of your edge/ingress stack).

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags:
        - deploy-script

    - name: Create {{ app }} control script symlink
      file:
        src: "/var/data/{{ app }}-{{ env }}/deploy"
        dest: "/var/data/deploy_{{ app }}-{{ env }}"
        force: yes
        owner: root
        group: root
        mode: '0755'
        state: link
      tags:
        - deploy-script

    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags:
        - networks

    - name: Deploy {{ app }} stack
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        ./deploy
      register: deploy_output
      tags:
        - deploy

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags:
        - deploy

    - name: Put every skmon agent host in the agent play's group
      # agent.yml runs on skmon_agent_hosts; an inventory without that group would
      # otherwise match zero hosts and silently deploy no agent.
      add_host:
        name: "{{ item }}"
        groups: skmon_agent_hosts
      loop: "{{ skmon_agent_host_list }}"
      changed_when: false
      tags:
        - always

    - name: Create or update the skmon portal tiles in Authentik
      # On by default (AUTHENTIK_TILE: true); opt out per instance with
      # AUTHENTIK_TILE: false. skmon bundles three separate web UIs
      # (Grafana, Prometheus, Alertmanager), each behind the
      # cluster's domain-wide Traefik ForwardAuth catch-all already; each
      # gets its own bookmark tile, bound to one group, with no provider.
      # See shared/tasks/authentik_portal_tile.yml.
      include_tasks: ../../shared/tasks/authentik_portal_tile.yml
      vars:
        portal_tile:
          enabled: "{{ skmon.AUTHENTIK_TILE | default(true) | bool }}"
          slug: "{{ item.key }}{{ '' if env == 'prod' else '-' + env }}"
          name: "{{ item.name }}"
          launch_url: "https://{{ item.host_prefix }}{{ '' if env == 'prod' else '-' + env }}.{{ skmon.CLUSTERNAME }}.{{ skmon.DOMAIN }}"
          group: "{{ skmon.AUTHENTIK_TILE_GROUP | default('skadmin', true) }}"
          icon: "{{ item.icon }}"
          icon_file: "icons/{{ item.icon_file }}"
          icon_name: "{{ item.icon_name }}"
          open_in_new_tab: true
          description: ""
      loop:
        - { key: "skmon", host_prefix: "skmon", name: "SKMon (Grafana)", icon: "fa://fa-chart-line", icon_file: "grafana.png", icon_name: "grafana" }
        - { key: "prometheus", host_prefix: "prometheus", name: "Prometheus", icon: "fa://fa-fire", icon_file: "prometheus.png", icon_name: "prometheus" }
        - { key: "alertmanager", host_prefix: "alertmanager", name: "Alertmanager", icon: "fa://fa-bell", icon_file: "alertmanager.png", icon_name: "alertmanager" }
      loop_control:
        label: "{{ item.key }}"
      tags:
        - config
        - authentik

# Step 3: the Alloy agent on every agent host (a host container, or a systemd unit)
- import_playbook: agent.yml
  vars:
    env: dev
