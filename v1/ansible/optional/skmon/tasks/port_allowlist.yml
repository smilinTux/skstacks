---
# skmon port allowlist (spec 7.3, B4): one iptables chain SKMON-<ENV> per host, from one template
# (src/config/skmon/firewall/skmon-fw.sh.j2), installed as /usr/local/sbin/skmon-<env>-fw and
# applied by the oneshot unit skmon-<env>-fw.service (so it comes back after a reboot or a Docker
# restart). Included by agent.yml on every agent host and, delegated to DATA_NODE, by the three
# env plays: both render the same ruleset for DATA_NODE.
#   skmon_fw_node   host the rules go on, passed by the include (agent.yml: inventory_hostname, env
#                   plays: DATA_NODE). Never set_fact here: a fact would outlive the include and
#                   leak into the next play that runs on the same host.
#   skmon_fw_state  absent removes the unit, script, hooks and chain (default present)
# Needs skmon_agent_targets (tasks/agent_targets.yml) and skmon_data_node (tasks/facts.yml).
# Allowed sources are the agent addresses of skmon_agent_targets (estate addresses) for the
# agent, Loki and Pyroscope ports, and skmon.HEALTHZ_ALLOW for /healthz. An address that is not
# an IPv4 literal is refused here (iptables -s would resolve a name once at apply time): this
# role refuses, it does not resolve. Parking leaves the rules in place. IPv4 only.
- name: Require IPv4 literal sources for the skmon port allowlist
  assert:
    that:
      - >-
        (skmon_agent_targets | map(attribute='addr') | list + (skmon.HEALTHZ_ALLOW | default([])))
        | reject('match', '^([0-9]{1,3}[.]){3}[0-9]{1,3}(/[0-9]{1,2})?$') | list | length == 0
    fail_msg: >-
      The skmon port allowlist takes IPv4 literals only (iptables resolves a name once, when the
      rules are applied, so a DNS name or an IPv6 address would silently go stale or fail). Not an
      IPv4 literal: {{ (skmon_agent_targets | map(attribute='addr') | list + (skmon.HEALTHZ_ALLOW | default([])))
      | reject('match', '^([0-9]{1,3}[.]){3}[0-9]{1,3}(/[0-9]{1,2})?$') | join(', ') }}.
      Set skmon.AGENT_LISTEN_ADDR (host to IPv4) and skmon.HEALTHZ_ALLOW to addresses.
  delegate_to: "{{ skmon_fw_node }}"

- name: Derive whether the firewall node is DATA_NODE
  set_fact:
    skmon_fw_is_data_node: "{{ skmon_fw_node == skmon_data_node }}"

- name: Derive the protected ports
  # agent: every host. loki, pyroscope (only when PROFILING.enabled) and healthz: DATA_NODE only.
  set_fact:
    skmon_fw_ports: >-
      {%- set out = {'agent': (skmon.AGENT_PORT | default(12345) | int)} -%}
      {%- if skmon_fw_is_data_node -%}
      {%- set _ = out.update({'loki': (skmon.LOKI_PUSH_PORT | default(3100) | int)}) -%}
      {%- if (skmon.PROFILING | default({})).enabled | default(false) | bool -%}
      {%- set _ = out.update({'pyroscope': (skmon.PYROSCOPE_PORT | default(4040) | int)}) -%}
      {%- endif -%}
      {%- set _ = out.update({'healthz': (skmon.HEALTHZ_PORT | default(9095) | int)}) -%}
      {%- endif -%}
      {{ out }}

- name: Check whether Docker is installed on the firewall node
  shell: command -v docker >/dev/null 2>&1 && echo yes || echo no
  args:
    executable: /bin/sh
  register: skmon_fw_docker_probe
  changed_when: false
  delegate_to: "{{ skmon_fw_node }}"
  when: skmon_fw_state | default('present') != 'absent'

- name: Derive whether Docker is present
  set_fact:
    skmon_fw_docker: "{{ (skmon_fw_docker_probe.stdout | default('no') | trim) == 'yes' }}"

- name: Write the port allowlist script
  template:
    src: "{{ playbook_dir }}/src/config/skmon/firewall/skmon-fw.sh.j2"
    dest: "/usr/local/sbin/skmon-{{ env }}-fw"
    owner: root
    group: root
    mode: "0750"
  register: skmon_fw_script
  delegate_to: "{{ skmon_fw_node }}"
  become: true
  when: skmon_fw_state | default('present') != 'absent'

- name: Write the port allowlist unit
  template:
    src: "{{ playbook_dir }}/src/config/skmon/firewall/skmon-fw.service.j2"
    dest: "/etc/systemd/system/skmon-{{ env }}-fw.service"
    owner: root
    group: root
    mode: "0644"
  register: skmon_fw_unit
  delegate_to: "{{ skmon_fw_node }}"
  become: true
  when: skmon_fw_state | default('present') != 'absent'

- name: Enable and run the port allowlist
  systemd:
    name: "skmon-{{ env }}-fw.service"
    state: started
    enabled: true
    daemon_reload: true
  delegate_to: "{{ skmon_fw_node }}"
  become: true
  when: skmon_fw_state | default('present') != 'absent'

- name: Re-run the port allowlist when its script or unit changed
  # A oneshot with RemainAfterExit is "active" after the first run, so start alone is a no-op.
  systemd:
    name: "skmon-{{ env }}-fw.service"
    state: restarted
  delegate_to: "{{ skmon_fw_node }}"
  become: true
  when: skmon_fw_state | default('present') != 'absent' and (skmon_fw_script.changed or skmon_fw_unit.changed)

# --- state: absent: the unit, script, hooks and chain go -------------------------------

- name: Stop and disable the port allowlist unit when absent
  systemd:
    name: "skmon-{{ env }}-fw.service"
    state: stopped
    enabled: false
  register: skmon_fw_absent_stop
  failed_when: skmon_fw_absent_stop.failed and 'Could not find' not in (skmon_fw_absent_stop.msg | default(''))
  delegate_to: "{{ skmon_fw_node }}"
  become: true
  when: skmon_fw_state | default('present') == 'absent'

- name: Remove the port allowlist unit and script when absent
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/systemd/system/skmon-{{ env }}-fw.service"
    - "/usr/local/sbin/skmon-{{ env }}-fw"
  delegate_to: "{{ skmon_fw_node }}"
  become: true
  when: skmon_fw_state | default('present') == 'absent'

- name: Remove the port allowlist hooks and chain when absent
  shell: |
    set -eu
    chain='SKMON-{{ env | upper }}'
    for parent in INPUT DOCKER-USER; do
      while iptables -w -C "$parent" -j "$chain" 2>/dev/null; do
        iptables -w -D "$parent" -j "$chain"
      done
    done
    iptables -w -F "$chain" 2>/dev/null || true
    iptables -w -X "$chain" 2>/dev/null || true
    systemctl daemon-reload
  args:
    executable: /bin/bash
  delegate_to: "{{ skmon_fw_node }}"
  become: true
  when: skmon_fw_state | default('present') == 'absent'
