---
# skmon facts derived from the vault. set_fact only, no host access, so any
# play (the deploy plays, the agent play) can import this file on its own.
#   skmon_data_node  host that holds the local data (DATA_NODE, required by guards.yml)
#   skmon_data_path  normalized local data root: repeated slashes collapsed, no trailing slash
#   skmon_parked     true when skmon.replicas is 0 (also the string "0"): every workload is parked
#   skmon_skalert_src  controller path of the estate's sk-alert script (SKALERT_SCRIPT_SRC)
- name: Derive the skmon data node
  set_fact:
    skmon_data_node: "{{ skmon.DATA_NODE | default('', true) }}"

- name: Derive the normalized skmon local data path
  set_fact:
    skmon_data_path: >-
      {{ skmon.DATA_PATH | default('/srv/local/skmon-' ~ env, true)
         | regex_replace('/+', '/') | regex_replace('/$', '') }}

- name: Derive whether skmon is parked
  set_fact:
    skmon_parked: "{{ (skmon.replicas | default(1) | int) == 0 }}"

# SKALERT_SCRIPT_SRC is read on the controller. A leading ~ is expanded and an absolute path is
# used as given. A relative path resolves against the directory of the selected vault file
# (vault_file_path, set by shared/tasks/select_vault_file.yml), so the script is kept beside the
# vault and never inside this public repository. Empty when SKALERT_SCRIPT_SRC is unset
# (guards.yml fails).
- name: Derive the sk-alert script path on the controller
  set_fact:
    skmon_skalert_src: >-
      {%- set src = (skmon.SKALERT_SCRIPT_SRC | default('', true) | string) | expanduser -%}
      {%- if src == '' or src.startswith('/') or (vault_file_path | default('', true)) == '' -%}{{ src }}
      {%- else -%}{{ vault_file_path | dirname }}/{{ src }}
      {%- endif -%}

# Inventory hosts that run an agent: the skmon_agent_hosts group when the inventory
# defines it, else the swarm nodes plus skmon_extra_hosts (unique, in that order).
- name: Derive the skmon agent host list
  set_fact:
    skmon_agent_host_list: >-
      {{ groups['skmon_agent_hosts'] if 'skmon_agent_hosts' in groups
         else ((groups['swarm_managers'] | default([]))
               + (groups['swarm_workers'] | default([]))
               + (groups['skmon_extra_hosts'] | default([]))) | unique | list }}
