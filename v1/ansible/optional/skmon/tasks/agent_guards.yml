---
# skmon agent address guard. Runs after the plays have built skmon_agent_targets.
# An agent listens on, and VictoriaMetrics scrapes, the node's private address:
# an inventory address that is a public IP literal would expose the agent. Private
# (RFC 1918, 100.64.0.0/10, fc00::/7) and documentation (RFC 5737) literals pass,
# and so does any DNS name. Core Jinja only: no ipaddr filter.
- name: Require private agent addresses
  assert:
    that:
      - >-
        skmon_agent_targets
        | rejectattr('addr', 'match', '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|192[.]0[.]2[.]|198[.]51[.]100[.]|203[.]0[.]113[.]|[fF][cCdD][0-9a-fA-F]{2}:)')
        | selectattr('addr', 'match', '^([0-9]{1,3}([.][0-9]{1,3}){3}|[0-9A-Fa-f:]*:[0-9A-Fa-f:.]*)$')
        | list | length == 0
    fail_msg: >-
      skmon agent address is a public IP for host(s)
      {{ skmon_agent_targets
         | rejectattr('addr', 'match', '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|192[.]0[.]2[.]|198[.]51[.]100[.]|203[.]0[.]113[.]|[fF][cCdD][0-9a-fA-F]{2}:)')
         | selectattr('addr', 'match', '^([0-9]{1,3}([.][0-9]{1,3}){3}|[0-9A-Fa-f:]*:[0-9A-Fa-f:.]*)$')
         | map(attribute='node') | join(', ') }}.
      Set skmon.AGENT_LISTEN_ADDR (a map of host to private address) for them: the
      inventory address is used otherwise, and the agent must not listen publicly.

# AgentMissing and the node inhibitions join the agents' series (labelled with the inventory
# name) to skswarm-exporter's series (labelled with the Swarm hostname) on `node`. A swarm
# host whose inventory name differs from its Swarm hostname would split into two nodes.
# skmon_extra_hosts are not Swarm nodes and are exempt.
- name: Require every swarm agent host's inventory name to be its Swarm hostname
  assert:
    that:
      - >-
        skmon_agent_host_list
        | select('in', (groups['swarm_managers'] | default([])) + (groups['swarm_workers'] | default([])))
        | reject('in', groups['skmon_extra_hosts'] | default([]))
        | reject('in', skmon_swarm_nodes)
        | list | length == 0
    fail_msg: >-
      The inventory name of swarm host(s)
      {{ skmon_agent_host_list
         | select('in', (groups['swarm_managers'] | default([])) + (groups['swarm_workers'] | default([])))
         | reject('in', groups['skmon_extra_hosts'] | default([]))
         | reject('in', skmon_swarm_nodes) | join(', ') }}
      is not a Swarm node hostname (docker node ls: {{ skmon_swarm_nodes | join(', ') }}). The agent's
      `node` label is the inventory name and must equal the Swarm hostname, because AgentMissing
      and the node inhibitions join the agents' series to skswarm-exporter's on `node`. Rename the
      inventory host to its Swarm hostname (keep the address in ansible_host).
