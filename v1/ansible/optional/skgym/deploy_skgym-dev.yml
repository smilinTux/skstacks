---
# skgym: openGym (self-hosted gym and body-weight tracker, upstream
# github.com/DuarteSantos8/openGym, AGPL-3.0) behind skfenceha. Two upstream
# images, both pinned by digest: `api` (Node, JSON files in one data dir,
# exactly ONE replica) and `web` (nginx serving the app and proxying /api to
# `api`, one origin for passkeys). A `backup` sidecar writes a tar.gz of the
# data dir on a schedule for skbackup to pick up. Opt-in: nothing renders
# unless this playbook runs. See README.md.
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
# Run on all hosts to ensure it executes even with -l limit
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skgym
    env: dev
    service_name: skgym
    service_type: optional
    # openGym v1.4.1 (upstream release images, multi-arch amd64/arm64). The
    # compose template writes the same literals so v1/scripts/list_images.py
    # sees the pins; test_skgym_render.py keeps the two equal.
    skg_default_api_image: "ghcr.io/duartesantos8/opengym-api:1.4.1@sha256:4bc07fe7d1f05a57c0fa25da3563d54dfe27223506637d67fc64088a2a2f140b"
    skg_default_web_image: "ghcr.io/duartesantos8/opengym-web:1.4.1@sha256:e32cae9d2f4aad0c5e1b7888c9bfc712b2306ddfe3c65bc4cfefd4b0002e86d3"
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Fail loudly when the skgym vault block or its session secret is missing
      # SESSION_SECRET signs every session cookie. The deploy writes it to
      # <DATA_PATH>/secret, so the vault (not a file the app generated on
      # first boot) is the source of truth and a restore keeps everyone
      # signed in. The message never prints the value.
      assert:
        that:
          - skgym is defined and skgym is mapping
          - skgym.SESSION_SECRET | default('', true) | string | length >= 32
        fail_msg: >-
          ERROR: skgym.SESSION_SECRET is required (a random string of at least
          32 characters, e.g. `openssl rand -hex 32`) in the skgym vault block.
          See README.md "Configuration (vault)".
        quiet: true
      tags: [config]

    - name: Resolve the skgym settings
      set_fact:
        skg_base_domain: "{{ skgym.DOMAIN | default(domain) if skgym.CLOUDFLARED | default(false) | bool else (skgym.CLUSTERNAME | default(cluster_name)) ~ '.' ~ (skgym.DOMAIN | default(domain)) }}"
        skg_api_image: "{{ skgym.API_IMAGE | default(skg_default_api_image, true) }}"
        skg_web_image: "{{ skgym.WEB_IMAGE | default(skg_default_web_image, true) }}"
        skg_data_path: "{{ skgym.DATA_PATH | default('/var/data/' + app + '-' + env + '/data', true) }}"
        skg_data_node: "{{ skgym.DATA_NODE | default('', true) | string }}"
        skg_backup_path: "{{ skgym.BACKUP_PATH | default('/var/data/' + app + '-' + env + '/backup', true) }}"
        # default-no-error-pages@file: skfenceha's error-pages middleware would
        # replace openGym's JSON error bodies (403 invite, 409 name-taken, ...).
        skg_middlewares: "{{ skgym.TRAEFIK_MIDDLEWARES | default('default-no-error-pages@file', true) }}"
        # AUTH_MODE sso (default): Authentik forward auth (SSO_MIDDLEWARE,
        # default authentik@file) on the app shell; none: openGym's own
        # accounts only, no SSO_MIDDLEWARE allowed.
        skg_auth_mode: "{{ skgym.AUTH_MODE | default('sso', true) | string | lower }}"
        skg_sso_middleware: "{{ (skgym.SSO_MIDDLEWARE | default('', true) | string) if (skgym.AUTH_MODE | default('sso', true) | string | lower) != 'sso' else (skgym.SSO_MIDDLEWARE | default('authentik@file', true) | string) }}"
        # SIGNUP auto (default): self-signup open while openGym has no
        # profile (the first one becomes the admin), invite-only from the
        # first deploy after one exists. The pre-SIGNUP key INVITE_ONLY still
        # maps (true = invite, false = open) but not together with SIGNUP.
        skg_signup: >-
          {{ (skgym.SIGNUP | string | lower) if (skgym.SIGNUP | default('', true) | string | length > 0)
             else ('invite' if (skgym.INVITE_ONLY | bool) else 'open') if (skgym.INVITE_ONLY is defined and skgym.INVITE_ONLY is not none and skgym.INVITE_ONLY | string | length > 0)
             else 'auto' }}
        skg_signup_conflict: "{{ (skgym.SIGNUP | default('', true) | string | length > 0) and (skgym.INVITE_ONLY is defined and skgym.INVITE_ONLY is not none and skgym.INVITE_ONLY | string | length > 0) }}"
        skg_tls_options: "{{ skgym.TLS_OPTIONS | default('intermediate@file', true) }}"
        skg_router: "skgym{{ '' if env == 'prod' else '-' + env }}"
      tags: [config]

    - name: Resolve the public host
      set_fact:
        skg_host: "{{ skgym.HOSTNAME | default('skgym' + ('' if env == 'prod' else '-' + env) + '.' + skg_base_domain, true) }}"
      tags: [config]

    - name: Validate the image pins and the public host
      assert:
        that:
          - "'@sha256:' in skg_api_image"
          - "'@sha256:' in skg_web_image"
          - skg_host is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
          - (skgym.WEB_REPLICAS | default(1) | int) >= 1
        fail_msg: >-
          ERROR: skgym.API_IMAGE and skgym.WEB_IMAGE must be pinned by digest
          (@sha256:), HOSTNAME (or CLUSTERNAME/DOMAIN) must be a plain host name
          and WEB_REPLICAS at least 1. API_IMAGE is {{ skg_api_image }},
          WEB_IMAGE is {{ skg_web_image }}, host is {{ skg_host }}.
        quiet: true
      tags: [config]

    - name: Fail loudly on an unknown AUTH_MODE or SIGNUP
      assert:
        that:
          - skg_auth_mode in ['sso', 'none']
          - skg_signup in ['auto', 'open', 'invite']
        fail_msg: >-
          ERROR: skgym.AUTH_MODE must be 'sso' or 'none' (it is
          '{{ skg_auth_mode }}') and skgym.SIGNUP must be 'auto', 'open' or
          'invite' (it is '{{ skg_signup }}'). See README.md "Sign-in, SSO and
          the first admin".
        quiet: true
      tags: [config]

    - name: Collect contradictory sign-in settings
      # Only key NAMES and middleware names are collected, never a value
      # from the secret side of the vault.
      set_fact:
        skg_auth_conflicts: >-
          {{ (["AUTH_MODE is 'none' (no SSO) but SSO_MIDDLEWARE is set"] if (skg_auth_mode == 'none' and skg_sso_middleware | length > 0) else [])
             + (['TRAEFIK_MIDDLEWARES carries forward auth (' ~ skg_middlewares ~ '): it would put /api/ behind it too, which breaks the phone app and passkey sign-in, and with AUTH_MODE none it is SSO under another name; use AUTH_MODE sso (SSO_MIDDLEWARE) instead']
                if ('authentik' in skg_middlewares | lower) or (skg_sso_middleware | length > 0 and skg_sso_middleware in skg_middlewares.split(',')) else [])
             + (['both SIGNUP and the older INVITE_ONLY are set: keep SIGNUP only'] if skg_signup_conflict | bool else []) }}
      tags: [config]

    - name: Refuse contradictory sign-in settings
      assert:
        that:
          - skg_auth_conflicts | length == 0
        fail_msg: >-
          ERROR: the skgym vault block contradicts itself: {{ skg_auth_conflicts | join('; ') }}.
          See README.md "Sign-in, SSO and the first admin".
        quiet: true
      tags: [config]

    - name: Fail closed on a local data path without a pinned data node
      # A path outside /var/data is local disk on one node: without DATA_NODE
      # swarm may reschedule the api elsewhere onto an empty directory (every
      # profile and workout gone). Same rule as sksso/skhub/skpayment.
      assert:
        that:
          - (skg_data_node | length > 0) or (skg_data_path.startswith('/var/data/') and skg_backup_path.startswith('/var/data/'))
        fail_msg: >-
          skgym.DATA_PATH / BACKUP_PATH point at local disk ({{ skg_data_path }},
          {{ skg_backup_path }}) but skgym.DATA_NODE is empty. Set DATA_NODE to
          the node holding the data.
        quiet: true
      tags: [config]

    - name: Define network variables from vault (idempotent network creation)
      # Subnets: skgym-prod 172.16.165.0/24, -staging .166, -dev .167
      # (reserved for skgym); cloud-public-<env> is shared. Override with the
      # flat per-env skgym_<env>_networks (catalog naming convention).
      set_fact:
        app_networks: "{{ skgym_dev_networks | default([
          { 'name': 'skgym-dev', 'subnet': '172.16.167.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'cloud-public-dev', 'subnet': '172.16.202.0/24', 'driver': 'overlay', 'attachable': true }
        ]) }}"
      tags: [networks, config]

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    - name: Create the {{ app }} directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /var/data/{{ app }}-{{ env }}
        - /var/data/{{ app }}-{{ env }}/bin
        - /var/data/config/{{ app }}-{{ env }}

    - name: Create the {{ app }} data and backup directories on shared storage (not recursive, root only)
      # The data dir holds passkey credentials and the session secret; the
      # api runs as root in its image. 0700 keeps other accounts on the NFS
      # clients out of it.
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - "{{ skg_data_path }}"
        - "{{ skg_backup_path }}"
      when: item.startswith('/var/data/')

    - name: Create the {{ app }} local data and backup directories on the data node (not recursive, root only)
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - "{{ skg_data_path }}"
        - "{{ skg_backup_path }}"
      when: not item.startswith('/var/data/')
      # Ansible templates delegate_to before it evaluates when, so it must
      # render with DATA_NODE unset too (the guard above requires DATA_NODE
      # whenever this task actually runs).
      delegate_to: "{{ skgym.DATA_NODE | default(inventory_hostname, true) }}"

    - name: Write the session secret into the data dir (root only)
      # openGym reads <DATA_DIR>/secret at start-up and only generates one
      # when the file is missing. Changing the vault value signs everyone out.
      copy:
        content: "{{ skgym.SESSION_SECRET }}\n"
        dest: "{{ skg_data_path }}/secret"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      register: skgym_secret
      delegate_to: "{{ skgym.DATA_NODE | default(inventory_hostname, true) if not skg_data_path.startswith('/var/data/') else inventory_hostname }}"
      tags: [templates]

    - name: Read how many profiles openGym has (SIGNUP auto/invite)
      # db.json holds every profile and passkey public key: no_log. A missing
      # file (first deploy) reads as no profile at all.
      slurp:
        src: "{{ skg_data_path }}/db.json"
      register: skgym_db
      failed_when: false
      no_log: true
      when: skg_signup in ['auto', 'invite']
      delegate_to: "{{ skgym.DATA_NODE | default(inventory_hostname, true) if not skg_data_path.startswith('/var/data/') else inventory_hostname }}"
      tags: [config, templates]

    - name: Refuse a db.json that is not a JSON object (SIGNUP auto/invite)
      assert:
        that:
          - (skgym_db.content | default('', true) | length == 0) or ((skgym_db.content | b64decode) is match('^\\s*\\{[\\s\\S]*\\}\\s*$'))
        fail_msg: >-
          ERROR: {{ skg_data_path }}/db.json exists but is not a JSON object,
          so the deploy cannot tell whether a first admin exists. Restore it
          (openGym keeps db.json.bak) or set skgym.SIGNUP to 'open' or
          'invite' explicitly for this deploy.
        quiet: true
      when: skg_signup in ['auto', 'invite']
      tags: [config, templates]

    - name: Resolve whether self-signup is open
      set_fact:
        skg_profiles: "{{ ((skgym_db.content | b64decode | from_json).users | default([]) | length) if (skgym_db.content | default('', true) | length > 0) else 0 }}"
      tags: [config, templates]

    - name: Resolve the INVITE_ONLY the api gets
      set_fact:
        skg_invite_only: "{{ skg_signup == 'invite' or (skg_signup == 'auto' and skg_profiles | int > 0) }}"
      tags: [config, templates]

    - name: Refuse invite-only on an instance with no profile yet
      # openGym refuses every signup without an invite code and only an
      # admin can make one: nobody could ever get in.
      assert:
        that:
          - not (skg_invite_only | bool) or skg_profiles | int > 0
        fail_msg: >-
          ERROR: skgym sign-up would be invite-only but openGym has no profile
          yet, so nobody could ever sign up (an invite code needs an admin).
          Deploy with SIGNUP auto (the default) or open, create the first
          profile (it becomes the admin), then redeploy.
        quiet: true
      tags: [config, templates]

    - name: Report the sign-in mode
      debug:
        msg: >-
          skgym auth: {{ 'sso (' ~ skg_sso_middleware ~ ' on the app shell, /api/ outside it)' if skg_auth_mode == 'sso' else 'none (openGym accounts only)' }};
          sign-up: {{ 'invite-only' if skg_invite_only | bool else 'OPEN' }} (SIGNUP {{ skg_signup }}, {{ skg_profiles }} profile(s) on disk).
          {{ 'Create the first profile now (it becomes the admin), then rerun this deploy: SIGNUP auto closes sign-up.' if (skg_signup == 'auto' and not (skg_invite_only | bool)) else '' }}
      tags: [config, templates]

    - name: Install the backup script
      # Copied verbatim (sh, run by the backup sidecar): no Jinja in it.
      copy:
        src: "{{ playbook_dir }}/src/{{ app }}/skgym-backup"
        dest: "/var/data/{{ app }}-{{ env }}/bin/skgym-backup"
        owner: root
        group: root
        mode: '0755'
      register: skgym_backup_script
      tags: [templates]

    - name: Process {{ app }} api env (root only)
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.env.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env"
        owner: root
        group: root
        mode: '0600'
      register: skgym_env
      tags: [templates]

    - name: Process {{ app }} shell env
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.sh.env.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env"
        owner: root
        group: root
        mode: '0640'
      tags: [templates]

    - name: Process {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags: [compose]

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags: [compose]

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags: [deploy-script]

    - name: Create {{ app }} control script symlink
      file:
        src: "/var/data/{{ app }}-{{ env }}/deploy"
        dest: "/var/data/deploy_{{ app }}-{{ env }}"
        force: yes
        owner: root
        group: root
        state: link
      tags: [deploy-script]

    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags: [networks]

    - name: Deploy {{ app }} stack
      # The env file, the session secret and the backup script are an
      # env_file / bind mounts: a changed file alone does not change the
      # service spec, so the deploy script restarts the services that read
      # them when the play changed one.
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        RESTART_API={{ '1' if (skgym_env is changed or skgym_secret is changed) else '0' }} RESTART_BACKUP={{ '1' if skgym_backup_script is changed else '0' }} ./deploy
      register: deploy_output
      tags: [deploy]

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags: [deploy]

    - name: Create or update the skgym portal tile in Authentik
      # On by default (AUTHENTIK_TILE: true); opt out per instance with
      # AUTHENTIK_TILE: false. skgym sits behind the cluster's domain-wide
      # Traefik ForwardAuth catch-all already; this just gives it a
      # bookmark tile on the Authentik portal, bound to a group, with no
      # provider. See shared/tasks/authentik_portal_tile.yml.
      include_tasks: ../../shared/tasks/authentik_portal_tile.yml
      vars:
        portal_tile:
          enabled: "{{ skgym.AUTHENTIK_TILE | default(true) | bool }}"
          slug: "{{ skgym.AUTHENTIK_TILE_SLUG | default(app, true) }}"
          name: "{{ skgym.AUTHENTIK_TILE_NAME | default('SKGym', true) }}"
          launch_url: "https://{{ skg_host }}"
          group: "{{ skgym.AUTHENTIK_TILE_GROUP | default('authentik Admins', true) }}"
          icon: "{{ skgym.AUTHENTIK_TILE_ICON | default('fa://fa-dumbbell', true) }}"
          open_in_new_tab: "{{ skgym.AUTHENTIK_TILE_OPEN_IN_NEW_TAB | default(true) | bool }}"
          description: "{{ skgym.AUTHENTIK_TILE_DESCRIPTION | default('', true) }}"
      tags:
        - config
        - authentik
