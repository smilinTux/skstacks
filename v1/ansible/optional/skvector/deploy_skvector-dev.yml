---
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
# Run on all hosts to ensure it executes even with -l limit
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skvector
    env: dev
    service_name: skvector
    service_type: optional
    skvector_storage_path: "{{ skvector.STORAGE_PATH | default('/var/data/' + app + '-' + env + '/storage', true) }}"
    skvector_snapshots_path: "{{ skvector.SNAPSHOTS_PATH | default('/var/data/' + app + '-' + env + '/snapshots', true) }}"
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Fail closed on local storage paths without a pinned data node
      # A path outside /var/data is local disk on one node. Without DATA_NODE
      # swarm may reschedule qdrant elsewhere and start it on an empty
      # directory (data loss): see README "Local data on a pinned node".
      vars:
        _data_node: "{{ skvector.DATA_NODE | default('', true) | string }}"
        _storage_path: "{{ skvector.STORAGE_PATH | default('/var/data/', true) | string }}"
        _snapshots_path: "{{ skvector.SNAPSHOTS_PATH | default('/var/data/', true) | string }}"
      assert:
        that:
          - >-
            (_data_node | length > 0) or
            (_storage_path.startswith('/var/data/') and _snapshots_path.startswith('/var/data/'))
        fail_msg: >-
          skvector.STORAGE_PATH / SNAPSHOTS_PATH point at local disk
          ({{ skvector_storage_path }}, {{ skvector_snapshots_path }}) but
          skvector.DATA_NODE is empty. Set DATA_NODE to the node holding the data.
        quiet: true

    - name: Define network variables from vault (idempotent network creation)
      # ⚠️ IMPORTANT: Network subnets MUST match shared/networks registry
      # Reference: See shared/networks for all registered network subnets
      # Networks are created idempotently by:
      #   1. create_networks.yml shared task (Ansible pre-deployment)
      #   2. deploy.j2 script (runtime, enables rm stack && ./deploy workflow)
      # Subnets from shared/networks:
      #   skvector-dev: 172.16.100.0/24
      #   cloud-public-dev: 172.16.202.0/24
      set_fact:
        app_networks: "{{ skvector.networks | default([
          { 'name': 'skvector-dev', 'subnet': '172.16.100.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'cloud-public-dev', 'subnet': '172.16.202.0/24', 'driver': 'overlay', 'attachable': true }
        ]) }}"
      tags:
        - networks
        - config

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...
    
    - name: Create the {{ app }} directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: 0755
      loop:
        - /var/data/{{ app }}-{{ env }}
        - /var/data/config/{{ app }}-{{ env }}

    - name: Set storage directory ownership
      # Only for paths that stay on /var/data; a local path is created on
      # DATA_NODE below, and the old shared-storage path is left alone once
      # it moved (README "Local data on a pinned node").
      file:
        path: "{{ item }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: '0755'
      loop:
        - "{{ skvector_storage_path }}"
        - "{{ skvector_snapshots_path }}"
      when: item.startswith('/var/data/')

    - name: Create the {{ app }} local storage and snapshot directories on the data node (not recursive)
      # Same owner/mode as the shared-storage copy above. qdrant/qdrant runs
      # as 0:0, so 1000:1000 is not what grants access; it keeps the local
      # copy identical to the shared one (and fits the unprivileged image).
      file:
        path: "{{ item }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: '0755'
      loop:
        - "{{ skvector_storage_path }}"
        - "{{ skvector_snapshots_path }}"
      when: not item.startswith('/var/data/')
      # Ansible templates delegate_to before it evaluates when, so it must
      # render with DATA_NODE unset too (the guard above requires DATA_NODE
      # whenever this task actually runs).
      delegate_to: "{{ skvector.DATA_NODE | default(inventory_hostname, true) }}"

    - name: Process {{ app }} environment templates
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0640'
      loop:
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env" }
        - { src: "{{ app }}.sh.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env" }
      tags:
        - templates

    - name: Process {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - compose

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags:
        - compose

    # Traefik routing is now configured via Docker labels (Docker provider)
    # No file provider deployment needed - all labels in compose file per new SOP
    # Certificates: Provided by traefik-certs-dumper (runs on skfence/skfenceha ACME master node)

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags:
        - deploy-script

    - name: Create {{ app }} control script symlink
      file:
        src: "/var/data/{{ app }}-{{ env }}/deploy"
        dest: "/var/data/deploy_{{ app }}-{{ env }}"
        force: yes
        owner: root
        group: root
        mode: '0755'
        state: link
      tags:
        - deploy-script

    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags:
        - networks

    - name: Deploy {{ app }} stack
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        ./deploy
      register: deploy_output
      tags:
        - deploy

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags:
        - deploy
