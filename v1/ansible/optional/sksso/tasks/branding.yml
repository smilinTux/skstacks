# sksso.branding (a pack name under branding/: "nam" or "skworld"): put the pack
# on shared storage so Authentik serves it. Authentik reads logo, favicon and
# flow background from media/public/<pack>/ and email templates from
# custom-templates/. A pack may omit templates/ and nextcloud-theming.sh (the
# skworld pack has no nextcloud-theming.sh); both are skipped when absent. A pack
# with email.yml also gets the shared email set (branding/_email, see below). This only copies files; applying them to the database is
# the idempotent helper rendered next to the deploy script
# (/var/data/<app>-<env>/apply-branding), run once after the stack is up.
# See README "Branding".
#
# sksso.branding_dir (optional, default empty): load the pack from the
# instance repo instead of the role's branding/ dir. An absolute path, or a
# path relative to the inventory dir (inventory_dir, e.g. envs/prod/), like
# skfence EXTRA_DYNAMIC_FILES. sksso.branding still names the pack, and its
# media lands in media/public/<sksso.branding>/. Empty = branding/<pack> in the
# role, unchanged.

- name: Fail on a branding pack name that is not a plain name
  assert:
    that: sksso.branding is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$') and '..' not in sksso.branding
    fail_msg: "sksso.branding={{ sksso.branding }} must be a plain name (letters, digits, '.', '_', '-'), it names media/public/<pack>/"
    quiet: true

- name: Resolve the branding pack source dir
  set_fact:
    sksso_branding_src: >-
      {%- set d = sksso.branding_dir | default('', true) | string -%}
      {%- if d | length == 0 -%}{{ playbook_dir }}/branding/{{ sksso.branding }}
      {%- elif d.startswith('/') -%}{{ d | regex_replace('/+$', '') }}
      {%- else -%}{{ inventory_dir }}/{{ d | regex_replace('/+$', '') }}{%- endif -%}

- name: Check the branding pack exists
  stat:
    path: "{{ sksso_branding_src }}"
  register: sksso_branding_pack
  delegate_to: localhost
  become: false

- name: Fail on an unknown branding pack
  assert:
    that: sksso_branding_pack.stat.exists
    fail_msg: "sksso.branding={{ sksso.branding }} but the pack dir {{ sksso_branding_src }} does not exist (set sksso.branding_dir for an instance pack)"
    quiet: true

- name: Create the branding media dir
  file:
    path: "/var/data/{{ app }}-{{ env }}/media/public/{{ sksso.branding }}"
    state: directory
    owner: "{{ sksso.authentik_uid | default(1000) }}"
    group: "{{ sksso.authentik_uid | default(1000) }}"
    mode: '0755'

- name: Copy branding media (logo, favicon, css, background, apply script)
  copy:
    src: "{{ sksso_branding_src }}/media/"
    dest: "/var/data/{{ app }}-{{ env }}/media/public/{{ sksso.branding }}/"
    owner: "{{ sksso.authentik_uid | default(1000) }}"
    group: "{{ sksso.authentik_uid | default(1000) }}"
    mode: '0644'

- name: Check whether the pack ships email templates and a Nextcloud theming helper
  stat:
    path: "{{ sksso_branding_src }}/{{ item }}"
  loop:
    - templates
    - nextcloud-theming.sh
  register: sksso_branding_optional
  delegate_to: localhost
  become: false

- name: Copy branded email templates (only when the pack has templates/)
  copy:
    src: "{{ sksso_branding_src }}/templates/"
    dest: "/var/data/{{ app }}-{{ env }}/custom-templates/"
    owner: root
    group: root
    mode: '0644'
  when: (sksso_branding_optional.results | selectattr('item', 'equalto', 'templates') | first).stat.exists

# Shared email set (branding/_email): when the pack has email.yml, render every
# Authentik email (reset, invitation, account confirmation, email sign-in code,
# notification, test) with the pack's brand values into custom-templates/email/,
# where they override Authentik's stock email/*.html. apply_email.py, rendered
# alongside, points the stages and notification transports at them; it runs from
# the apply-email-branding helper (the skworld and nam apply-branding call it).
- name: Check whether the pack ships email brand values
  stat:
    path: "{{ sksso_branding_src }}/email.yml"
  register: sksso_branding_email
  delegate_to: localhost
  become: false

- name: Render the shared branded email set
  when: sksso_branding_email.stat.exists
  block:
    - name: Make a scratch dir for the rendered email set
      tempfile:
        state: directory
        suffix: sksso-email
      register: sksso_email_tmp
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Render the email templates from the pack's email.yml
      command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/branding/_email/render.py"
          - "{{ sksso_branding_src }}/email.yml"
          - "{{ sksso_email_tmp.path }}"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Create the email template dir
      file:
        path: "/var/data/{{ app }}-{{ env }}/custom-templates/email"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy the rendered email templates
      copy:
        src: "{{ sksso_email_tmp.path }}/email/"
        dest: "/var/data/{{ app }}-{{ env }}/custom-templates/email/"
        owner: root
        group: root
        mode: '0644'

    - name: Copy apply_email.py next to the pack media
      copy:
        src: "{{ sksso_email_tmp.path }}/apply_email.py"
        dest: "/var/data/{{ app }}-{{ env }}/media/public/{{ sksso.branding }}/apply_email.py"
        owner: "{{ sksso.authentik_uid | default(1000) }}"
        group: "{{ sksso.authentik_uid | default(1000) }}"
        mode: '0644'

    - name: Install the apply-email-branding helper
      copy:
        src: "{{ playbook_dir }}/branding/_email/apply-email-branding.sh"
        dest: "/var/data/{{ app }}-{{ env }}/apply-email-branding"
        owner: root
        group: root
        mode: '0755'
  always:
    - name: Remove the email scratch dir
      file:
        path: "{{ sksso_email_tmp.path }}"
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false
      when: sksso_email_tmp.path is defined

- name: Install the branding helpers next to the deploy script
  copy:
    src: "{{ sksso_branding_src }}/{{ item.src }}"
    dest: "/var/data/{{ app }}-{{ env }}/{{ item.dest }}"
    owner: root
    group: root
    mode: '0755'
  loop:
    - { src: apply-branding.sh, dest: apply-branding }
    - { src: nextcloud-theming.sh, dest: nextcloud-theming }
  when: >-
    item.src != 'nextcloud-theming.sh'
    or (sksso_branding_optional.results | selectattr('item', 'equalto', 'nextcloud-theming.sh') | first).stat.exists
