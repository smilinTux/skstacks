# sksso.SKPATCH_OIDC_CLIENT_SECRET, before the stack deploy: render the
# Authentik blueprint that gives skpatch (linux-update-dashboard) its
# OAuth2 login (skpatch.AUTH_MODE: oidc). The blueprint lives in
# /var/data/config/sksso-<env>/blueprints (mounted at /blueprints/custom in
# server and worker); the worker applies it. The client secret reaches
# Authentik as the SKPATCH_OIDC_CLIENT_SECRET env var (see sksso.env.j2)
# and is read with !Env, so it is not in the blueprint file. See the README
# section "sksec-web / skpatch (OIDC) login".

- name: Resolve the skpatch OIDC settings
  set_fact:
    sksso_skpatch_base: "{{ sksso.DOMAIN if (sksso.CLOUDFLARED | default(false) | bool) else (sksso.CLUSTERNAME ~ '.' ~ sksso.DOMAIN) }}"
    sksso_skpatch_client_id: "{{ sksso.SKPATCH_OIDC_CLIENT_ID | default('skpatch' ~ ('' if env == 'prod' else '-' ~ env), true) }}"
    sksso_skpatch_app_name: "{{ sksso.SKPATCH_APP_NAME | default('SKPatch (Linux updates)', true) }}"
  no_log: true

- name: Resolve the skpatch public host
  set_fact:
    sksso_skpatch_host: "{{ sksso.SKPATCH_HOST | default('skpatch' ~ ('' if env == 'prod' else '-' ~ env) ~ '.' ~ sksso_skpatch_base, true) }}"
  no_log: true

- name: Check the skpatch OIDC vault keys
  assert:
    that:
      - "(sksso.SKPATCH_OIDC_CLIENT_SECRET | default('') | string | length) >= 32"
      - "sksso_skpatch_host is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')"
      - "sksso_skpatch_client_id is match('^[a-z0-9][a-z0-9-]*$')"
    fail_msg: >-
      sksso.SKPATCH_OIDC_CLIENT_SECRET needs 32+ characters (openssl rand
      -hex 32, the same value as skpatch.OIDC_CLIENT_SECRET), SKPATCH_HOST
      a plain host name and SKPATCH_OIDC_CLIENT_ID a lowercase slug.
    quiet: true

- name: Create the Authentik blueprints directory
  file:
    path: /var/data/config/{{ app }}-{{ env }}/blueprints
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Render the skpatch-oidc blueprint (no secret inside)
  template:
    src: "{{ playbook_dir }}/src/config/{{ app }}/blueprints/skpatch-oidc.yaml.j2"
    dest: /var/data/config/{{ app }}-{{ env }}/blueprints/skpatch-oidc.yaml
    owner: root
    group: root
    mode: '0644'
