# sksso.SKAI_OIDC_ENABLED, before the stack deploy: render the Authentik
# blueprint that gives skai (Open WebUI) its OAuth2/OIDC sign-in
# (skai.AUTH_MODE: oidc, the skai default). Same mechanism as
# tasks/skgit_blueprint.yml: the blueprint lives in
# /var/data/config/sksso-<env>/blueprints (mounted at /blueprints/custom in
# server and worker); the worker applies it. The client secret reaches
# Authentik as the SKAI_OIDC_CLIENT_SECRET env var (see sksso.env.j2) and is
# read with !Env, so it is not in the blueprint file. See the README section
# "skai (Open WebUI) OIDC login".

- name: Resolve the skai OIDC settings
  set_fact:
    sksso_skai_base: "{{ sksso.DOMAIN if (sksso.CLOUDFLARED | default(false) | bool) else (sksso.CLUSTERNAME ~ '.' ~ sksso.DOMAIN) }}"
    sksso_skai_client_id: "{{ sksso.SKAI_OIDC_CLIENT_ID | default('skai', true) }}"
    sksso_skai_app_name: "{{ sksso.SKAI_APP_NAME | default('SKAI', true) }}"
    sksso_skai_authentication_flow: "{{ sksso.SKAI_OIDC_AUTHENTICATION_FLOW | default('', true) | string }}"
  no_log: true

- name: Resolve the skai public host
  set_fact:
    sksso_skai_host: "{{ sksso.SKAI_HOST | default('skai' ~ ('' if env == 'prod' else '-' ~ env) ~ '.' ~ sksso_skai_base, true) }}"
  no_log: true

- name: Check the skai OIDC vault keys
  assert:
    that:
      - "(sksso.SKAI_OIDC_CLIENT_SECRET | default('') | string | length) >= 32"
      - "sksso_skai_host is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')"
      - "sksso_skai_client_id is match('^[a-z0-9][a-z0-9-]*$')"
      - "sksso_skai_authentication_flow == '' or sksso_skai_authentication_flow is match('^[a-z0-9][a-z0-9-]*$')"
    fail_msg: >-
      sksso.SKAI_OIDC_CLIENT_SECRET needs 32+ characters (openssl rand -hex
      32, the same value as skai.OIDC_CLIENT_SECRET), SKAI_HOST a plain host
      name, SKAI_OIDC_CLIENT_ID a lowercase slug (the same value as
      skai.OIDC_CLIENT_ID), and SKAI_OIDC_AUTHENTICATION_FLOW empty or a
      lowercase flow slug.
    quiet: true

- name: Create the Authentik blueprints directory
  file:
    path: /var/data/config/{{ app }}-{{ env }}/blueprints
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Render the skai-oidc blueprint (no secret inside)
  template:
    src: "{{ playbook_dir }}/src/config/{{ app }}/blueprints/skai-oidc.yaml.j2"
    dest: /var/data/config/{{ app }}-{{ env }}/blueprints/skai-oidc.yaml
    owner: root
    group: root
    mode: '0644'
