# sksso.CAPAUTH_ENABLED, before the stack deploy: check the vault, create
# CapAuth's state dir and render its env file and OIDC client registry
# (both owner-only: they hold the admin token and the client secret).
# See the README section "CapAuth login".

- name: Check the CapAuth vault keys
  assert:
    that:
      - "'@sha256:' in (sksso.CAPAUTH_IMAGE | default('') | string)"
      - "(sksso.CAPAUTH_CLIENT_SECRET | default('') | string | length) >= 32"
      - "(sksso.CAPAUTH_ADMIN_TOKEN | default('') | string | length) >= 32"
      - "(sksso.api_token | default('') | string | length) >= 32"
    fail_msg: >-
      sksso.CAPAUTH_ENABLED needs sksso.CAPAUTH_IMAGE pinned by digest
      (image@sha256:...), sksso.CAPAUTH_CLIENT_SECRET and
      sksso.CAPAUTH_ADMIN_TOKEN (each openssl rand -hex 32), and
      sksso.api_token (registered once with src/sksso/ensure-api-token.sh).
    quiet: true

- name: Create the CapAuth state dir (key registry, OIDC state, signing key)
  file:
    path: /var/data/{{ app }}-{{ env }}/capauth
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Render the CapAuth env file and OIDC client registry
  template:
    src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
    dest: "/var/data/config/{{ app }}-{{ env }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: capauth.env.j2, dest: capauth.env, mode: "0600" }
    - { src: capauth-oidc-clients.json.j2, dest: capauth-oidc-clients.json, mode: "0600" }
  no_log: true
