# skstacks-deploy probe declaration. Format documented at the framework root, tools dir, deploy-tool docs.
services: [server, worker, postgres, postgres-db-backup, redis, capauth]

mode: swarm

# Authentik runs its own DB migrations on a version bump: never
# auto-restore a failed sksso deploy.
schema_changing: true

# Checked against "<base_url><path>" (base_url comes from the instance's
# skstacks-deploy.yml: services.sksso.base_url).
http_checks:
  - name: default-authentication-flow
    path: /if/flow/default-authentication-flow/
    method: GET
    expect_status: 200
