---
# provision_skpatch_hosts_nodes: the low-privilege account skpatch-hosts's SSH key is
# authorized to use on a target node. This is NOT a swarm deploy: it runs
# against whatever inventory group holds the nodes an instance's skpatch-hosts
# dashboard should be able to reach (the manager/worker swarm, the
# hypervisors, the control node, anything else), one estate at a time.
#
# Idempotent and reversible: rerun with the same vars to converge, or with
# skpatch_hosts_provision_state=absent to remove the account, its key and its sudoers rule
# from every targeted host. Never touches an existing admin account or key
# (holouser*, skuser*, ansible, root, ...): this always creates its own.
#
# Per-host privilege ceiling: a host whose group_vars sets
# `skpatch_hosts_allow_actions: false` NEVER gets the upgrade/reboot sudoers
# lines, even when the vault's global skpatch_hosts.ALLOW_ACTIONS is true. Put
# that on every hypervisor, NAS and anything else that must stay
# report-only regardless of the instance-wide knob (see README
# "Provisioning and least privilege").
#
# Usage:
#   ansible-playbook -i envs/prod/inventory.ini \
#     framework/v1/ansible/optional/skpatch-hosts/provision_skpatch_hosts_nodes.yml \
#     -l <estate-inventory-group> \
#     --vault-password-file ~/.vault_pass_env/.<instance>_prod_vault_pass
#   # remove everywhere this played against:
#   ansible-playbook ... -e skpatch_hosts_provision_state=absent
- hosts: "{{ skpatch_hosts_provision_hosts | default('all') }}"
  become: true
  vars:
    app: skpatch-hosts
    env: "{{ skpatch_hosts_provision_env | default('prod') }}"
    service_name: skpatch-hosts
    service_type: optional
    # skpatch_hosts_provision_state (not skpatch_state) is the external override:
    # a play var cannot default from itself (Ansible template recursion),
    # so the knob an operator sets on the command line is a different name
    # from the derived fact every task below reads.
    skpatch_state: "{{ skpatch_hosts_provision_state | default('present') }}"
    skpatch_user: "{{ skpatch_hosts.PROVISION_USER | default('skpatch-ro', true) }}"
    # A fixed uid/gid well above the SYS_UID range and the first regular
    # users. `system: true` used to let useradd pick a free system uid, and
    # on a swarm node that was 999: the uid the postgres images run as, so
    # every container process "used" the account and userdel refused
    # forever (gate 2026-11-06). Containers share the host's uid space; a
    # host account must never sit on one of their numbers.
    skpatch_uid: "{{ skpatch_hosts.PROVISION_UID | default(5201, true) }}"
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Fail loudly when the SSH public key is missing (state=present)
      # One keypair per estate, generated fresh for this purpose, private
      # half kept only in that estate's vault/secret store. Never the
      # ansible/holouser*/skuser*/root key this instance already uses.
      assert:
        that:
          - skpatch_hosts is defined and skpatch_hosts is mapping
          - skpatch_hosts.SSH_PUBLIC_KEY | default('', true) | string | length > 0
          - skpatch_hosts.SSH_PUBLIC_KEY is match('^(ssh-ed25519|ssh-rsa|ecdsa-sha2-[a-z0-9-]+|sk-ssh-ed25519@openssh\\.com) ')
        fail_msg: >-
          ERROR: skpatch_hosts.SSH_PUBLIC_KEY is required (the PUBLIC half of a
          keypair generated just for this estate's skpatch-hosts instance, e.g.
          `ssh-keygen -t ed25519 -f skpatch-hosts_<estate>_ed25519 -C skpatch-hosts@<estate>`)
          and must look like an OpenSSH public key line. See README.md
          "Provisioning and least privilege".
        quiet: true
      when: skpatch_state == 'present'
      tags: [config]

    - name: Resolve the per-host actions ceiling
      # A host's own group_vars (skpatch_hosts_allow_actions: false) always wins
      # over the instance-wide knob: hypervisors, the NAS, anything else
      # that must never run upgrade/reboot stay report-only no matter what
      # skpatch_hosts.ALLOW_ACTIONS says.
      set_fact:
        skp_node_allow_actions: "{{ (skpatch_hosts_allow_actions if skpatch_hosts_allow_actions is defined else (skpatch_hosts.ALLOW_ACTIONS | default(false))) | bool }}"
      tags: [config]

  tasks:
    - name: Report the posture for this host
      debug:
        msg: >-
          {{ inventory_hostname }}: skpatch-hosts account {{ skpatch_state }},
          actions {{ 'ALLOWED (upgrade/reboot sudoers lines will be written)' if (skpatch_state == 'present' and skp_node_allow_actions | bool) else 'report-only' }}.

    - name: Create the skpatch-hosts group (present)
      # Found live 2026-10-28, the first time the absent (de-provision)
      # path was ever reached end to end: this task used to compute
      # state inline for BOTH present and absent, with no when: guard,
      # so on an absent run it executed FIRST (file order, before the
      # user is removed below) and groupdel refused: "cannot remove the
      # primary group of user 'skpatch-ro'". The absent case is
      # already handled correctly, in the right order (after the user),
      # by "Remove the group (absent)" below -- this task now only
      # handles present, matching every sibling present-only task here.
      group:
        name: "{{ skpatch_user }}"
        gid: "{{ skpatch_uid }}"
        state: present
      when: skpatch_state == 'present'

    - name: Create the skpatch-hosts account (present)
      user:
        name: "{{ skpatch_user }}"
        group: "{{ skpatch_user }}"
        shell: /bin/bash
        comment: "skpatch-hosts low-privilege update-reporting account (framework-managed, see optional/skpatch-hosts)"
        create_home: true
        uid: "{{ skpatch_uid }}"
        state: present
      when: skpatch_state == 'present'

    - name: Install the authorized key (present)
      authorized_key:
        user: "{{ skpatch_user }}"
        key: "{{ skpatch_hosts.SSH_PUBLIC_KEY }}"
        exclusive: true
        state: present
      when: skpatch_state == 'present'

    - name: Write the sudoers rule (present)
      template:
        src: "{{ playbook_dir }}/src/skpatch-hosts/skpatch-hosts.sudoers.j2"
        dest: "/etc/sudoers.d/skpatch"
        owner: root
        group: root
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'
      when: skpatch_state == 'present'

    - name: Remove the sudoers rule (absent)
      file:
        path: /etc/sudoers.d/skpatch
        state: absent
      when: skpatch_state == 'absent'

    - name: End the account's own sessions and processes (absent)
      # The dashboard polls nodes over ssh; a de-provision can land while
      # one of its sessions is still open, and userdel refuses while any
      # process runs under the uid. Ends only this account's sessions.
      shell: |
        loginctl terminate-user "{{ skpatch_user }}" 2>/dev/null || true
        pkill -KILL -u "{{ skpatch_user }}" 2>/dev/null || true
        true
      changed_when: false
      when: skpatch_state == 'absent'

    - name: Remove the account and its home, key included (absent)
      user:
        name: "{{ skpatch_user }}"
        state: absent
        remove: true
        force: true
      when: skpatch_state == 'absent'

    - name: Remove the group (absent)
      group:
        name: "{{ skpatch_user }}"
        state: absent
      when: skpatch_state == 'absent'

# Step 2 (present runs only): register this run's target nodes as systems
# in the dashboard, so it is never empty after a deploy (see README.md
# "Automatic host registration"). Opt-in: nothing calls the dashboard's
# API unless skpatch_hosts.API_TOKEN and API_CREDENTIAL_ID are both set.
# Runs once for the whole play, not per host, and reaches the dashboard
# through a swarm manager (the target nodes themselves -- hypervisors,
# NAS, anything else -- are not necessarily attached to its overlay
# network).
- hosts: "{{ skpatch_hosts_provision_hosts | default('all') }}"
  connection: local
  gather_facts: false
  run_once: true
  vars:
    app: skpatch-hosts
    env: "{{ skpatch_hosts_provision_env | default('prod') }}"
    service_name: skpatch-hosts
    service_type: optional
    skpatch_state: "{{ skpatch_hosts_provision_state | default('present') }}"
  tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml
      when: skpatch_state == 'present'

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: skpatch_state == 'present' and vault_file_path is defined

    - name: Resolve host registration config
      set_fact:
        skp_reg_token: "{{ skpatch_hosts.API_TOKEN | default('', true) | string }}"
        skp_reg_credential_id: "{{ skpatch_hosts.API_CREDENTIAL_ID | default(0) | int }}"
      when: skpatch_state == 'present'

    - name: Report when host registration is not configured (nothing to do)
      debug:
        msg: >-
          skpatch_hosts.API_TOKEN and/or API_CREDENTIAL_ID are not set:
          skipping automatic host registration. See README.md "Automatic
          host registration" to bootstrap it once per estate; nodes can
          always be added by hand in the dashboard instead.
      when: skpatch_state == 'present' and (skp_reg_token | default('') | length == 0 or skp_reg_credential_id | default(0) <= 0)

    - name: Collect this run's target systems (name, hostname, port) from the play's own hosts
      set_fact:
        skp_reg_systems: "{{ skp_reg_systems | default([]) + [{'name': item, 'hostname': hostvars[item].ansible_host | default(item), 'port': hostvars[item].ansible_port | default(22) | int}] }}"
      loop: "{{ ansible_play_hosts_all | default(ansible_play_hosts) }}"
      when: skpatch_state == 'present' and skp_reg_token | default('') | length > 0 and skp_reg_credential_id | default(0) > 0

    - name: Select manager node to reach the dashboard's overlay network
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ skpatch_hosts_register_manager_group | default('swarm_managers') }}"
      when: skpatch_state == 'present' and skp_reg_token | default('') | length > 0 and skp_reg_credential_id | default(0) > 0

    - name: Stage the systems-sync script on the selected manager
      copy:
        src: "{{ playbook_dir }}/src/skpatch-hosts/systems_sync.py"
        dest: "/var/data/config/{{ app }}-{{ env }}/systems_sync.py"
        owner: root
        group: root
        mode: '0644'
      delegate_to: "{{ selected_manager }}"
      when: skpatch_state == 'present' and skp_reg_token | default('') | length > 0 and skp_reg_credential_id | default(0) > 0

    - name: Register this run's target nodes as dashboard systems (idempotent, never deletes)
      command:
        argv:
          - docker
          - run
          - --rm
          - -i
          - --network
          - "{{ app }}-{{ env }}"
          - -v
          - "/var/data/config/{{ app }}-{{ env }}/systems_sync.py:/systems_sync.py:ro"
          - "{{ skpatch_hosts.PROVISIONER_IMAGE | default('python:3.13.15-alpine@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f', true) }}"
          - python
          - /systems_sync.py
        stdin: >-
          {{ {'url': 'http://' ~ app ~ '-' ~ env ~ '_dashboard:3001',
              'token': skp_reg_token,
              'credential_id': skp_reg_credential_id,
              'systems': skp_reg_systems | default([])} | to_json }}
      delegate_to: "{{ selected_manager }}"
      register: skp_reg_result
      changed_when: "'created' in skp_reg_result.stdout or 'updated' in skp_reg_result.stdout"
      failed_when: false
      no_log: true
      when: skpatch_state == 'present' and skp_reg_token | default('') | length > 0 and skp_reg_credential_id | default(0) > 0

    # The script prints status lines only (never a secret), so its output
    # is safe to show; the task above is no_log because its stdin carries
    # the API token.
    - name: Show the registration result
      debug:
        msg: "{{ (skp_reg_result.stdout_lines | default([])) + (skp_reg_result.stderr_lines | default([])) }}"
      when: skpatch_state == 'present' and skp_reg_token | default('') | length > 0 and skp_reg_credential_id | default(0) > 0

    - name: Fail if host registration failed
      fail:
        msg: "skpatch-hosts host registration failed (rc={{ skp_reg_result.rc | default('?') }}), see the lines above"
      when: >-
        skpatch_state == 'present' and skp_reg_token | default('') | length > 0 and skp_reg_credential_id | default(0) > 0
        and (skp_reg_result.rc | default(1)) != 0
