---
# provision_skpatch_hosts_nodes: the low-privilege account skpatch-hosts's SSH key is
# authorized to use on a target node. This is NOT a swarm deploy: it runs
# against whatever inventory group holds the nodes an instance's skpatch-hosts
# dashboard should be able to reach (the manager/worker swarm, the
# hypervisors, the control node, anything else), one estate at a time.
#
# Idempotent and reversible: rerun with the same vars to converge, or with
# skpatch_hosts_provision_state=absent to remove the account, its key and its sudoers rule
# from every targeted host. Never touches an existing admin account or key
# (holouser*, skuser*, ansible, root, ...): this always creates its own.
#
# Per-host privilege ceiling: a host whose group_vars sets
# `skpatch_hosts_allow_actions: false` NEVER gets the upgrade/reboot sudoers
# lines, even when the vault's global skpatch_hosts.ALLOW_ACTIONS is true. Put
# that on every hypervisor, NAS and anything else that must stay
# report-only regardless of the instance-wide knob (see README
# "Provisioning and least privilege").
#
# Usage:
#   ansible-playbook -i envs/prod/inventory.ini \
#     framework/v1/ansible/optional/skpatch-hosts/provision_skpatch_hosts_nodes.yml \
#     -l <estate-inventory-group> \
#     --vault-password-file ~/.vault_pass_env/.<instance>_prod_vault_pass
#   # remove everywhere this played against:
#   ansible-playbook ... -e skpatch_hosts_provision_state=absent
- hosts: "{{ skpatch_hosts_provision_hosts | default('all') }}"
  become: true
  vars:
    app: skpatch-hosts
    env: "{{ skpatch_hosts_provision_env | default('prod') }}"
    service_name: skpatch-hosts
    service_type: optional
    # skpatch_hosts_provision_state (not skpatch_state) is the external override:
    # a play var cannot default from itself (Ansible template recursion),
    # so the knob an operator sets on the command line is a different name
    # from the derived fact every task below reads.
    skpatch_state: "{{ skpatch_hosts_provision_state | default('present') }}"
    skpatch_user: "{{ skpatch_hosts.PROVISION_USER | default('skpatch-ro', true) }}"
    # A fixed uid/gid well above the SYS_UID range and the first regular
    # users. `system: true` used to let useradd pick a free system uid, and
    # on a swarm node that was 999: the uid the postgres images run as, so
    # every container process "used" the account and userdel refused
    # forever (gate 2026-11-06). Containers share the host's uid space; a
    # host account must never sit on one of their numbers.
    skpatch_uid: "{{ skpatch_hosts.PROVISION_UID | default(5201, true) }}"
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Fail loudly when the SSH public key is missing (state=present)
      # One keypair per estate, generated fresh for this purpose, private
      # half kept only in that estate's vault/secret store. Never the
      # ansible/holouser*/skuser*/root key this instance already uses.
      assert:
        that:
          - skpatch_hosts is defined and skpatch_hosts is mapping
          - skpatch_hosts.SSH_PUBLIC_KEY | default('', true) | string | length > 0
          - skpatch_hosts.SSH_PUBLIC_KEY is match('^(ssh-ed25519|ssh-rsa|ecdsa-sha2-[a-z0-9-]+|sk-ssh-ed25519@openssh\\.com) ')
        fail_msg: >-
          ERROR: skpatch_hosts.SSH_PUBLIC_KEY is required (the PUBLIC half of a
          keypair generated just for this estate's skpatch-hosts instance, e.g.
          `ssh-keygen -t ed25519 -f skpatch-hosts_<estate>_ed25519 -C skpatch-hosts@<estate>`)
          and must look like an OpenSSH public key line. See README.md
          "Provisioning and least privilege".
        quiet: true
      when: skpatch_state == 'present'
      tags: [config]

    - name: Resolve the per-host actions ceiling
      # A host's own group_vars (skpatch_hosts_allow_actions: false) always wins
      # over the instance-wide knob: hypervisors, the NAS, anything else
      # that must never run upgrade/reboot stay report-only no matter what
      # skpatch_hosts.ALLOW_ACTIONS says.
      set_fact:
        skp_node_allow_actions: "{{ (skpatch_hosts_allow_actions if skpatch_hosts_allow_actions is defined else (skpatch_hosts.ALLOW_ACTIONS | default(false))) | bool }}"
      tags: [config]

    - name: Detect Proxmox VE (the reboot guard needs pvesh)
      # The app's reboot runs a pvesh backup-activity guard first on any host
      # that has pvesh, and refuses to reboot when that guard cannot run. A
      # host var skpatch_hosts_proxmox (true/false) overrides the detection.
      stat:
        path: /usr/bin/pvesh
      register: skp_pvesh
      when: skpatch_hosts_proxmox is not defined
      tags: [config]

    - name: Resolve whether this host is Proxmox VE
      set_fact:
        skp_node_is_proxmox: "{{ (skpatch_hosts_proxmox if skpatch_hosts_proxmox is defined else (skp_pvesh.stat.exists | default(false))) | bool }}"
        # Unattended upgrades keep a locally changed conffile instead of
        # stopping at dpkg's prompt (see the dpkg.cfg.d task below).
        skp_keep_conffiles: "{{ skpatch_hosts.DPKG_KEEP_CONFFILES | default(true) | bool }}"
      tags: [config]

  tasks:
    - name: Report the posture for this host
      debug:
        msg: >-
          {{ inventory_hostname }}: skpatch-hosts account {{ skpatch_state }},
          actions {{ 'ALLOWED (upgrade/reboot sudoers lines will be written)' if (skpatch_state == 'present' and skp_node_allow_actions | bool) else 'report-only' }}.

    - name: Create the skpatch-hosts group (present)
      # Found live 2026-10-28, the first time the absent (de-provision)
      # path was ever reached end to end: this task used to compute
      # state inline for BOTH present and absent, with no when: guard,
      # so on an absent run it executed FIRST (file order, before the
      # user is removed below) and groupdel refused: "cannot remove the
      # primary group of user 'skpatch-ro'". The absent case is
      # already handled correctly, in the right order (after the user),
      # by "Remove the group (absent)" below -- this task now only
      # handles present, matching every sibling present-only task here.
      group:
        name: "{{ skpatch_user }}"
        gid: "{{ skpatch_uid }}"
        state: present
      when: skpatch_state == 'present'

    - name: Create the skpatch-hosts account (present)
      user:
        name: "{{ skpatch_user }}"
        group: "{{ skpatch_user }}"
        shell: /bin/bash
        comment: "skpatch-hosts low-privilege update-reporting account (framework-managed, see optional/skpatch-hosts)"
        create_home: true
        uid: "{{ skpatch_uid }}"
        state: present
      when: skpatch_state == 'present'

    - name: Install the authorized key (present)
      authorized_key:
        user: "{{ skpatch_user }}"
        key: "{{ skpatch_hosts.SSH_PUBLIC_KEY }}"
        exclusive: true
        state: present
      when: skpatch_state == 'present'

    - name: Install the selected-package upgrade wrappers (present, actions allowed)
      # Root-owned scripts that sudoers grants by absolute path instead of an
      # apt-get/snap wildcard (see the sudoers template and README
      # "Selected-package upgrades"). Installed before the sudoers rule that
      # names them, and only where this host may run actions at all: the same
      # condition the apt upgrade lines use.
      copy:
        src: "{{ playbook_dir }}/src/skpatch-hosts/{{ item }}.sh"
        dest: "/usr/local/sbin/{{ item }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - skpatch-apt-only-upgrade
        - skpatch-snap-refresh
      when: skpatch_state == 'present' and skp_node_allow_actions | bool

    - name: Remove the selected-package upgrade wrappers (absent, or actions no longer allowed)
      file:
        path: "/usr/local/sbin/{{ item }}"
        state: absent
      loop:
        - skpatch-apt-only-upgrade
        - skpatch-snap-refresh
      when: skpatch_state == 'absent' or not (skp_node_allow_actions | bool)

    - name: Keep local conffiles during unattended upgrades (present, actions allowed)
      # The app runs apt and `dpkg --configure -a` with stdin on /dev/null. A
      # package that ships a new version of a conffile the host has changed
      # then stops at dpkg's "keep or install?" prompt, reads EOF and fails
      # its configure step, leaving dpkg interrupted (found live 2026-11-13 on
      # a Raspberry Pi OS desktop package). force-confdef takes the package's
      # default answer where it has one, force-confold otherwise keeps the
      # file the host has: the same answer the prompt itself defaults to.
      # dpkg.cfg.d (not apt.conf.d) so the Repair action is covered too.
      # Off with skpatch_hosts.DPKG_KEEP_CONFFILES: false.
      copy:
        dest: /etc/dpkg/dpkg.cfg.d/90-skpatch-hosts
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by SKStacks optional/skpatch-hosts (provision_skpatch_hosts_nodes.yml).
          # Unattended upgrades from the patch dashboard have no terminal: answer
          # dpkg's conffile prompt with the package default, else keep the local file.
          force-confdef
          force-confold
      when: skpatch_state == 'present' and skp_node_allow_actions | bool and skp_keep_conffiles | bool

    - name: Remove the conffile policy (absent, actions off, or DPKG_KEEP_CONFFILES false)
      file:
        path: /etc/dpkg/dpkg.cfg.d/90-skpatch-hosts
        state: absent
      when: skpatch_state == 'absent' or not (skp_node_allow_actions | bool) or not (skp_keep_conffiles | bool)

    - name: Write the sudoers rule (present)
      template:
        src: "{{ playbook_dir }}/src/skpatch-hosts/skpatch-hosts.sudoers.j2"
        dest: "/etc/sudoers.d/skpatch"
        owner: root
        group: root
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'
      when: skpatch_state == 'present'

    - name: Remove the sudoers rule (absent)
      file:
        path: /etc/sudoers.d/skpatch
        state: absent
      when: skpatch_state == 'absent'

    - name: End the account's own sessions and processes (absent)
      # The dashboard polls nodes over ssh; a de-provision can land while
      # one of its sessions is still open, and userdel refuses while any
      # process runs under the uid. Ends only this account's sessions.
      shell: |
        loginctl terminate-user "{{ skpatch_user }}" 2>/dev/null || true
        pkill -KILL -u "{{ skpatch_user }}" 2>/dev/null || true
        true
      changed_when: false
      when: skpatch_state == 'absent'

    - name: Remove the account and its home, key included (absent)
      user:
        name: "{{ skpatch_user }}"
        state: absent
        remove: true
        force: true
      when: skpatch_state == 'absent'

    - name: Remove the group (absent)
      group:
        name: "{{ skpatch_user }}"
        state: absent
      when: skpatch_state == 'absent'

# Step 2 (present runs only): register this run's target nodes as systems
# in the dashboard, so it is never empty after a deploy (see README.md
# "Automatic host registration"). Opt-in: nothing touches the dashboard
# unless skpatch_hosts.REGISTER_AS names one of its admin accounts and an
# SSH credential is given (CREDENTIAL_ID, or SSH_PRIVATE_KEY to create it).
# Runs once for the whole play, not per host, inside the dashboard's own
# container (tasks/register_systems.yml says why: the pinned dashboard
# refuses API tokens for this, so it uses a short session it signs itself).
- hosts: "{{ skpatch_hosts_provision_hosts | default('all') }}"
  connection: local
  gather_facts: false
  run_once: true
  vars:
    app: skpatch-hosts
    env: "{{ skpatch_hosts_provision_env | default('prod') }}"
    service_name: skpatch-hosts
    service_type: optional
    skpatch_state: "{{ skpatch_hosts_provision_state | default('present') }}"
  tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml
      when: skpatch_state == 'present'

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: skpatch_state == 'present' and vault_file_path is defined

    - name: Resolve host registration config
      set_fact:
        skp_reg_as: "{{ skpatch_hosts.REGISTER_AS | default('', true) | string }}"
        skp_reg_credential_id: "{{ (skpatch_hosts.CREDENTIAL_ID | default(0, true) | int) or (skpatch_hosts.API_CREDENTIAL_ID | default(0, true) | int) }}"
        skp_reg_private_key: "{{ skpatch_hosts.SSH_PRIVATE_KEY | default('', true) | string }}"
        skp_reg_on: >-
          {{ (skpatch_hosts.REGISTER_AS | default('', true) | string | length > 0)
             and ((skpatch_hosts.CREDENTIAL_ID | default(0, true) | int) > 0
                  or (skpatch_hosts.API_CREDENTIAL_ID | default(0, true) | int) > 0
                  or (skpatch_hosts.SSH_PRIVATE_KEY | default('', true) | string | length > 0)) }}
      no_log: true  # carries the private key
      when: skpatch_state == 'present'

    - name: Refuse the old API-token registration settings
      fail:
        msg: >-
          skpatch_hosts.API_TOKEN is set, but the pinned dashboard (linux-update-dashboard
          2026.10.9) refuses every API-token request that creates a system (403 "API tokens
          cannot configure SSH connections"), so token registration can never work. Remove
          API_TOKEN and set REGISTER_AS to a dashboard admin's username instead (README.md
          "Automatic host registration"); API_CREDENTIAL_ID keeps working as CREDENTIAL_ID.
      when: skpatch_state == 'present' and skpatch_hosts.API_TOKEN | default('', true) | string | length > 0

    - name: Report when host registration is not configured (nothing to do)
      debug:
        msg: >-
          skpatch_hosts.REGISTER_AS and an SSH credential (CREDENTIAL_ID or SSH_PRIVATE_KEY)
          are not both set: skipping automatic host registration. See README.md "Automatic
          host registration"; nodes can always be added by hand in the dashboard instead.
      when: skpatch_state == 'present' and not (skp_reg_on | bool)

    # The dashboard connects from inside its container, which does not
    # always reach a host on the address the controller uses (an ssh-config
    # alias, a tailnet name): skpatch_hosts_dashboard_address/_port on the
    # host override ansible_host/ansible_port for the registered system.
    # skpatch_hosts_upgrade_mode (upgrade | full-upgrade) overrides the
    # vault's UPGRADE_MODE for that one system.
    - name: Collect this run's target systems (name, hostname, port) from the play's own hosts
      set_fact:
        skp_reg_systems: >-
          {{ skp_reg_systems | default([]) + [{
               'name': item,
               'hostname': hostvars[item].skpatch_hosts_dashboard_address | default(hostvars[item].ansible_host | default(item), true),
               'port': hostvars[item].skpatch_hosts_dashboard_port | default(hostvars[item].ansible_port | default(22), true) | int,
               'upgrade_mode': hostvars[item].skpatch_hosts_upgrade_mode | default('', true) | string}] }}
      loop: "{{ ansible_play_hosts_all | default(ansible_play_hosts) }}"
      when: skpatch_state == 'present' and skp_reg_on | bool

    - name: Register this run's target nodes as dashboard systems (only when registration is configured)
      include_tasks: tasks/register_systems.yml
      when: skpatch_state == 'present' and skp_reg_on | bool
