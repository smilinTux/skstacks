# Single source of truth for which of the dashboard's sudo commands this role
# grants, and how. Read by three things, so they can never disagree:
#   - provision_skpatch_hosts_nodes.yml: refuses a host with a detected
#     manager that is not in `supported` (loud, before any sudoers change).
#   - v1/tests/test_skpatch_hosts_sudo_coverage.py: every command the PINNED
#     image emits (fixture v1/tests/fixtures/skpatch_hosts_sudo_commands.json,
#     regenerated by tools/extract_sudo_commands.py) must appear here and be
#     granted exactly as stated, so an image bump that adds or changes a
#     command fails CI until this file and the sudoers template catch up.
#   - tools/skpatch_compliance.py: flags a dashboard system whose detected
#     managers are not all in `supported`.
#
# A command is one of:
#   exact:   granted verbatim (sudoers-escaped) at `paths[<executable>]`.
#   wrapper: the placeholder form (<package>...) is NOT granted; the named
#            root-owned wrapper is, and the dashboard's default custom script
#            for that manager calls it.
#   denied:  deliberately not granted; `why` says why. The dashboard action
#            fails closed with "sudo: a password is required".
# `when` is `read_only` (granted on every provisioned host) or `actions`
# (only where skpatch_hosts_allow_actions is true). `proxmox: true` adds
# "only where pvesh exists".
supported: [apt, snap, pacman, flatpak]

# Absolute paths the sudoers template uses (Debian/Ubuntu, Proxmox VE, Arch
# and Manjaro all agree on these).
paths:
  apt-get: /usr/bin/apt-get
  dpkg: /usr/bin/dpkg
  snap: /usr/bin/snap
  pacman: /usr/bin/pacman
  flatpak: /usr/bin/flatpak
  reboot: /usr/sbin/reboot
  pvesh: /usr/bin/pvesh

commands:
  common:
    - {command: "reboot", rule: exact, when: actions}
    - {command: "pvesh get /cluster/tasks --output-format json", rule: exact, when: actions, proxmox: true}
  apt:
    - {command: "dpkg --audit", rule: exact, when: read_only}
    - {command: "apt-get -o DPkg::Lock::Timeout=60 update -qq", rule: exact, when: read_only}
    - {command: "apt-get -o DPkg::Lock::Timeout=60 upgrade -y", rule: exact, when: actions}
    - {command: "apt-get -o DPkg::Lock::Timeout=60 full-upgrade -y", rule: exact, when: actions}
    - {command: "apt-get -o DPkg::Lock::Timeout=60 autoremove -y", rule: exact, when: actions}
    - {command: "dpkg --configure -a", rule: exact, when: actions}
    - {command: "apt-get -o DPkg::Lock::Timeout=60 install --only-upgrade -y <package>", rule: wrapper, wrapper: skpatch-apt-only-upgrade, when: actions}
    - {command: "apt-get -o DPkg::Lock::Timeout=60 install --only-upgrade -y <package1> <package2>", rule: wrapper, wrapper: skpatch-apt-only-upgrade, when: actions}
  snap:
    - {command: "snap refresh", rule: exact, when: actions}
    - {command: "snap refresh <package>", rule: wrapper, wrapper: skpatch-snap-refresh, when: actions}
    - {command: "snap refresh <package1> <package2>", rule: wrapper, wrapper: skpatch-snap-refresh, when: actions}
  pacman:
    - {command: "pacman -Sy --noconfirm", rule: exact, when: read_only}
    - {command: "pacman -Syu --noconfirm", rule: exact, when: actions}
    - {command: "pacman -S --noconfirm <package>", rule: wrapper, wrapper: skpatch-pacman-upgrade, when: actions}
    - {command: "pacman -S --noconfirm <package1> <package2>", rule: wrapper, wrapper: skpatch-pacman-upgrade, when: actions}
    - command: "pacman -Rns --noconfirm -"
      rule: denied
      why: removes whatever package names arrive on stdin, so it could remove any package; run autoremove by hand on Arch hosts.
  flatpak:
    - {command: "flatpak update --appstream", rule: exact, when: read_only}
    - {command: "flatpak update -y", rule: exact, when: actions}
    - {command: "flatpak uninstall --unused -y", rule: exact, when: actions}
    - {command: "flatpak update -y <package>", rule: wrapper, wrapper: skpatch-flatpak-update, when: actions}
    - {command: "flatpak update -y <package1> <package2>", rule: wrapper, wrapper: skpatch-flatpak-update, when: actions}
