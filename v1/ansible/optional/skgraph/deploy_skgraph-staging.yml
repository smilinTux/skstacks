---
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
# Run on all hosts to ensure it executes even with -l limit
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skgraph
    env: staging
    service_name: skgraph
    service_type: optional
    skgraph_data_path: "{{ skgraph.DATA_PATH | default('/var/data/' + app + '-' + env + '/data', true) }}"
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Fail closed on a local data path without a pinned data node
      # A path outside /var/data is local disk on one node. Without DATA_NODE
      # swarm may reschedule falkordb elsewhere and start it on an empty
      # directory (data loss): see README "Local data on a pinned node".
      vars:
        _data_node: "{{ skgraph.DATA_NODE | default('', true) | string }}"
        _data_path: "{{ skgraph.DATA_PATH | default('/var/data/', true) | string }}"
      assert:
        that:
          - (_data_node | length > 0) or _data_path.startswith('/var/data/')
        fail_msg: >-
          skgraph.DATA_PATH points at local disk ({{ skgraph_data_path }}) but
          skgraph.DATA_NODE is empty. Set DATA_NODE to the node holding the data.
        quiet: true

    - name: Define network variables from vault (idempotent network creation)
      # ⚠️ IMPORTANT: Network subnets MUST match shared/networks registry
      # Reference: See shared/networks for all registered network subnets
      # Networks are created idempotently by:
      #   1. create_networks.yml shared task (Ansible pre-deployment)
      #   2. deploy.j2 script (runtime, enables rm stack && ./deploy workflow)
      # Subnets from shared/networks:
      #   skgraph-staging: 172.16.173.0/24
      #   cloud-public-staging: 172.16.201.0/24
      set_fact:
        app_networks: "{{ skgraph.networks | default([
          { 'name': 'skgraph-staging', 'subnet': '172.16.173.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'cloud-public-staging', 'subnet': '172.16.201.0/24', 'driver': 'overlay', 'attachable': true }
        ]) }}"
      tags:
        - networks
        - config

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    - name: Create the {{ app }} directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: 0755
      loop:
        - /var/data/{{ app }}-{{ env }}
        - /var/data/config/{{ app }}-{{ env }}

    - name: Set data directory ownership
      # Only when DATA_PATH stays on /var/data; a local path is created on
      # DATA_NODE below, and the old shared-storage path is left alone once
      # it moved (README "Local data on a pinned node").
      file:
        path: "{{ skgraph_data_path }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: skgraph_data_path.startswith('/var/data/')

    - name: Create the {{ app }} local data directory on the data node (not recursive)
      # falkordb/falkordb runs as root (uid 0): same owner/mode as the
      # shared-storage copy.
      file:
        path: "{{ skgraph_data_path }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: not skgraph_data_path.startswith('/var/data/')
      # Ansible templates delegate_to before it evaluates when, so it must
      # render with DATA_NODE unset too (the guard above requires DATA_NODE
      # whenever this task actually runs).
      delegate_to: "{{ skgraph.DATA_NODE | default(inventory_hostname, true) }}"

    - name: Process {{ app }} environment templates
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0640'
      loop:
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env" }
        - { src: "{{ app }}.sh.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env" }
      tags:
        - templates

    - name: Process {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - compose

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags:
        - compose

    # FalkorDB uses Redis protocol only - no web UI, no Traefik routing needed
    # Access via internal overlay network from other services

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags:
        - deploy-script

    - name: Create {{ app }} control script symlink
      file:
        src: "/var/data/{{ app }}-{{ env }}/deploy"
        dest: "/var/data/deploy_{{ app }}-{{ env }}"
        force: yes
        owner: root
        group: root
        mode: '0755'
        state: link
      tags:
        - deploy-script

    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags:
        - networks

    - name: Deploy {{ app }} stack
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        ./deploy
      register: deploy_output
      tags:
        - deploy

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags:
        - deploy
