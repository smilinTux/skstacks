---
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
# Run on all hosts to ensure it executes even with -l limit
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skpdf
    env: staging
    service_name: skpdf
    service_type: optional
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml
    
    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Define default network variables when not provided in vault
      # ⚠️ IMPORTANT: Network subnets MUST match shared/networks registry
      # Reference: See shared/networks for all registered network subnets
      # Networks are created by create_networks.yml shared task (included below)
      set_fact:
        app_networks: "{{ skpdf_staging_networks | default([
          { 'name': 'skpdf-staging', 'subnet': '172.16.168.0/24' },
          { 'name': 'cloud-public-staging', 'subnet': '172.16.201.0/24' }
        ]) }}"
      tags:
        - networks

    - name: Set skpdf default variables
      set_fact:
        skpdf: "{{ skpdf_defaults | combine(skpdf | default({}), recursive=True) }}"
      vars:
        skpdf_defaults:
          DOCKER_ENABLE_SECURITY: "false"
          INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
          LANGS: "en_GB"
          SYSTEM_DEFAULTLOCALE: "en-US"
          SYSTEM_GOOGLEVISIBILITY: "false"
          SYSTEM_SHOWUPDATE: "false"
          SECURITY_ENABLELOGIN: "false"
          SECURITY_CSRFDISABLED: "true"
          METRICS_ENABLED: "true"
      tags:
        - always

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    - name: Create the {{ app }} directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: 0755
      loop:
        - /var/data/{{ app }}-{{ env }}
        - /var/data/{{ app }}-{{ env }}/trainingData
        - /var/data/{{ app }}-{{ env }}/extraConfigs
        - /var/data/{{ app }}-{{ env }}/logs
        - /var/data/{{ app }}-{{ env }}/customFiles
        - /var/data/{{ app }}-{{ env }}/pipeline
        - /var/data/config/{{ app }}-{{ env }}

    - name: Check if {{ app }}.sh.env already exists on target
      stat:
        path: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env"
      register: sh_env_exists
      tags:
        - templates

    - name: Process {{ app }} environment templates (excluding .sh.env if it exists)
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0640'
      loop:
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env" }
      when: item.src != (app + '.sh.env.j2')
      tags:
        - templates

    - name: Create {{ app }}.sh.env only if it doesn't exist
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.sh.env.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env"
        owner: root
        group: root
        mode: '0640'
      when: not sh_env_exists.stat.exists
      tags:
        - templates

    - name: Process {{ app }} settings template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/settings.yml.j2"
        dest: "/var/data/{{ app }}-{{ env }}/extraConfigs/settings.yml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - templates

    - name: Process {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - compose

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags:
        - compose

    # Traefik routing is now configured via Docker labels (Docker provider)
    # No file provider deployment needed - all labels in compose file per new SOP
    # Certificates: Provided by traefik-certs-dumper (runs on skfence/skfenceha ACME master node)

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags:
        - deploy-script

    # Network creation is now handled idempotently in the deploy script
    # This ensures networks are recreated if removed, making redeployment self-contained

    - name: Deploy {{ app }} stack
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        ./deploy
      register: deploy_output
      tags:
        - deploy

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags:
        - deploy
