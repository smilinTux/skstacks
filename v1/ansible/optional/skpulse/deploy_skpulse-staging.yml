---
# skpulse: Uptime Kuma behind skfenceha. AUTH_MODE sso (default) puts
# Authentik forward auth in front of the dashboard/login/socket.io while
# push monitors, public status pages and badges stay reachable with no
# session; AUTH_MODE local is Kuma's own login only, no SSO. Opt-in:
# nothing renders unless this playbook runs. See README.md.
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
# Run on all hosts to ensure it executes even with -l limit
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"
      tags: always

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skpulse
    env: staging
    service_name: skpulse
    service_type: optional
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml
      tags: always

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined
      tags: always

    - name: Resolve the skpulse sign-in settings
      # AUTH_MODE sso (default): Authentik forward auth (SSO_MIDDLEWARE,
      # default authentik@file) on the dashboard/login/socket.io router.
      # AUTH_MODE local: Kuma's own login only, no SSO_MIDDLEWARE allowed.
      # Fail closed: an unset AUTH_MODE means sso, never no-auth.
      set_fact:
        skp_auth_mode: "{{ skpulse.AUTH_MODE | default('sso', true) | string | lower }}"
        skp_sso_middleware: "{{ (skpulse.SSO_MIDDLEWARE | default('', true) | string) if (skpulse.AUTH_MODE | default('sso', true) | string | lower) != 'sso' else (skpulse.SSO_MIDDLEWARE | default('authentik@file', true) | string) }}"
        skp_router: "skpulse{{ '' if env == 'prod' else '-' + env }}"
        skp_public_host: "{{ skpulse.HOSTNAME | default('skpulse' + ('' if env == 'prod' else '-' + env) + '.' + (skpulse.CLUSTERNAME | default(cluster_name, true)) + '.' + (skpulse.DOMAIN | default(domain, true)), true) }}"
      tags: [config, authmode]

    - name: Fail loudly on an unknown AUTH_MODE
      assert:
        that:
          - skp_auth_mode in ['sso', 'local']
        fail_msg: >-
          ERROR: skpulse.AUTH_MODE must be 'sso' or 'local' (it is
          '{{ skp_auth_mode }}'). See README.md "Sign-in, SSO and the
          first admin".
        quiet: true
      tags: [config, authmode]

    - name: Collect contradictory sign-in settings
      # Only key NAMES are ever collected, never a value.
      set_fact:
        skp_auth_conflicts: >-
          {{ (["AUTH_MODE is 'local' (no SSO) but SSO_MIDDLEWARE is set"]
              if (skp_auth_mode == 'local' and (skpulse.SSO_MIDDLEWARE | default('', true) | string | length > 0))
              else []) }}
      tags: [config, authmode]

    - name: Refuse contradictory sign-in settings
      assert:
        that:
          - skp_auth_conflicts | length == 0
        fail_msg: >-
          ERROR: the skpulse vault block contradicts itself: {{ skp_auth_conflicts | join('; ') }}.
          Either set AUTH_MODE: sso, or remove SSO_MIDDLEWARE. See
          README.md "Sign-in, SSO and the first admin".
        quiet: true
      tags: [config, authmode]

    - name: Define network variables from vault (required for idempotent deployment)
      # ⚠️ IMPORTANT: Network subnets MUST match shared/networks registry
      # Reference: See shared/networks for all registered network subnets
      # Networks are created by create_networks.yml shared task (included below)
      set_fact:
        app_networks: "{{ skpulse_staging_networks | default([
          { 'name': 'skpulse-staging', 'subnet': '172.16.151.0/24' },
          { 'name': 'cloud-public-staging', 'subnet': '172.16.201.0/24' }
        ]) }}"
      tags:
        - networks
        - config

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    - name: Ensure {{ app }}-{{ env }} directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /var/data/{{ app }}-{{ env }}
        - /var/data/config/{{ app }}-{{ env }}
        - /var/data/{{ app }}-{{ env }}/uptime-kuma

    - name: Process {{ app }} environment templates
      ansible.builtin.template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '{{ item.mode | default("0644") }}'
      loop:
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env", mode: "0644" }
        - { src: "{{ app }}.sh.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env", mode: "0640" }
      tags:
        - templates

    - name: Process {{ app }} Docker Compose template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - compose

    - name: Process {{ app }} deploy script template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
        force: yes
      tags:
        - templates
        - deploy-script

    - name: Copy discovery script to config directory
      copy:
        src: "{{ playbook_dir }}/src/{{ app }}/discover-traefik-frontends.sh"
        dest: "/var/data/config/{{ app }}-{{ env }}/discover-traefik-frontends.sh"
        owner: root
        group: root
        mode: '0755'
      tags:
        - templates
        - scripts

    - name: Create {{ app }} control script symlink
      file:
        src: /var/data/{{ app }}-{{ env }}/deploy
        dest: /var/data/deploy_{{ app }}-{{ env }}
        force: yes
        owner: root
        group: root
        mode: '0755'
        state: link
        follow: no

    - name: Create {{ app }} docker-compose.yml symlink
      file:
        src: /var/data/config/{{ app }}-{{ env }}/{{ app }}.yml
        dest: /var/data/config/{{ app }}-{{ env }}/docker-compose.yml
        force: yes
        owner: root
        group: root
        mode: '0644'
        state: link

    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags:
        - networks

    - name: Deploy {{ app }} stack
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        ./deploy
      register: deploy_output
      tags:
        - deploy

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags:
        - deploy

    - name: Post-deploy Check SKPulse service health
      shell: docker service ls --filter "name={{ app }}-{{ env }}_skpulse" --format "{{ '{{.Name}}\t{{.Replicas}}' }}"
      register: skpulse_service_info
      failed_when: false
      changed_when: false
      tags:
        - deploy

    - name: Print SKPulse service status
      debug:
        msg: "SKPulse service status: {{ skpulse_service_info.stdout | default('Service check completed') }}"
      when: skpulse_service_info.stdout is defined
      tags:
        - deploy

    - name: Check whether skpulse already has a database (first-run setup not finished)
      stat:
        path: "/var/data/{{ app }}-{{ env }}/uptime-kuma/kuma.db"
      register: skpulse_db_stat
      tags:
        - deploy
        - authmode

    - name: Find the running skpulse container (for the sign-in setting toggle)
      shell: docker ps -q -f "name={{ app }}-{{ env }}_skpulse" | head -1
      register: skpulse_cid
      changed_when: false
      failed_when: false
      when: skpulse_db_stat.stat.exists | default(false)
      tags:
        - deploy
        - authmode

    - name: Check Kuma's own entry-page (first-run setup not finished vs. a normal running app)
      # curl FROM INSIDE the container: port 3001 is only reachable on its
      # own overlay network (the same reason skpulse_disable_auth_toggle
      # below already runs through docker exec, not a host-level call --
      # there is no published host port for this service, Traefik reaches
      # it over the overlay network like every other role here).
      shell: >
        docker exec {{ skpulse_cid.stdout }} curl -s -m 10
        http://127.0.0.1:{{ skpulse_internal_port | default(3001) }}/api/entry-page
      register: skpulse_entry_page_raw
      changed_when: false
      failed_when: false
      when: skpulse_cid.stdout | default('') | length > 0
      tags:
        - deploy
        - authmode

    - name: Parse the entry-page response
      set_fact:
        skpulse_entry_page_type: "{{ (skpulse_entry_page_raw.stdout | default('{}') | from_json).type | default('') }}"
      when: skpulse_entry_page_raw.stdout | default('') | length > 0
      tags:
        - deploy
        - authmode

    - name: Decide whether first-run setup is needed
      # /api/entry-page is Kuma's own authoritative signal (setup-database.js
      # sets needSetup from whether db-config.json exists and is valid) --
      # no separate user-count check needed, and none is available yet at
      # this point in the play anyway. Defaults to false (skip) if the
      # container isn't reachable at all, the safe direction: never attempt
      # setup against a state we could not actually confirm needs it.
      set_fact:
        skp_needs_first_run: "{{ (skpulse_entry_page_type | default('')) == 'setup-database' }}"
      tags:
        - deploy
        - authmode

    - name: Ensure the local generated-secrets directory exists (controller only, never a git tree)
      file:
        path: "{{ lookup('env', 'HOME') }}/.skstacks-generated"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when: skp_needs_first_run | default(false) | bool
      tags:
        - deploy
        - authmode

    - name: Generate (or reuse) the first admin's password, local to this controller only
      # The password lookup itself generates-and-caches AT this exact path:
      # first run writes a fresh random value here, every later run (incl.
      # --tags authmode) reads the SAME value back instead of regenerating.
      # Outside any git tree on purpose (never committed); the operator is
      # told where it is and should move it into the instance vault for
      # anyone else to be able to log in later -- this is only load-bearing
      # for the ONE-TIME setup call below, not for ongoing sign-in once
      # AUTH_MODE: sso's disableAuth takes over.
      set_fact:
        skp_admin_pw_file: "{{ lookup('env', 'HOME') }}/.skstacks-generated/{{ app }}-{{ env }}-{{ inventory_hostname }}-admin-password"
        skp_admin_pw_materialized: "{{ lookup('ansible.builtin.password', lookup('env', 'HOME') + '/.skstacks-generated/' + app + '-' + env + '-' + inventory_hostname + '-admin-password', length=32, chars=['ascii_letters', 'digits']) }}"
      no_log: true
      when: skp_needs_first_run | default(false) | bool
      tags:
        - deploy
        - authmode

    - name: Copy the generated password onto the target host (controller -> target, Ansible transfer)
      # skp_admin_pw_file lives on the CONTROLLER (the task that generated
      # it ran delegate_to: localhost); the script and docker cp below run
      # ON the target manager, so this file has to actually cross hosts
      # first, same as any other copy: task in this playbook.
      copy:
        src: "{{ skp_admin_pw_file }}"
        dest: "/tmp/skp_admin_pw.txt"
        mode: "0600"
      no_log: true
      when: skp_admin_pw_file is defined
      tags:
        - deploy
        - authmode

    - name: Copy the first-run setup script onto the target host
      copy:
        src: "{{ playbook_dir }}/src/{{ app }}/kuma_first_run_setup.py"
        dest: "/tmp/kuma_first_run_setup.py"
        mode: "0644"
      when: skp_admin_pw_file is defined
      tags:
        - deploy
        - authmode

    - name: Write the entry-page config the script reads (no secrets, just host/port)
      copy:
        content: '{"host":"127.0.0.1","port":{{ skpulse_internal_port | default(3001) }}}'
        dest: "/tmp/skp_first_run_cfg.json"
        mode: "0644"
      when: skp_admin_pw_file is defined
      tags:
        - deploy
        - authmode

    - name: Copy the script, config and password into the container (now all co-located on the target)
      shell: >
        docker cp /tmp/kuma_first_run_setup.py {{ skpulse_cid.stdout }}:/tmp/kuma_first_run_setup.py
        && docker cp /tmp/skp_first_run_cfg.json {{ skpulse_cid.stdout }}:/tmp/skp_first_run_cfg.json
        && docker cp /tmp/skp_admin_pw.txt {{ skpulse_cid.stdout }}:/tmp/skp_admin_pw.txt
      changed_when: true
      when: skp_admin_pw_file is defined
      tags:
        - deploy
        - authmode

    - name: Complete Kuma's own first-run setup (sqlite + first admin), idempotent
      # Safe to re-run: skips /setup-database if already configured, skips
      # "setup" if an admin already exists (see the script's own docstring).
      # Does NOT set disableAuth itself -- the existing toggle task below
      # does that once this makes the admin-exists condition true.
      shell: >
        docker exec {{ skpulse_cid.stdout }} python3 /tmp/kuma_first_run_setup.py
        /tmp/skp_first_run_cfg.json /tmp/skp_admin_pw.txt
      register: skpulse_first_run_setup
      changed_when: "'PASS' in skpulse_first_run_setup.stdout or 'skipping' in skpulse_first_run_setup.stdout"
      failed_when: skpulse_first_run_setup.rc != 0
      when: skp_admin_pw_file is defined
      tags:
        - deploy
        - authmode

    - name: Clean up the first-run setup helper files (target and container)
      shell: >
        docker exec {{ skpulse_cid.stdout }} sh -c 'rm -f /tmp/kuma_first_run_setup.py /tmp/skp_first_run_cfg.json /tmp/skp_admin_pw.txt';
        rm -f /tmp/kuma_first_run_setup.py /tmp/skp_first_run_cfg.json /tmp/skp_admin_pw.txt
      changed_when: false
      when: skp_admin_pw_file is defined
      tags:
        - deploy
        - authmode

    - name: Report where the generated admin password landed (never the value itself)
      debug:
        msg: >-
          First admin 'skadmin' created with a freshly generated password,
          saved on this controller at {{ skp_admin_pw_file }} (0600). Move it
          into the instance vault if anyone else needs to sign in directly;
          AUTH_MODE: sso does not need it day to day (Authentik + disableAuth
          is the only gate once the next task below runs).
      when: skp_admin_pw_file is defined and skpulse_first_run_setup.rc | default(1) == 0
      tags:
        - deploy
        - authmode

    - name: Re-count Kuma admin users (picks up the account the task above may have just created)
      shell: >
        docker exec {{ skpulse_cid.stdout }} sqlite3 /app/data/kuma.db
        "SELECT COUNT(*) FROM user;"
      register: skpulse_user_count
      changed_when: false
      failed_when: false
      when: skpulse_db_stat.stat.exists | default(false) and (skpulse_cid.stdout | default('') | length > 0)
      tags:
        - deploy
        - authmode

    - name: Align Kuma's own login (disableAuth) with AUTH_MODE, fail closed
      # AUTH_MODE sso: Authentik forward auth already gates the host, so
      # Kuma's own username/password prompt is disabled (one login, not
      # two). AUTH_MODE local: Kuma's own login is the ONLY gate, so this
      # ALWAYS forces disableAuth back to false (fail closed: a cluster
      # that used to run sso and switched to local must never be left with
      # auth disabled and no forward-auth in front). Skipped entirely until
      # the first admin account exists (never touches a fresh, unset-up
      # instance). This is a direct, idempotent write to Kuma's own
      # `setting` table, the only place `disableAuth` lives (no env var,
      # no REST endpoint before login): same class of direct app-state
      # write as skrac's config.json.
      shell: >
        docker exec {{ skpulse_cid.stdout }} sqlite3 /app/data/kuma.db
        "INSERT INTO setting (key, value, type) VALUES ('disableAuth', '{{ 'true' if skp_auth_mode == 'sso' else 'false' }}', 'general')
         ON CONFLICT(key) DO UPDATE SET value=excluded.value, type=excluded.type;"
      register: skpulse_disable_auth_toggle
      changed_when: skpulse_disable_auth_toggle.rc == 0
      when: >
        skpulse_db_stat.stat.exists | default(false)
        and (skpulse_cid.stdout | default('') | length > 0)
        and ((skpulse_user_count.stdout | default('0') | trim | regex_replace('[^0-9]', '') | default('0', true) | int) > 0)
      tags:
        - deploy
        - authmode

    - name: Create or update the skpulse portal tile in Authentik
      # On by default (AUTHENTIK_TILE: true); opt out per instance with
      # AUTHENTIK_TILE: false. The fleet's convention until now was a
      # hand-made Authentik bookmark tile
      # (see docs/runbooks/sksso.md "Portal tile icons" on the nor
      # instance). This gives skpulse the same tile as code: a
      # provider-less core.Application bound to a group, so it shows
      # on the portal for admins without touching forward auth.
      include_tasks: ../../shared/tasks/authentik_portal_tile.yml
      vars:
        portal_tile:
          enabled: "{{ skpulse.AUTHENTIK_TILE | default(true) | bool }}"
          slug: "{{ skpulse.AUTHENTIK_TILE_SLUG | default(skp_router, true) }}"
          name: "{{ skpulse.AUTHENTIK_TILE_NAME | default('SKPulse (Uptime Kuma)', true) }}"
          launch_url: "https://{{ skp_public_host }}"
          group: "{{ skpulse.AUTHENTIK_TILE_GROUP | default('authentik Admins', true) }}"
          icon: "{{ skpulse.AUTHENTIK_TILE_ICON | default('fa://fa-heart-pulse', true) }}"
          icon_file: "{{ skpulse.AUTHENTIK_TILE_ICON_FILE | default('icon.png', true) }}"
          icon_name: "{{ skpulse.AUTHENTIK_TILE_ICON_NAME | default('uptime-kuma', true) }}"
          open_in_new_tab: "{{ skpulse.AUTHENTIK_TILE_OPEN_IN_NEW_TAB | default(true) | bool }}"
          description: "{{ skpulse.AUTHENTIK_TILE_DESCRIPTION | default('', true) }}"
      tags:
        - config
        - authentik
