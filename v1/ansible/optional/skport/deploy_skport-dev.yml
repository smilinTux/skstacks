---
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
# Run on all hosts to ensure it executes even with -l limit
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skport
    env: dev
    service_name: skport
    service_type: optional
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Define network variables from vault (required for idempotent deployment)
      # IMPORTANT: Network subnets MUST match shared/networks registry
      # Reference: See shared/networks for all registered network subnets
      # Networks are created by create_networks.yml shared task (included below)
      # cloud-public-dev and cloud-socket-proxy-dev use the framework's
      # canonical subnets (shared with every other optional service and
      # with skfence/skfenceha, which own cloud-socket-proxy-dev); only
      # skport-dev is new, and it is allocated from the reserved
      # 172.16.250.0/24-172.16.254.0/24 band for services published after
      # 2026-09-26.
      set_fact:
        app_networks: "{{ skport_dev_networks | default([
          { 'name': 'skport-dev', 'subnet': '172.16.250.0/25' },
          { 'name': 'cloud-public-dev', 'subnet': '172.16.202.0/24' },
          { 'name': 'cloud-socket-proxy-dev', 'subnet': '172.16.206.0/24' }
        ]) }}"
      tags:
        - networks

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    - name: Ensure {{ app }}-{{ env }} directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /var/data/{{ app }}-{{ env }}
        - /var/data/config/{{ app }}-{{ env }}
        - /var/data/{{ app }}-{{ env }}/data

    - name: Detect socket-proxy stack (skfence or skfenceha)
      # SKPort never mounts the Docker socket directly: it always talks to
      # whichever of skfence (single-node) or skfenceha (HA) is deployed,
      # through that stack's socket-proxy service on cloud-socket-proxy-{{ env }}.
      shell: |
        set -o pipefail
        if docker service ls --format "{{ '{{' }}.Name{{ '}}' }}" | grep -q "^skfenceha-{{ env }}_socket-proxy$"; then
          echo "skfenceha"
        elif docker service ls --format "{{ '{{' }}.Name{{ '}}' }}" | grep -q "^skfence-{{ env }}_socket-proxy$"; then
          echo "skfence"
        else
          echo "skfence"
        fi
      args:
        executable: /bin/bash
      register: socket_proxy_detection
      changed_when: false

    - name: Set socket_proxy_stack fact for template processing
      set_fact:
        socket_proxy_stack: "{{ socket_proxy_detection.stdout | trim }}"

    - name: Process {{ app }} environment templates
      ansible.builtin.template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '{{ item.mode | default("0644") }}'
      loop:
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env", mode: "0640" }
        - { src: "{{ app }}.sh.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env", mode: "0640" }
      tags:
        - templates

    - name: Process {{ app }} Docker Compose template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - compose

    - name: Process {{ app }} deploy script template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
        force: yes
      tags:
        - templates
        - deploy-script

    - name: Create {{ app }} control script symlink
      file:
        src: /var/data/{{ app }}-{{ env }}/deploy
        dest: /var/data/deploy_{{ app }}-{{ env }}
        force: yes
        owner: root
        group: root
        mode: '0755'
        state: link
        follow: no

    - name: Create {{ app }} docker-compose.yml symlink
      file:
        src: /var/data/config/{{ app }}-{{ env }}/{{ app }}.yml
        dest: /var/data/config/{{ app }}-{{ env }}/docker-compose.yml
        force: yes
        owner: root
        group: root
        mode: '0644'
        state: link

    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags:
        - networks

    - name: Deploy {{ app }} stack
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        ./deploy
      register: deploy_output
      tags:
        - deploy

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags:
        - deploy

    - name: Post-deploy Check Portainer service health
      community.docker.docker_swarm_service_info:
        name: "{{ app }}-{{ env }}_portainer"
      register: portainer_service
      failed_when: false
      tags:
        - deploy

    - name: Print Portainer service status
      debug:
        msg: "Portainer service {{ app }}-{{ env }}_portainer status: {{ portainer_service.service.Spec.Name | default('not found') }}"
      tags:
        - deploy
