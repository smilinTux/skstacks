---
# skpatch: linux-update-dashboard (self-hosted Linux patch/update dashboard,
# upstream github.com/TheDuffman85/linux-update-dashboard, AGPL-3.0) behind
# skfenceha. One upstream image, digest-pinned: `dashboard` (Node, one
# SQLite file under /data holding encrypted SSH credentials, exactly ONE
# replica). This app holds SSH keys that can reach every host it is pointed
# at: AUTH_MODE defaults to sso (Authentik forward auth on the whole
# router, same as skhome) and ALLOW_ACTIONS defaults to false (upgrade/
# reboot stay off; this role never writes a privileged sudoers line on a
# target node unless the operator sets it explicitly, see
# provision_skpatch_nodes.yml). Opt-in: nothing renders unless this
# playbook runs. See README.md.
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
# Run on all hosts to ensure it executes even with -l limit
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skpatch
    env: dev
    service_name: skpatch
    service_type: optional
    # linux-update-dashboard 2026.10.9 (upstream release image, multi-arch
    # amd64/arm64, pinned by the manifest-LIST digest so either architecture
    # resolves correctly). The compose template writes the same literal so
    # v1/scripts/list_images.py sees the pin; test_skpatch_render.py keeps
    # the two equal.
    skp_default_image: "ghcr.io/theduffman85/linux-update-dashboard:2026.10.9@sha256:1fb855a4d4b5eacc0ef3a9816064184492e9d068fb4da353c62871faeeeb1543"
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Fail loudly when the skpatch vault block or its encryption key is missing
      # LUDASH_ENCRYPTION_KEY encrypts every SSH credential and password the
      # dashboard stores for every node it reaches. The deploy writes it
      # into the app's env file (the vault is the source of truth, not a
      # value the app generates itself); losing or changing it makes every
      # stored credential unreadable and they must be re-entered.
      assert:
        that:
          - skpatch is defined and skpatch is mapping
          - skpatch.LUDASH_ENCRYPTION_KEY | default('', true) | string | length >= 32
        fail_msg: >-
          ERROR: skpatch.LUDASH_ENCRYPTION_KEY is required (a random string
          of at least 32 characters, e.g. `openssl rand -base64 32`) in the
          skpatch vault block. See README.md "Configuration (vault)".
        quiet: true
      tags: [config]

    - name: Resolve the skpatch settings
      set_fact:
        skp_base_domain: "{{ skpatch.DOMAIN | default(domain) if skpatch.CLOUDFLARED | default(false) | bool else (skpatch.CLUSTERNAME | default(cluster_name)) ~ '.' ~ (skpatch.DOMAIN | default(domain)) }}"
        skp_image: "{{ skpatch.IMAGE | default(skp_default_image, true) }}"
        skp_data_path: "{{ skpatch.DATA_PATH | default('/var/data/' + app + '-' + env + '/data', true) }}"
        skp_data_node: "{{ skpatch.DATA_NODE | default('', true) | string }}"
        # default-no-error-pages@file: the dashboard's own JSON API errors
        # (credential validation, login) should not be replaced with HTML.
        skp_middlewares: "{{ skpatch.TRAEFIK_MIDDLEWARES | default('default-no-error-pages@file', true) }}"
        # AUTH_MODE sso (default): Authentik forward auth (SSO_MIDDLEWARE,
        # default authentik@file) in front of the WHOLE router (this app has
        # no separate external API consumer to carve out, unlike skgym).
        # local: the app's own login only (password/TOTP/passkey), no
        # SSO_MIDDLEWARE allowed. Bind the Authentik application to the
        # instance's admin group only: this app holds the keys to every
        # node it reaches.
        skp_auth_mode: "{{ skpatch.AUTH_MODE | default('sso', true) | string | lower }}"
        skp_sso_middleware: "{{ (skpatch.SSO_MIDDLEWARE | default('', true) | string) if (skpatch.AUTH_MODE | default('sso', true) | string | lower) != 'sso' else (skpatch.SSO_MIDDLEWARE | default('authentik@file', true) | string) }}"
        skp_tls_options: "{{ skpatch.TLS_OPTIONS | default('intermediate@file', true) }}"
        skp_router: "skpatch{{ '' if env == 'prod' else '-' + env }}"
        # ALLOW_ACTIONS is metadata for the operator and for
        # provision_skpatch_nodes.yml: it never arms a sudoers rule by
        # itself. Default false: report-only.
        skp_allow_actions: "{{ skpatch.ALLOW_ACTIONS | default(false) | bool }}"
      tags: [config]

    - name: Resolve the public host
      set_fact:
        skp_host: "{{ skpatch.HOSTNAME | default('skpatch' + ('' if env == 'prod' else '-' + env) + '.' + skp_base_domain, true) }}"
      tags: [config]

    - name: Validate the image pin and the public host
      assert:
        that:
          - "'@sha256:' in skp_image"
          - skp_host is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
        fail_msg: >-
          ERROR: skpatch.IMAGE must be pinned by digest (@sha256:) and
          HOSTNAME (or CLUSTERNAME/DOMAIN) must be a plain host name. IMAGE
          is {{ skp_image }}, host is {{ skp_host }}.
        quiet: true
      tags: [config]

    - name: Fail loudly on an unknown AUTH_MODE
      assert:
        that:
          - skp_auth_mode in ['sso', 'local']
        fail_msg: >-
          ERROR: skpatch.AUTH_MODE must be 'sso' or 'local' (it is
          '{{ skp_auth_mode }}'). See README.md "Sign-in and the admin
          group".
        quiet: true
      tags: [config]

    - name: Collect contradictory sign-in settings
      # Only key NAMES and middleware names are collected, never a value
      # from the secret side of the vault.
      set_fact:
        skp_auth_conflicts: >-
          {{ (["AUTH_MODE is 'local' (no SSO) but SSO_MIDDLEWARE is set"] if (skp_auth_mode == 'local' and skp_sso_middleware | length > 0) else [])
             + (['TRAEFIK_MIDDLEWARES carries forward auth (' ~ skp_middlewares ~ '): with AUTH_MODE local it is SSO under another name; use AUTH_MODE sso (SSO_MIDDLEWARE) instead']
                if ('authentik' in skp_middlewares | lower) or (skp_sso_middleware | length > 0 and skp_sso_middleware in skp_middlewares.split(',')) else []) }}
      tags: [config]

    - name: Refuse contradictory sign-in settings
      assert:
        that:
          - skp_auth_conflicts | length == 0
        fail_msg: >-
          ERROR: the skpatch vault block contradicts itself: {{ skp_auth_conflicts | join('; ') }}.
          See README.md "Sign-in and the admin group".
        quiet: true
      tags: [config]

    - name: Fail closed on a local data path without a pinned data node
      # A path outside /var/data is local disk on one node: without
      # DATA_NODE swarm may reschedule the dashboard elsewhere onto an
      # empty directory (every stored credential gone, and the node list
      # it tracked gone with it). Same rule as sksso/skhub/skpayment/skgym.
      assert:
        that:
          - (skp_data_node | length > 0) or (skp_data_path.startswith('/var/data/'))
        fail_msg: >-
          skpatch.DATA_PATH points at local disk ({{ skp_data_path }}) but
          skpatch.DATA_NODE is empty. Set DATA_NODE to the node holding the
          data.
        quiet: true
      tags: [config]

    - name: Define network variables from vault (idempotent network creation)
      # Subnets: skpatch-prod 172.16.154.0/24, -staging .155, -dev .156
      # (reserved for skpatch, checked against v1/tests/test_unique_subnets.py).
      # Override with the flat per-env skpatch_<env>_networks.
      set_fact:
        app_networks: "{{ skpatch_dev_networks | default([
          { 'name': 'skpatch-dev', 'subnet': '172.16.156.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'cloud-public-dev', 'subnet': '172.16.202.0/24', 'driver': 'overlay', 'attachable': true }
        ]) }}"
      tags: [networks, config]

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    - name: Report the access posture
      debug:
        msg: >-
          skpatch auth: {{ 'sso (' ~ skp_sso_middleware ~ ' in front of the whole app)' if skp_auth_mode == 'sso' else 'local (its own login only, no forward auth)' }};
          actions: {{ 'ALLOWED (upstream upgrade/reboot buttons can work, if a target node was provisioned with an actions sudoers rule)' if skp_allow_actions | bool else 'REPORT-ONLY (ALLOW_ACTIONS is false; this knob does not by itself grant anything, see provision_skpatch_nodes.yml)' }}.
      tags: [config]

    - name: Create the {{ app }} directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /var/data/{{ app }}-{{ env }}
        - /var/data/config/{{ app }}-{{ env }}

    - name: Create the {{ app }} data directory on shared storage (not recursive, root only)
      # The dashboard's database holds encrypted SSH credentials for every
      # node it is pointed at. 0700 keeps other accounts on the NFS client
      # out; the image runs as a non-root uid that it chowns to on its own
      # first start (bind mount ownership comes from the host).
      file:
        path: "{{ skp_data_path }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: skp_data_path.startswith('/var/data/')

    - name: Create the {{ app }} local data directory on the data node (not recursive, root only)
      file:
        path: "{{ skp_data_path }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: not skp_data_path.startswith('/var/data/')
      # Ansible templates delegate_to before it evaluates when, so it must
      # render with DATA_NODE unset too (the guard above requires DATA_NODE
      # whenever this task actually runs).
      delegate_to: "{{ skpatch.DATA_NODE | default(inventory_hostname, true) }}"

    - name: Process {{ app }} app env (root only)
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.env.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env"
        owner: root
        group: root
        mode: '0600'
      register: skpatch_env
      tags: [templates]

    - name: Process {{ app }} shell env
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.sh.env.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env"
        owner: root
        group: root
        mode: '0640'
      tags: [templates]

    - name: Process {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags: [compose]

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags: [compose]

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags: [deploy-script]

    - name: Create {{ app }} control script symlink
      file:
        src: "/var/data/{{ app }}-{{ env }}/deploy"
        dest: "/var/data/deploy_{{ app }}-{{ env }}"
        force: yes
        owner: root
        group: root
        state: link
      tags: [deploy-script]

    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags: [networks]

    - name: Deploy {{ app }} stack
      # The env file is an env_file mount: a changed file alone does not
      # change the service spec, so the deploy script restarts the
      # dashboard when the play changed it.
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        RESTART_DASHBOARD={{ '1' if (skpatch_env is changed) else '0' }} ./deploy
      register: deploy_output
      tags: [deploy]

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags: [deploy]

    - name: Create or update the skpatch portal tile in Authentik
      # Opt-in and off by default (AUTHENTIK_TILE: true). skpatch (linux
      # update dashboard) sits behind the cluster's domain-wide Traefik
      # ForwardAuth catch-all already; this just gives it a bookmark tile
      # on the Authentik portal. Defaults to the admin group: this app
      # holds the keys to every node it reaches (see "Resolve the
      # skpatch settings" above).
      include_tasks: ../../shared/tasks/authentik_portal_tile.yml
      vars:
        portal_tile:
          enabled: "{{ skpatch.AUTHENTIK_TILE | default(false) | bool }}"
          slug: "{{ skpatch.AUTHENTIK_TILE_SLUG | default(skp_router, true) }}"
          name: "{{ skpatch.AUTHENTIK_TILE_NAME | default('SKPatch (Linux updates)', true) }}"
          launch_url: "https://{{ skp_host }}"
          group: "{{ skpatch.AUTHENTIK_TILE_GROUP | default('authentik Admins', true) }}"
          icon: "{{ skpatch.AUTHENTIK_TILE_ICON | default('fa://fa-wrench', true) }}"
          open_in_new_tab: "{{ skpatch.AUTHENTIK_TILE_OPEN_IN_NEW_TAB | default(true) | bool }}"
          description: "{{ skpatch.AUTHENTIK_TILE_DESCRIPTION | default('', true) }}"
      tags:
        - config
        - authentik
