# SKPages: static HTML pages published by agents, served read-only by Caddy
# at https://pages.<cluster>.<domain>/ behind Authentik. See README.md and
# https://github.com/smilinTux/skpages for the CLI and skill agents use.
---
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Render and deploy on the selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skpages
    env: dev
    service_name: skpages
    service_type: optional
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Resolve SKPages settings (vault values win, defaults below)
      set_fact:
        # NOTE: cluster_name/domain come from shared/hosts group vars.
        skpages_clustername: "{{ (skpages | default({})).CLUSTERNAME | default(cluster_name) }}"
        skpages_domain: "{{ (skpages | default({})).DOMAIN | default(domain) }}"
        skpages_cloudflared: "{{ (skpages | default({})).CLOUDFLARED | default(false) | bool }}"
        skpages_auth: "{{ (skpages | default({})).AUTH | default(true) | bool }}"
        # Usually a Nextcloud group folder: /var/data/skhub-<env>/data/__groupfolders/<id>/files.
        # Any /var/data path works for a Nextcloud-free docroot. No default: the
        # group folder id differs per hub.
        skpages_docroot: "{{ (skpages | default({})).DOCROOT | default('') }}"
        skpages_docroot_create: "{{ (skpages | default({})).DOCROOT_CREATE | default(false) | bool }}"
        skpages_uid: "{{ (skpages | default({})).UID | default(33) }}"
        skpages_gid: "{{ (skpages | default({})).GID | default(33) }}"
        skpages_image: "{{ (skpages | default({})).IMAGE | default('caddy:2.11.8-alpine') }}"
        # Router knobs (same convention as <svc>.TRAEFIK_MIDDLEWARES elsewhere).
        # Unset: private router = default@file + authentik@file (or just
        # default@file with AUTH false), public /p/ router = default@file.
        skpages_middlewares: >-
          {{ (skpages | default({})).TRAEFIK_MIDDLEWARES | default('', true)
             or ('default@file,authentik@file' if ((skpages | default({})).AUTH | default(true) | bool) else 'default@file') }}
        skpages_middlewares_public: "{{ (skpages | default({})).TRAEFIK_MIDDLEWARES_PUBLIC | default('default@file', true) }}"
        # Empty string = no certresolver label (wildcard cert served by the edge).
        skpages_certresolver: "{{ (skpages | default({})).CERTRESOLVER | default('main') }}"
        skpages_csp: >-
          {{ (skpages | default({})).CSP | default(
          "default-src 'self'; "
          ~ "script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; "
          ~ "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; "
          ~ "font-src 'self' data: https://fonts.gstatic.com; "
          ~ "img-src 'self' data: blob: https:; media-src 'self' data: blob:; "
          ~ "connect-src 'self'; form-action 'none'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'") }}
      tags: [always]

    - name: Compute public hostname (pages[-env].<cluster>.<domain>, cluster dropped behind cloudflared)
      set_fact:
        skpages_fqdn: >-
          pages{{ '' if env == 'prod' else '-' ~ env }}{{ '' if skpages_cloudflared else '.' ~ skpages_clustername }}.{{ skpages_domain }}
      tags: [always]

    - name: Define default network variables when not provided in vault
      set_fact:
        app_networks: "{{ skpages_dev_networks | default([
          { 'name': 'skpages-dev', 'subnet': '172.16.108.0/24' },
          { 'name': 'cloud-public-dev', 'subnet': '172.16.202.0/24' }
        ]) }}"
      tags: [networks]

  tasks:
    - name: Require a docroot
      fail:
        msg: >-
          skpages.DOCROOT is not set. Create the skpages group folder (see
          README.md, Deploy step 2) and set DOCROOT to its
          __groupfolders/<id>/files path.
      when: skpages_docroot | length == 0

    - name: Create the {{ app }} directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /var/data/{{ app }}-{{ env }}
        - /var/data/config/{{ app }}-{{ env }}

    # When the docroot lives inside Nextcloud, create it through Nextcloud
    # (`sk-pages init`, or a new folder in Files). A folder made on disk behind
    # Nextcloud's back is invisible in Files until an occ files:scan.
    - name: Create a Nextcloud-free docroot (only when DOCROOT_CREATE is true)
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ skpages_uid }}"
        group: "{{ skpages_gid }}"
        mode: '0755'
      loop:
        - "{{ skpages_docroot }}"
        - "{{ skpages_docroot }}/p"
      when: skpages_docroot_create

    # A host command, not stat: the render gate drops host commands and
    # stands in rc 0, so this check runs on the manager only.
    - name: Check the docroot exists
      command: test -d {{ skpages_docroot | quote }}
      register: docroot_check
      changed_when: false
      failed_when: false

    - name: Refuse to deploy without a docroot
      fail:
        msg: >-
          Docroot {{ skpages_docroot }} does not exist. Create the skpages group
          folder first (see README.md, Deploy step 2), or set
          skpages.DOCROOT_CREATE=true for a docroot outside Nextcloud.
      when: docroot_check.rc != 0

    - name: Render Caddyfile
      template:
        src: src/config/{{ app }}/Caddyfile.j2
        dest: /var/data/config/{{ app }}-{{ env }}/Caddyfile
        owner: root
        group: root
        mode: '0644'
      tags: [config]

    - name: Render {{ app }}.sh.env
      template:
        src: src/config/{{ app }}/{{ app }}.sh.env.j2
        dest: /var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env
        owner: root
        group: root
        mode: '0640'
      tags: [config]

    - name: Render {{ app }}.yml
      template:
        src: src/config/{{ app }}/{{ app }}.yml.j2
        dest: /var/data/config/{{ app }}-{{ env }}/{{ app }}.yml
        owner: root
        group: root
        mode: '0644'
      tags: [config]

    - name: Link docker-compose.yml to the rendered compose file
      file:
        src: /var/data/config/{{ app }}-{{ env }}/{{ app }}.yml
        dest: /var/data/config/{{ app }}-{{ env }}/docker-compose.yml
        force: yes
        state: link

    - name: Render deploy script
      template:
        src: src/{{ app }}/deploy.j2
        dest: /var/data/{{ app }}-{{ env }}/deploy
        owner: root
        group: root
        mode: '0755'
      tags: [deploy-script]

    - name: Create {{ app }} control script symlink
      file:
        src: /var/data/{{ app }}-{{ env }}/deploy
        dest: /var/data/deploy_{{ app }}-{{ env }}
        force: yes
        state: link

    - name: Ensure overlay networks exist
      include_tasks: ../../shared/tasks/create_networks.yml
      tags: [networks]

    - name: Deploy {{ app }} stack
      command: /var/data/{{ app }}-{{ env }}/deploy
      register: deploy_output
      changed_when: true
      tags: [deploy]

    - name: Show deploy output
      debug:
        var: deploy_output.stdout_lines
      tags: [deploy]
