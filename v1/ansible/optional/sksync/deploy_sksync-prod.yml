---
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
# Run on all hosts to ensure it executes even with -l limit
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
# UFW rules and the stack itself both run on the one selected manager only:
# a play targeting the whole manager group races the shared /var/data storage.
- hosts: selected_manager_group
  become: true
  vars:
    app: sksync
    env: prod
    service_name: sksync
    service_type: optional
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Define default network variables when not provided in vault
      # ⚠️ IMPORTANT: Network subnets MUST match shared/networks registry
      # Reference: See shared/networks for all registered network subnets
      # Networks are created by create_networks.yml shared task (included below)
      set_fact:
        app_networks: "{{ sksync_prod_networks | default([
          { 'name': 'sksync-prod', 'subnet': '172.16.70.0/24' },
          { 'name': 'cloud-public-prod', 'subnet': '172.16.200.0/24' }
        ]) }}"
      tags:
        - networks

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    - name: Configure UFW rules for SKSync
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "SKSync {{ item.service }} - {{ env }}"
      loop:
        - { port: "22000", proto: "tcp", service: "Syncthing Sync (TCP)" }
        - { port: "22000", proto: "udp", service: "Syncthing Sync (UDP)" }
      tags:
        - firewall
        - ufw

    - name: Create the {{ app }} directories
      # Best Practice: Run as UID 1000 (jz user) - non-root for security
      # sync-data is the main data directory where all shared folders are created
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "/var/data/{{ app }}-{{ env }}", owner: '1000', group: '1000', mode: '0755' }
        - { path: "/var/data/{{ app }}-{{ env }}/sync-data", owner: '1000', group: '1000', mode: '0755' }
        - { path: "/var/data/{{ app }}-{{ env }}/syncthing_config", owner: '1000', group: '1000', mode: '0755' }
        - { path: "/var/data/config/{{ app }}-{{ env }}", owner: 'root', group: 'root', mode: '0755' }

    - name: Create the optional {{ app }} extra data directory (SYNC_DATA_EXTRA_MOUNT parity hook)
      # Only needed when sksync.SYNC_DATA_EXTRA_MOUNT is set (see sksync.yml.j2);
      # unused otherwise so other instances are unaffected.
      file:
        path: "/var/data/{{ app }}-{{ env }}/syncthing_data"
        state: directory
        owner: '1000'
        group: '1000'
        mode: '0755'
      when: sksync.SYNC_DATA_EXTRA_MOUNT is defined

    - name: Ensure correct permissions on {{ app }} data directories (recursive fix)
      # UID 1000 = jz user on host, syncthing user in container
      shell: |
        chown -R 1000:1000 "{{ item }}"
        find "{{ item }}" -type d -exec chmod 755 {} \;
        find "{{ item }}" -type f -exec chmod 644 {} \;
      loop:
        - /var/data/{{ app }}-{{ env }}/sync-data
        - /var/data/{{ app }}-{{ env }}/syncthing_config
      changed_when: true

    - name: Check if {{ app }}.sh.env already exists on target
      stat:
        path: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env"
      register: sh_env_exists
      tags:
        - templates

    - name: Process {{ app }} environment templates (excluding .sh.env if it exists)
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0640'
      loop:
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env" }
      when: item.src != app ~ '.sh.env.j2'
      tags:
        - templates

    - name: Create {{ app }}.sh.env
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.sh.env.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env"
        owner: root
        group: root
        mode: '0640'
      tags:
        - templates

    - name: Process {{ app }} {{ app }}.yml template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - compose

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags:
        - compose

    # Traefik routing is now configured via Docker labels (Docker provider)
    # No file provider deployment needed - all labels in compose file per new SOP
    # Certificates: Provided by traefik-certs-dumper (runs on skfence/skfenceha ACME master node)

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags:
        - deploy-script

    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags:
        - networks

    - name: Deploy {{ app }} stack
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        ./deploy
      register: deploy_output
      tags:
        - deploy

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags:
        - deploy
