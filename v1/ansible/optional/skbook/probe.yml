# skstacks-deploy probe declaration. Format documented at the framework root, tools dir, deploy-tool docs.
services: [bookstack, db, db-backup]

mode: swarm

# BookStack (Laravel) runs its own DB migrations on a version bump: never
# auto-restore a failed skbook deploy.
schema_changing: true

# Checked against "<base_url><path>" (base_url comes from the instance's
# skstacks-deploy.yml: services.skbook.base_url).
http_checks:
  - name: login
    path: /login
    method: GET
    expect_status: 200
