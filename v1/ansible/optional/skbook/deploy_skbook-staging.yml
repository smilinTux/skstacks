---
# skbook (BookStack + MariaDB) swarm deploy (staging), adapted from optional/skgraph
# and optional/skmem-pg. Deploy runs on ONE selected manager only (hosts:
# selected_manager_group), never the whole manager group, so a first deploy
# does not run "docker stack deploy" from more than one manager at once.
- import_playbook: ../../shared/meta/skstack-header.yml

- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

- hosts: selected_manager_group
  become: true
  vars:
    app: skbook
    env: staging
    service_name: skbook
    service_type: optional
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml
    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Validate skbook.BACKUP_TIME (HH:MM, 24-hour) when set
      assert:
        that:
          - (skbook.BACKUP_TIME | default('', true) | string) is match('^([01][0-9]|2[0-3]):[0-5][0-9]$')
        fail_msg: >-
          ERROR: skbook.BACKUP_TIME must be 24-hour 'HH:MM', e.g. '03:00'.
        quiet: true
      when: skbook.BACKUP_TIME is defined

    - name: Check skbook.BACKUP_TZ is a known IANA time zone (control node /usr/share/zoneinfo)
      stat:
        path: "/usr/share/zoneinfo/{{ skbook.BACKUP_TZ | default('UTC') }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: _skbook_backup_tz_check
      when: skbook.BACKUP_TIME is defined

    - name: Validate skbook.BACKUP_TZ is a known IANA time zone
      assert:
        that:
          - _skbook_backup_tz_check.stat.exists
        fail_msg: >-
          ERROR: skbook.BACKUP_TZ '{{ skbook.BACKUP_TZ | default('UTC') }}' is not a
          known IANA time zone (checked /usr/share/zoneinfo on the control node).
        quiet: true
      when: skbook.BACKUP_TIME is defined
    - name: Define network variables from vault (idempotent network creation)
      # skbook-staging: 172.16.221.0/24
      # cloud-public-staging: 172.16.201.0/24
      set_fact:
        app_networks: "{{ skbook.networks | default([
          { 'name': 'skbook-staging', 'subnet': '172.16.221.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'cloud-public-staging', 'subnet': '172.16.201.0/24', 'driver': 'overlay', 'attachable': true }
        ]) }}"
      tags: [networks, config]
  tasks:
    - name: Create {{ app }} directories
      file: { path: "{{ item }}", state: directory, owner: root, group: root, mode: '0755' }
      loop:
        - /var/data/{{ app }}-{{ env }}
        - /var/data/{{ app }}-{{ env }}/database-dump
        - /var/data/runtime/{{ app }}-{{ env }}/db
        - /var/data/config/{{ app }}-{{ env }}
    - name: Create the BookStack config directories owned by PUID/PGID
      # Not recursive. bookstack/config is the linuxserver image's /config
      # (uploads, storage, logs), which the container writes as PUID/PGID
      # itself, so the deploy only owns the two directories it creates.
      # `recurse: yes` walked every upload over NFS on every deploy, and its
      # mode 0755 marked every file executable.
      file: { path: "{{ item }}", state: directory, owner: "{{ skbook.PUID | default(1000) }}", group: "{{ skbook.PGID | default(1000) }}", mode: '0755' }
      loop:
        - /var/data/{{ app }}-{{ env }}/bookstack
        - /var/data/{{ app }}-{{ env }}/bookstack/config
    - name: Process {{ app }} env templates
      template: { src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}", dest: "{{ item.dest }}", mode: '0640' }
      loop:
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env" }
        - { src: "{{ app }}.sh.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env" }
        - { src: "bookstack.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/bookstack.env" }
        - { src: "{{ app }}-db-backup.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}-db-backup.env" }
      tags: [templates]
    - name: Process {{ app }} compose/stack template
      template: { src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml", mode: '0644' }
      tags: [compose]
    - name: docker-compose.yml symlink
      file: { src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml", dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml", state: link, force: yes }
      tags: [compose]
    - name: Process deploy script template
      template: { src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2", dest: "/var/data/{{ app }}-{{ env }}/deploy", mode: '0755' }
      tags: [deploy-script]
    - name: control script symlink
      file: { src: "/var/data/{{ app }}-{{ env }}/deploy", dest: "/var/data/deploy_{{ app }}-{{ env }}", state: link, force: yes, mode: '0755' }
      tags: [deploy-script]
    - name: Ensure overlay networks exist
      include_tasks: ../../shared/tasks/create_networks.yml
      tags: [networks]
    - name: Deploy {{ app }} stack
      shell: "cd /var/data/{{ app }}-{{ env }} && ./deploy"
      register: deploy_output
      tags: [deploy]
    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags: [deploy]

    - name: Create or update the skbook portal tile in Authentik
      # On by default (AUTHENTIK_TILE: true); opt out per instance with
      # AUTHENTIK_TILE: false. skbook sits behind the cluster's domain-wide
      # Traefik ForwardAuth catch-all already; this just gives it a
      # bookmark tile on the Authentik portal, bound to a group, with no
      # provider. See shared/tasks/authentik_portal_tile.yml.
      include_tasks: ../../shared/tasks/authentik_portal_tile.yml
      vars:
        portal_tile:
          enabled: "{{ skbook.AUTHENTIK_TILE | default(true) | bool }}"
          slug: "{{ skbook.AUTHENTIK_TILE_SLUG | default(app, true) }}"
          name: "{{ skbook.AUTHENTIK_TILE_NAME | default('SKBook (BookStack)', true) }}"
          launch_url: "https://skbook{{ '' if env == 'prod' else '-' + env }}.{{ skbook.CLUSTERNAME }}.{{ skbook.DOMAIN }}"
          group: "{{ skbook.AUTHENTIK_TILE_GROUP | default('authentik Admins', true) }}"
          icon: "{{ skbook.AUTHENTIK_TILE_ICON | default('fa://fa-book', true) }}"
          open_in_new_tab: "{{ skbook.AUTHENTIK_TILE_OPEN_IN_NEW_TAB | default(true) | bool }}"
          description: "{{ skbook.AUTHENTIK_TILE_DESCRIPTION | default('', true) }}"
      tags:
        - config
        - authentik
