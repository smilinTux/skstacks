---
# =============================================================================
# SKGit (Forgejo) Deployment Playbook - Development
# =============================================================================
# Self-hosted Git service with CI/CD (Forgejo Actions) runners.
# TODO before deploy: register skgit-dev overlay subnet in shared/networks
# (172.16.229.0/24, not yet registered); add skgit vault vars (POSTGRES_PASSWORD,
# SHARED_SECRET, SECRET_KEY, INTERNAL_TOKEN, ADMIN_EMAIL, ADMIN_PASSWORD,
# RUNNER_REGISTRATION_TOKEN, CLUSTERNAME, DOMAIN); ensure images are pullable
# on swarm nodes. Traefik routing uses plain Docker labels (no shared
# detect_traefik_setup task - that task is not part of this framework).
# =============================================================================
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skgit
    env: dev
    service_name: skgit
    service_type: optional
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Refuse to enable Forgejo metrics without a token
      assert:
        that:
          - not (skgit.METRICS_ENABLED | default(false) | bool) or (skgit.METRICS_TOKEN | default('') | length > 0)
        fail_msg: >-
          skgit.METRICS_ENABLED is true but skgit.METRICS_TOKEN is not set.
          Set skgit.METRICS_TOKEN in the vault (Prometheus must then send
          'Authorization: Bearer <token>'), or leave METRICS_ENABLED
          unset/false to keep /metrics closed.
      tags:
        - always

    - name: Resolve the admin credentials (lowercase key wins, the documented uppercase key is accepted)
      # The header documents ADMIN_EMAIL / ADMIN_PASSWORD (uppercase, like the
      # other skgit secrets) while these tasks read admin_email/admin_password:
      # an instance following the docs got no admin user. Accept both.
      set_fact:
        skgit_admin_password: "{{ skgit.admin_password | default(skgit.ADMIN_PASSWORD | default('')) }}"
        skgit_admin_email: "{{ skgit.admin_email | default(skgit.ADMIN_EMAIL | default('')) }}"
        skgit_admin_username: "{{ skgit.admin_username | default(skgit.ADMIN_USERNAME | default('skadmin')) }}"
      no_log: true
      tags:
        - always

    - name: Refuse an admin bootstrap without credentials
      # skgit.admin_enabled asks for an admin user; without a password and an
      # email the bootstrap below used to be skipped silently.
      assert:
        that:
          - not (skgit.admin_enabled | default(false) | bool) or (skgit_admin_password | length > 0 and skgit_admin_email | length > 0)
        fail_msg: >-
          skgit.admin_enabled is true but no admin password and/or email is set
          (skgit.admin_password/admin_email or ADMIN_PASSWORD/ADMIN_EMAIL). Set both in the vault, or leave
          skgit.admin_enabled unset/false to skip the admin bootstrap.
      tags:
        - always

    - name: Define default network variables when not provided in vault
      # TODO: register subnets in shared/networks before first deploy.
      set_fact:
        app_networks: "{{ skgit.networks | default([
          { 'name': 'cloud-public-dev', 'subnet': '172.16.202.0/24' },
          { 'name': 'skgit-dev', 'subnet': '172.16.229.0/24' }
        ]) }}"
      tags:
        - networks

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags:
        - networks

    - name: Create the {{ app }} directories (direct bind mount structure)
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "/var/data/{{ app }}-{{ env }}", owner: "root", group: "root", mode: "0755" }
        # === DIRECT BIND MOUNTS - NO NAMED VOLUMES ===
        - { path: "/var/data/{{ app }}-{{ env }}/data", owner: "1000", group: "1000", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/config", owner: "1000", group: "1000", mode: "0755" }
        - { path: "/var/data/logs/{{ app }}-{{ env }}", owner: "1000", group: "1000", mode: "0755" }
        - { path: "/var/data/runtime/{{ app }}-{{ env }}/postgres", owner: "999", group: "999", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/database-dump", owner: "root", group: "root", mode: "0755" }
        - { path: "/var/data/runtime/{{ app }}-{{ env }}/runner", owner: "1000", group: "1000", mode: "0755" }
        - { path: "/var/data/runtime/{{ app }}-{{ env }}/docker_certs", owner: "root", group: "root", mode: "0755" }
        - { path: "/var/data/runtime/{{ app }}-{{ env }}/dind-data", owner: "root", group: "root", mode: "0755" }
        - { path: "/var/data/runtime/{{ app }}-{{ env }}/runner-data", owner: "1000", group: "1000", mode: "0755" }
        - { path: "/var/data/runtime/{{ app }}-{{ env }}/sessions", owner: "1000", group: "1000", mode: "0755" }
        - { path: "/var/data/config/{{ app }}-{{ env }}", owner: "root", group: "root", mode: "0755" }

    - name: Process {{ app }} environment templates
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0640'
      loop:
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env" }
        - { src: "postgres.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/postgres.env" }
        - { src: "postgres-backup.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/postgres-backup.env" }
        - { src: "{{ app }}-runners.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/.env" }
        - { src: "{{ app }}-runners.yml.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}-runners.yml" }
        - { src: "runner-config.yml.j2", dest: "/var/data/config/{{ app }}-{{ env }}/runner-config.yml" }
      tags:
        - templates

    - name: Create {{ app }}.sh.env (always update for domain/cluster changes)
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.sh.env.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env"
        owner: root
        group: root
        mode: '0640'
      tags:
        - templates

    - name: Process {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - compose

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags:
        - compose

    - name: Create Forgejo app.ini configuration file
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/app.ini.j2"
        dest: "/var/data/{{ app }}-{{ env }}/config/app.ini"
        owner: "1000"
        group: "1000"
        mode: "0600"
      tags:
        - config

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags:
        - deploy-script

    - name: Create {{ app }} control script symlink
      file:
        src: /var/data/{{ app }}-{{ env }}/deploy
        dest: /var/data/deploy_{{ app }}-{{ env }}
        force: yes
        owner: root
        group: root
        mode: '0755'
        state: link
      tags:
        - deploy-script

    - name: Copy {{ app }} helper files
      copy:
        src: "{{ playbook_dir }}/src/{{ app }}/{{ item.src }}"
        dest: "/var/data/{{ app }}-{{ env }}/{{ item.dest | default(item.src) }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { src: "start-runners.sh", mode: "0755" }
        - { src: "stop-runners.sh", mode: "0755" }
      tags:
        - scripts

    - name: Check if Runner scripts exist
      stat:
        path: "{{ item }}"
      register: runner_scripts
      loop:
        - "/var/data/{{ app }}-{{ env }}/start-runners.sh"
        - "/var/data/{{ app }}-{{ env }}/stop-runners.sh"
      tags:
        - scripts

    - name: Make Runner scripts executable
      file:
        path: "{{ item.item }}"
        mode: '0755'
        owner: root
        group: root
      loop: "{{ runner_scripts.results }}"
      when: item.stat.exists
      tags:
        - scripts

    - name: Deploy {{ app }} stack
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        ./deploy
      register: deploy_output
      tags:
        - deploy

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags:
        - deploy

    - name: Announce the Forgejo first-install wait budget
      # Forgejo has a Docker healthcheck (start_period 300s), so Swarm reports
      # the task Running only once Forgejo answers. On a busy host that takes
      # minutes, so the budget is generous and tunable.
      debug:
        msg: >-
          Waiting up to {{ skgit.first_install_wait_seconds | default(1800) }}s
          (skgit.first_install_wait_seconds) for the Forgejo task to become
          Running, and again for its API before any admin bootstrap. A first
          install on a busy host can take 10 minutes or more; the retry
          countdown below is progress, not a hang (run with -vvv to see each
          task state).
      when: deploy_output.rc == 0
      tags:
        - post-deploy
        - admin

    - name: Wait for the swarm node running the Forgejo task
      # Polls until a task reports Running (healthy); fails the play if none
      # does within skgit.first_install_wait_seconds. Each attempt reports the
      # current task states (e.g. "Starting 4 minutes ago") on stderr. The
      # node is also where the admin bootstrap below runs (placement
      # constraints may put Forgejo on a worker).
      shell: |
        STATES=$(docker service ps "{{ app }}-{{ env }}_forgejo" --filter "desired-state=running" --format "{{ '{{.Node}} {{.CurrentState}}' }}")
        NODE=$(printf '%s\n' "$STATES" | awk '$2 == "Running" {print $1; exit}')
        if [ -z "$NODE" ]; then
          echo "{{ app }}-{{ env }}_forgejo has no Running task yet; current: $(printf '%s' "${STATES:-no task scheduled}" | tr '\n' ';')" >&2
          exit 1
        fi
        echo "$NODE"
      register: forgejo_node
      until: forgejo_node.rc == 0 and (forgejo_node.stdout | trim | length > 0)
      retries: "{{ ((skgit.first_install_wait_seconds | default(1800) | int) + 4) // 5 }}"
      delay: 5
      changed_when: false
      when: deploy_output.rc == 0
      tags:
        - post-deploy
        - admin

    - name: Fix Forgejo data permissions and start runners
      shell: |
        chown -R 1000:1000 /var/data/{{ app }}-{{ env }}/data || true
        chown -R 1000:1000 /var/data/{{ app }}-{{ env }}/config || true
        chmod -R 755 /var/data/{{ app }}-{{ env }}/data || true
        chmod -R 755 /var/data/{{ app }}-{{ env }}/config || true

        if [ -f /var/data/{{ app }}-{{ env }}/start-runners.sh ]; then
          echo "Starting runners..."
          /var/data/{{ app }}-{{ env }}/start-runners.sh
        fi
      environment:
        SKGIT_DIND_NODE: "{{ skgit.DIND_NODE | default('') }}"
      when: deploy_output.rc == 0
      ignore_errors: yes
      tags:
        - post-deploy

    - name: Wait for the Forgejo API before creating the admin user
      shell: |
        CID=$(docker ps -q -f "name={{ app }}-{{ env }}_forgejo." | head -n1)
        if [ -z "$CID" ]; then
          echo "no running {{ app }}-{{ env }}_forgejo container on this node yet" >&2
          exit 1
        fi
        docker exec "$CID" curl -sf http://localhost:3000/api/v1/version >/dev/null || { echo "Forgejo API not answering yet" >&2; exit 1; }
      delegate_to: "{{ forgejo_node.stdout | trim }}"
      register: forgejo_api
      until: forgejo_api.rc == 0
      retries: "{{ ((skgit.first_install_wait_seconds | default(1800) | int) + 9) // 10 }}"
      delay: 10
      changed_when: false
      when:
        - deploy_output.rc == 0
        - skgit.admin_enabled | default(false) | bool
        - skgit_admin_password | length > 0
        - skgit_admin_email | length > 0
      tags:
        - post-deploy
        - admin

    - name: Create admin user if credentials provided (opt-in via skgit.admin_enabled)
      # no_log because the task carries the password. It never fails itself
      # (failed_when: false) so the next task can fail with a message that
      # holds only this script's own, password-redacted output.
      shell: |
        CID=$(docker ps -q -f "name={{ app }}-{{ env }}_forgejo." | head -n1)
        if [ -z "$CID" ]; then
          echo "no running {{ app }}-{{ env }}_forgejo container found on this node"
          exit 1
        fi
        if ! USERS=$(docker exec "$CID" forgejo admin user list 2>&1); then
          echo "forgejo admin user list failed; cannot tell whether $ADMIN_USERNAME exists"
          exit 1
        fi
        if printf '%s\n' "$USERS" | awk -v u="$ADMIN_USERNAME" 'NR > 1 && $2 == u {found = 1} END {exit !found}'; then
          echo "Admin user $ADMIN_USERNAME already exists, skipping creation"
          exit 0
        fi
        if OUT=$(docker exec "$CID" forgejo admin user create \
            --admin \
            --username "$ADMIN_USERNAME" \
            --password "$ADMIN_PASSWORD" \
            --email "$ADMIN_EMAIL" \
            --must-change-password=false 2>&1); then
          echo "Admin user $ADMIN_USERNAME created"
          exit 0
        fi
        case "$OUT" in
          *"already exists"*)
            echo "Admin user $ADMIN_USERNAME already exists, skipping creation"
            exit 0 ;;
        esac
        OUT=${OUT//"$ADMIN_PASSWORD"/<redacted>}
        echo "forgejo admin user create failed: $(printf '%s' "$OUT" | tail -n 3 | tr '\n' ' ')"
        exit 1
      args:
        executable: /bin/bash
      environment:
        ADMIN_USERNAME: "{{ skgit_admin_username }}"
        ADMIN_PASSWORD: "{{ skgit_admin_password }}"
        ADMIN_EMAIL: "{{ skgit_admin_email }}"
      delegate_to: "{{ forgejo_node.stdout | trim }}"
      register: forgejo_admin
      failed_when: false
      changed_when: forgejo_admin.rc == 0 and ' created' in forgejo_admin.stdout
      when:
        - deploy_output.rc == 0
        - skgit.admin_enabled | default(false) | bool
        - skgit_admin_password | length > 0
        - skgit_admin_email | length > 0
      tags:
        - post-deploy
        - admin
      no_log: true  # Don't log password in output

    - name: Fail if the requested admin user could not be created
      fail:
        msg: >-
          skgit.admin_enabled is true but the Forgejo admin user
          {{ skgit_admin_username }} was not created:
          {{ forgejo_admin.stdout | default('no output') }}
      when:
        - deploy_output.rc == 0
        - skgit.admin_enabled | default(false) | bool
        - skgit_admin_password | length > 0
        - skgit_admin_email | length > 0
        - forgejo_admin.rc | default(1) != 0
      tags:
        - post-deploy
        - admin
