; Custom PHP timeout configuration for Nextcloud.
; Mounted into the Nextcloud container after php.ini, so this file uses a
; zz- prefix to sort and load last.

; Maximum execution time for scripts (seconds). 2 hours allows large file
; chunk assembly and MOVE operations to complete.
max_execution_time = 7200

; Maximum time allowed to parse input data (POST, GET, file uploads).
max_input_time = 7200

; Maximum time to wait for input, for long-running uploads.
default_socket_timeout = 3600
