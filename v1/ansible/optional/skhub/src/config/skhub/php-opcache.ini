; Custom PHP OPcache configuration for Nextcloud.
; Mounted into the Nextcloud container after opcache-recommended.ini, so
; this file uses a zz- prefix to sort and load last.

; Increase interned strings buffer to improve performance (default: 32).
opcache.interned_strings_buffer=64

opcache.enable=1
opcache.enable_cli=0

; Memory consumption is set via the PHP_OPCACHE_MEMORY_CONSUMPTION env var.
