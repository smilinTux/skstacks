---
# skrac: MeshCentral (upstream github.com/Ylianst/MeshCentral, Apache-2.0)
# behind skfenceha: one `server` (NeDB database, certificates and every
# agent connection in one data dir, exactly one replica) plus a `backup`
# sidecar that writes a tar.gz of that data dir on a schedule for skbackup
# to pick up. Sign-in is MeshCentral's own native OIDC against Authentik
# (AUTH_MODE: oidc) with local login kept for break-glass, or local-only
# (AUTH_MODE: local, the default). Agent and installer paths get their own
# Traefik router that never carries SSO_MIDDLEWARE. Opt-in: nothing renders
# unless this playbook runs. See README.md.
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
# Run on all hosts to ensure it executes even with -l limit
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skrac
    env: prod
    service_name: skrac
    service_type: optional
    # MeshCentral 1.2.6 (upstream release, 2026-09-24, multi-arch
    # amd64/arm64/arm/v7/arm/v6). The compose template writes the same
    # literal so v1/scripts/list_images.py sees the pin; test_skrac_render.py
    # keeps the two equal.
    skr_default_image: "ghcr.io/ylianst/meshcentral:1.2.6@sha256:09c5abfcf0758f2a7ab9b43fa8acb838b92bba1498c1447fc8c09bb1d296b73e"
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Resolve the skrac settings
      set_fact:
        skr_base_domain: "{{ skrac.DOMAIN | default(domain) if skrac.CLOUDFLARED | default(false) | bool else (skrac.CLUSTERNAME | default(cluster_name)) ~ '.' ~ (skrac.DOMAIN | default(domain)) }}"
        skr_image: "{{ skrac.MESHCENTRAL_IMAGE | default(skr_default_image, true) }}"
        skr_data_path: "{{ skrac.DATA_PATH | default('/var/data/' + app + '-' + env + '/data', true) }}"
        skr_files_path: "{{ skrac.FILES_PATH | default('/var/data/' + app + '-' + env + '/files', true) }}"
        skr_backup_path: "{{ skrac.BACKUP_PATH | default('/var/data/' + app + '-' + env + '/backup', true) }}"
        skr_data_node: "{{ skrac.DATA_NODE | default('', true) | string }}"
        skr_middlewares: "{{ skrac.TRAEFIK_MIDDLEWARES | default('default-no-crowdsec@file', true) }}"
        skr_sso_middleware: "{{ skrac.SSO_MIDDLEWARE | default('', true) | string }}"
        skr_tls_options: "{{ skrac.TLS_OPTIONS | default('intermediate@file', true) }}"
        skr_internal_port: "{{ skrac.INTERNAL_PORT | default(4430, true) | int }}"
        skr_auth_mode: "{{ skrac.AUTH_MODE | default('local', true) | lower }}"
        skr_router: "skrac{{ '' if env == 'prod' else '-' + env }}"
      tags: [config]

    - name: Resolve the agent-router middlewares (never includes SSO_MIDDLEWARE)
      # Defaults to the SAME chain as the UI router (CrowdSec is fine on
      # agent endpoints, see README); override independently with
      # AGENT_TRAEFIK_MIDDLEWARES if CrowdSec ever proves to break an
      # agent's websocket upgrade in practice.
      set_fact:
        skr_agent_middlewares: "{{ skrac.AGENT_TRAEFIK_MIDDLEWARES | default(skr_middlewares, true) }}"
      tags: [config]

    - name: Resolve the public host and the trusted-proxy range
      set_fact:
        skr_host: "{{ skrac.HOSTNAME | default('skrac' + ('' if env == 'prod' else '-' + env) + '.' + skr_base_domain, true) }}"
        skr_trusted_proxy: "{{ skrac.TRUSTED_PROXY_CIDR | default({'prod': '172.16.200.0/24', 'staging': '172.16.201.0/24', 'dev': '172.16.202.0/24'}[env], true) }}"
      tags: [config]

    - name: Fail loudly when AUTH_MODE is oidc but Authentik is not fully configured
      # OIDC_CLIENT_SECRET is the one secret this role requires in that
      # mode: MeshCentral generates everything else itself (session keys,
      # the agent root certificate) straight into the data dir, which the
      # backup sidecar already covers. The message never prints the value.
      assert:
        that:
          - skrac is defined and skrac is mapping
          - skr_auth_mode in ['local', 'oidc']
          - skr_auth_mode != 'oidc' or (skrac.OIDC_ISSUER | default('', true) | length > 0)
          - skr_auth_mode != 'oidc' or (skrac.OIDC_CLIENT_ID | default('', true) | length > 0)
          - skr_auth_mode != 'oidc' or (skrac.OIDC_CLIENT_SECRET | default('', true) | string | length >= 16)
        fail_msg: >-
          ERROR: skrac.AUTH_MODE must be 'local' or 'oidc'; in 'oidc' mode
          skrac.OIDC_ISSUER, OIDC_CLIENT_ID and OIDC_CLIENT_SECRET (at least
          16 characters) are all required in the skrac vault block. See
          README.md "Sign-in, SSO and the first admin".
        quiet: true
      tags: [config]

    - name: Validate the image pin and the public host
      assert:
        that:
          - "'@sha256:' in skr_image"
          - skr_host is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
        fail_msg: >-
          ERROR: skrac.MESHCENTRAL_IMAGE must be pinned by digest (@sha256:)
          and HOSTNAME (or CLUSTERNAME/DOMAIN) must be a plain host name.
          MESHCENTRAL_IMAGE is {{ skr_image }}, host is {{ skr_host }}.
        quiet: true
      tags: [config]

    - name: Fail closed on a local data path without a pinned data node
      # A path outside /var/data is local disk on one node: without
      # DATA_NODE swarm may reschedule the server elsewhere onto an empty
      # directory (every device, user and the agent root certificate gone;
      # every already-enrolled agent then refuses the "new" server). Same
      # rule as sksso/skhub/skgym.
      assert:
        that:
          - (skr_data_node | length > 0) or (skr_data_path.startswith('/var/data/') and skr_files_path.startswith('/var/data/') and skr_backup_path.startswith('/var/data/'))
        fail_msg: >-
          skrac.DATA_PATH / FILES_PATH / BACKUP_PATH point at local disk
          ({{ skr_data_path }}, {{ skr_files_path }}, {{ skr_backup_path }})
          but skrac.DATA_NODE is empty. Set DATA_NODE to the node holding
          the data.
        quiet: true
      tags: [config]

    - name: Define network variables from vault (idempotent network creation)
      # Subnets: skrac-prod 172.16.238.0/24, -staging .239, -dev .240
      # (reserved for skrac); cloud-public-<env> is shared. Override with
      # the flat per-env skrac_<env>_networks (catalog naming convention).
      set_fact:
        app_networks: "{{ skrac_prod_networks | default([
          { 'name': 'skrac-prod', 'subnet': '172.16.238.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'cloud-public-prod', 'subnet': '172.16.200.0/24', 'driver': 'overlay', 'attachable': true }
        ]) }}"
      tags: [networks, config]

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    - name: Create the {{ app }} directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /var/data/{{ app }}-{{ env }}
        - /var/data/{{ app }}-{{ env }}/bin
        - /var/data/config/{{ app }}-{{ env }}

    - name: Create the {{ app }} data/files/backup directories on shared storage (not recursive, root only)
      # The data dir holds the agent root certificate, every device record
      # and (in oidc mode) the config.json carrying the OIDC client secret.
      # 0700 keeps other accounts on the NFS clients out of it.
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - "{{ skr_data_path }}"
        - "{{ skr_files_path }}"
        - "{{ skr_backup_path }}"
      when: item.startswith('/var/data/')

    - name: Create the {{ app }} local data/files/backup directories on the data node (not recursive, root only)
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - "{{ skr_data_path }}"
        - "{{ skr_files_path }}"
        - "{{ skr_backup_path }}"
      when: not item.startswith('/var/data/')
      # Ansible templates delegate_to before it evaluates when, so it must
      # render with DATA_NODE unset too (the guard above requires DATA_NODE
      # whenever this task actually runs).
      delegate_to: "{{ skrac.DATA_NODE | default(inventory_hostname, true) }}"

    - name: Provision the Authentik OAuth2 provider and application
      # Opt-in and off by default (AUTHENTIK_PROVISION: true); the primary,
      # supported path is the manual Authentik setup in README.md "Sign-in,
      # SSO and the first admin". Needs sksso's automation token.
      include_tasks: ../../optional/skrac/tasks/authentik.yml
      when: skr_auth_mode == 'oidc' and (skrac.AUTHENTIK_PROVISION | default(false) | bool)
      tags: [config, authentik]

    - name: Write the MeshCentral config (root only, may carry the OIDC client secret)
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/config.json.j2"
        dest: "{{ skr_data_path }}/config.json"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      register: skrac_config
      delegate_to: "{{ skrac.DATA_NODE | default(inventory_hostname, true) if not skr_data_path.startswith('/var/data/') else inventory_hostname }}"
      tags: [templates, config]

    - name: Install the backup script
      # Copied verbatim (sh, run by the backup sidecar): no Jinja in it.
      copy:
        src: "{{ playbook_dir }}/src/{{ app }}/skrac-backup"
        dest: "/var/data/{{ app }}-{{ env }}/bin/skrac-backup"
        owner: root
        group: root
        mode: '0755'
      register: skrac_backup_script
      tags: [templates]

    - name: Process {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags: [compose]

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags: [compose]

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags: [deploy-script]

    - name: Create {{ app }} control script symlink
      file:
        src: "/var/data/{{ app }}-{{ env }}/deploy"
        dest: "/var/data/deploy_{{ app }}-{{ env }}"
        force: yes
        owner: root
        group: root
        state: link
      tags: [deploy-script]

    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags: [networks]

    - name: Deploy {{ app }} stack
      # The config file and the backup script are bind mounts: a changed
      # file alone does not change the service spec, so the deploy script
      # restarts the services that read them when the play changed one.
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        RESTART_SERVER={{ '1' if (skrac_config is changed) else '0' }} RESTART_BACKUP={{ '1' if skrac_backup_script is changed else '0' }} ./deploy
      register: deploy_output
      tags: [deploy]

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags: [deploy]
