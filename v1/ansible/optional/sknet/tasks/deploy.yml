---
# Deploys the stack: runs the rendered deploy script on the selected manager.
# The overlay networks exist by now (shared/tasks/create_networks.yml, run by
# the play before this file).
- name: Deploy sknet stack
  # The configs and the stack file are read by `docker stack deploy`, and each
  # config is named after its content, so a changed setting rolls the affected
  # services by itself; no forced restart is needed.
  shell: |
    cd /var/data/{{ app }}-{{ env }}
    ./deploy
  register: deploy_output
  tags: [deploy]

- name: Show deploy output
  debug: var=deploy_output.stdout_lines
  tags: [deploy]
