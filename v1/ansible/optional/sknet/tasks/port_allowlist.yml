---
# sknet flow port allowlist: one iptables chain SKNET-<ENV> on the data node,
# from one template (src/config/sknet/firewall/sknet-fw.sh.j2), installed as
# /usr/local/sbin/sknet-<env>-fw and applied by the oneshot unit
# sknet-<env>-fw.service (so it comes back after a reboot or a Docker restart).
# The inlet's UDP ports are published in host mode, so without this any host
# that can reach the node could send flows into the collector.
#   sknet_fw_node   host the rules go on (the play passes DATA_NODE). Never
#                   set_fact it here: a fact would outlive the include.
#   sknet_fw_state  absent removes the unit, script, hooks and chain (default present)
# Needs sknet_flow_sources and the ports (tasks/validate.yml). The sources are
# IPv4 literals, already checked there: this role refuses names, it does not
# resolve them. Parking leaves the rules in place. IPv4 only.
- name: Write the flow port allowlist script
  template:
    src: "{{ playbook_dir }}/src/config/sknet/firewall/sknet-fw.sh.j2"
    dest: "/usr/local/sbin/sknet-{{ env }}-fw"
    owner: root
    group: root
    mode: "0750"
  register: sknet_fw_script
  delegate_to: "{{ sknet_fw_node }}"
  become: true
  when: sknet_fw_state | default('present') != 'absent'

- name: Write the flow port allowlist unit
  template:
    src: "{{ playbook_dir }}/src/config/sknet/firewall/sknet-fw.service.j2"
    dest: "/etc/systemd/system/sknet-{{ env }}-fw.service"
    owner: root
    group: root
    mode: "0644"
  register: sknet_fw_unit
  delegate_to: "{{ sknet_fw_node }}"
  become: true
  when: sknet_fw_state | default('present') != 'absent'

- name: Enable and run the flow port allowlist
  systemd:
    name: "sknet-{{ env }}-fw.service"
    state: started
    enabled: true
    daemon_reload: true
  delegate_to: "{{ sknet_fw_node }}"
  become: true
  when: sknet_fw_state | default('present') != 'absent'

- name: Re-run the flow port allowlist when its script or unit changed
  # A oneshot with RemainAfterExit is "active" after the first run, so start alone is a no-op.
  systemd:
    name: "sknet-{{ env }}-fw.service"
    state: restarted
  delegate_to: "{{ sknet_fw_node }}"
  become: true
  when: sknet_fw_state | default('present') != 'absent' and (sknet_fw_script.changed or sknet_fw_unit.changed)

# --- state: absent: the unit, script, hooks and chain go -------------------------------

- name: Stop and disable the flow port allowlist unit when absent
  systemd:
    name: "sknet-{{ env }}-fw.service"
    state: stopped
    enabled: false
  register: sknet_fw_absent_stop
  failed_when: sknet_fw_absent_stop.failed and 'Could not find' not in (sknet_fw_absent_stop.msg | default(''))
  delegate_to: "{{ sknet_fw_node }}"
  become: true
  when: sknet_fw_state | default('present') == 'absent'

- name: Remove the flow port allowlist unit and script when absent
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/systemd/system/sknet-{{ env }}-fw.service"
    - "/usr/local/sbin/sknet-{{ env }}-fw"
  delegate_to: "{{ sknet_fw_node }}"
  become: true
  when: sknet_fw_state | default('present') == 'absent'

- name: Remove the flow port allowlist hooks and chain when absent
  shell: |
    set -eu
    chain='SKNET-{{ env | upper }}'
    for parent in INPUT DOCKER-USER; do
      while iptables -w -C "$parent" -j "$chain" 2>/dev/null; do
        iptables -w -D "$parent" -j "$chain"
      done
    done
    iptables -w -F "$chain" 2>/dev/null || true
    iptables -w -X "$chain" 2>/dev/null || true
    systemctl daemon-reload
  args:
    executable: /bin/bash
  delegate_to: "{{ sknet_fw_node }}"
  become: true
  when: sknet_fw_state | default('present') == 'absent'
