---
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
# Run on all hosts to ensure it executes even with -l limit
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skform
    env: staging
    service_name: skform
    service_type: optional
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Define network variables from vault (idempotent network creation)
      # Networks are created idempotently by:
      #   1. create_networks.yml shared task (Ansible pre-deployment)
      #   2. skform.yml.j2 compose file (external: true) once created above
      # skform-staging: 172.16.140.0/24
      set_fact:
        app_networks: "{{ skform.networks | default([
          { 'name': 'skform-' + env, 'subnet': '172.16.140.0/24', 'driver': 'overlay', 'attachable': true }
        ]) }}"
      tags:
        - networks
        - config

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    - name: Create the {{ app }} directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: 0755
      loop:
        - /var/data/{{ app }}-{{ env }}
        - /var/data/{{ app }}-{{ env }}/state
        - /var/data/{{ app }}-{{ env }}/workspaces
        - /var/data/{{ app }}-{{ env }}/plugins
        - /var/data/{{ app }}-{{ env }}/scripts
        - /var/data/config/{{ app }}-{{ env }}

    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags:
        - networks

    - name: Process {{ app }} environment templates
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0640'
      loop:
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env" }
        - { src: "{{ app }}.sh.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env" }
        - { src: "tofu.hcl.j2", dest: "/var/data/config/{{ app }}-{{ env }}/tofu.hcl" }
      tags:
        - templates

    - name: Process {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - compose

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags:
        - compose

    - name: Process helper scripts templates
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/helper-scripts/{{ item.src }}"
        dest: "/var/data/{{ app }}-{{ env }}/scripts/{{ item.dest }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - { src: "tofu-init.j2", dest: "tofu-init" }
        - { src: "tofu-plan.j2", dest: "tofu-plan" }
        - { src: "tofu-apply.j2", dest: "tofu-apply" }
        - { src: "tofu-validate.j2", dest: "tofu-validate" }
      tags:
        - scripts

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags:
        - deploy-script

    - name: Create {{ app }} control script symlink
      file:
        src: "/var/data/{{ app }}-{{ env }}/deploy"
        dest: "/var/data/deploy_{{ app }}-{{ env }}"
        force: yes
        owner: root
        group: root
        mode: '0755'
        state: link
      tags:
        - deploy-script

    - name: Deploy {{ app }} stack
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        ./deploy
      register: deploy_output
      tags:
        - deploy

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags:
        - deploy
