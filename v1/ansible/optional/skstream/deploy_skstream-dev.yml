---
# skstream (dev): Plex (+ optional Kometa) as a swarm stack, plus DUMB
# (zurg + rclone FUSE mount + cli_debrid) as a host-level systemd unit on the
# media node skstream.MEDIA_NODE. See README.md for why DUMB is host-level.
# The stack deploy runs on ONE selected manager; the host-level tasks are
# delegated to the media node (it must be an inventory host; delegate_to
# reaches it even when the run is limited to the managers).
- import_playbook: ../../shared/meta/skstack-header.yml

- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

- hosts: selected_manager_group
  become: true
  vars:
    app: skstream
    env: dev
    service_name: skstream
    service_type: optional
    skstream_sfx: "{{ '' if env == 'prod' else '-' + env }}"
    skstream_local_root: "{{ skstream.LOCAL_ROOT | default('/var/lib/skstream' + skstream_sfx) }}"
    skstream_uid: "{{ skstream.PUID | default(1000) }}"
    skstream_gid: "{{ skstream.PGID | default(1000) }}"
    skstream_plex_host: "{{ (skstream.PLEX_MODE | default('swarm') | string | lower) == 'host' }}"
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml
    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined
    - name: Define network variables from vault (idempotent network creation)
      # skstream-dev: 172.16.160.0/24
      # cloud-public-dev: 172.16.202.0/24
      set_fact:
        app_networks: "{{ skstream.networks | default([
          { 'name': 'skstream-dev', 'subnet': '172.16.160.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'cloud-public-dev', 'subnet': '172.16.202.0/24', 'driver': 'overlay', 'attachable': true }
        ]) }}"
      tags: [networks, config]
  tasks:
    - name: Fail closed if required skstream vars are empty or unset
      assert:
        that:
          - (skstream.RD_API_KEY | default('')) | length > 0
          - (skstream.PLEX_TOKEN | default('')) | length > 0
          - (skstream.MEDIA_NODE | default('')) | length > 0
          - not (skstream.PLEX_TOKEN_IS_SERVER_TOKEN | default(false) | bool)
          - (skstream.PLEX_ENDPOINT_MODE | default('dnsrr')) in ['vip', 'dnsrr']
        fail_msg: >-
          skstream.RD_API_KEY, skstream.PLEX_TOKEN and skstream.MEDIA_NODE are
          required. MEDIA_NODE is the inventory host (and swarm node name) that
          runs the DUMB FUSE mount and Plex. PLEX_TOKEN must be a dedicated
          account token (plex.tv/link PIN flow), never the server
          PlexOnlineToken; PLEX_TOKEN_IS_SERVER_TOKEN true stops the play.
          PLEX_ENDPOINT_MODE must be vip or dnsrr (default dnsrr).
      tags: [config, secrets]

    - name: Validate skstream.DUMB_EXTRA_BINDS (absolute paths, no spaces or colons)
      assert:
        that:
          - item is mapping
          - (item.source | default('')) is match('^/[^\\s:]+$')
          - (item.target | default('')) is match('^/[^\\s:]+$')
        fail_msg: >-
          Each skstream.DUMB_EXTRA_BINDS entry must be a mapping with absolute
          source and target paths without spaces or colons (they become a
          docker run -v source:target[:ro] argument), got {{ item }}.
      loop: "{{ skstream.DUMB_EXTRA_BINDS | default([]) }}"
      tags: [config]

    - name: Refuse a plex_watchlist.py bind over a pinned cli_debrid
      # The managed Plex Home fix (cli_debrid de5c411f) ships in the pinned
      # release; a vendored copy of the module from an older release would
      # shadow the new code. Unpin (CLI_DEBRID_VERSION: '') to keep a bind.
      assert:
        that:
          - >-
            (skstream.CLI_DEBRID_VERSION | default('v0.7.81') | string | length == 0)
            or ('/cli_debrid/content_checkers/plex_watchlist.py' not in
            (skstream.DUMB_EXTRA_BINDS | default([]) | select('mapping') | selectattr('target', 'defined') | map(attribute='target') | list))
        fail_msg: >-
          skstream.DUMB_EXTRA_BINDS binds /cli_debrid/content_checkers/plex_watchlist.py
          while CLI_DEBRID_VERSION pins cli_debrid to
          {{ skstream.CLI_DEBRID_VERSION | default('v0.7.81') }}, which already has the
          managed Plex Home fix. Remove that bind (or set CLI_DEBRID_VERSION: '').
      tags: [config]

    - name: Validate skstream.PLEX_OTHER_WATCHLISTS (username and token on every entry)
      assert:
        that:
          - item is mapping
          - (item.username | default('') | string | length) > 0
          - (item.token | default('') | string | length) > 0
        fail_msg: >-
          Each skstream.PLEX_OTHER_WATCHLISTS entry needs a username (the plex.tv
          username, or the profile title for a managed Plex Home user) and that
          user's own plex.tv token.
        quiet: true
      loop: "{{ skstream.PLEX_OTHER_WATCHLISTS | default([]) }}"
      loop_control: { label: "{{ item.username | default('?') if item is mapping else '?' }}" }
      tags: [config]

    - name: Validate the Plex mode (host needs a LAN bind; hardware transcoding needs host)
      assert:
        that:
          - (skstream.PLEX_MODE | default('swarm') | string | lower) in ['swarm', 'host']
          - skstream_plex_host | bool or not (skstream.PLEX_HW_TRANSCODE | default(false) | bool)
          - not (skstream_plex_host | bool) or (skstream.PLEX_LAN_BIND_ADDRESS | default('') | string) is match('^[0-9.]+$')
        fail_msg: >-
          skstream.PLEX_MODE must be swarm (default) or host. PLEX_HW_TRANSCODE
          needs PLEX_MODE host (a swarm service cannot get /dev/dri). PLEX_MODE
          host needs PLEX_LAN_BIND_ADDRESS, the media node's LAN IPv4 that Plex
          publishes 32400 on and the Traefik file route points at.
      tags: [config]

    - name: Validate skstream.PLEX_EXTRA_BINDS in host mode (absolute paths, no spaces or colons)
      assert:
        that:
          - item is mapping
          - (item.source | default('')) is match('^/[^\\s:]+$')
          - (item.target | default('')) is match('^/[^\\s:]+$')
        fail_msg: >-
          With PLEX_MODE host each skstream.PLEX_EXTRA_BINDS entry becomes a
          docker run -v source:target:ro argument: absolute paths without spaces
          or colons, got {{ item }}.
      loop: "{{ skstream.PLEX_EXTRA_BINDS | default([]) if skstream_plex_host | bool else [] }}"
      tags: [config]

    - name: Create {{ app }} directories on the shared data mount (not recursive)
      file: { path: "{{ item.path }}", state: directory, owner: "{{ item.owner }}", group: "{{ item.owner }}", mode: "{{ item.mode }}" }
      loop:
        - { path: "/var/data/{{ app }}-{{ env }}", owner: "0", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/plex", owner: "0", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/plex/config", owner: "{{ skstream_uid }}", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/plex/transcode", owner: "{{ skstream_uid }}", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/zurg", owner: "0", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/zurg/mnt", owner: "{{ skstream_uid }}", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/kometa", owner: "0", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/kometa/config", owner: "{{ skstream_uid }}", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/dumb", owner: "0", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/dumb/config", owner: "{{ skstream_uid }}", mode: "0750" }
        - { path: "/var/data/config/{{ app }}-{{ env }}", owner: "0", mode: "0755" }
      tags: [config]

    - name: Process {{ app }} env templates
      template: { src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}", dest: "{{ item.dest }}", owner: root, group: root, mode: "{{ item.mode }}" }
      loop:
        - { src: "{{ app }}.sh.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env", mode: "0640" }
        - { src: "plex.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/plex.env", mode: "0600" }
        - { src: "kometa.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/kometa.env", mode: "0600" }
      register: skstream_env_files
      tags: [templates]

    - name: Process {{ app }} compose/stack template
      template: { src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml", owner: root, group: root, mode: '0644' }
      tags: [compose]
    - name: docker-compose.yml symlink
      file: { src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml", dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml", state: link, force: yes }
      tags: [compose]
    - name: Process deploy script template
      template: { src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2", dest: "/var/data/{{ app }}-{{ env }}/deploy", owner: root, group: root, mode: '0755' }
      tags: [deploy-script]
    - name: control script symlink
      file: { src: "/var/data/{{ app }}-{{ env }}/deploy", dest: "/var/data/deploy_{{ app }}-{{ env }}", state: link, force: yes }
      tags: [deploy-script]

    - name: Seed DUMB config (only if absent; DUMB owns it after first start)
      # force follows skstream.FORCE_SEED (default false): runtime state such as
      # tokens refreshed or settings changed in the DUMB UI is never clobbered.
      template: { src: "{{ playbook_dir }}/src/config/{{ app }}/dumb_config.json.j2", dest: "/var/data/{{ app }}-{{ env }}/dumb/config/dumb_config.json", owner: "{{ skstream_uid }}", group: "{{ skstream_gid }}", mode: "0600", force: "{{ skstream.FORCE_SEED | default(false) | bool }}" }
      tags: [templates, seed]

    - name: Label the media node for Plex placement
      shell: "docker node update --label-add skstream-media=true {{ skstream.MEDIA_NODE | quote }}"
      changed_when: false
      tags: [placement]

    - name: Ensure overlay networks exist
      include_tasks: ../../shared/tasks/create_networks.yml
      tags: [networks]

    - name: Create local state directories on the media node (not recursive)
      # SQLite (Plex DB, cli_debrid, DUMB) must not live on NFS.
      file: { path: "{{ item }}", state: directory, owner: "{{ skstream_uid }}", group: "{{ skstream_gid }}", mode: "0750" }
      loop:
        - "{{ skstream_local_root }}"
        - "{{ skstream_local_root }}/plex-db"
        - "{{ skstream_local_root }}/dumb-data"
        - "{{ skstream_local_root }}/dumb-data/cli_debrid"
        - "{{ skstream_local_root }}/dumb-data/cli_debrid/config"
        - "{{ skstream_local_root }}/dumb-data/zurg_RD"
        - "{{ skstream_local_root }}/dumb-log"
        - "{{ skstream_local_root }}/rclone-cache"
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host]

    - name: Seed cli_debrid config on the media node (only if absent)
      template: { src: "{{ playbook_dir }}/src/config/{{ app }}/cli_debrid_config.json.j2", dest: "{{ skstream_local_root }}/dumb-data/cli_debrid/config/config.json", owner: "{{ skstream_uid }}", group: "{{ skstream_gid }}", mode: "0600", force: "{{ skstream.FORCE_SEED | default(false) | bool }}" }
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host, seed]

    - name: Install the zurg Plex partial-scan hook on the media node
      template: { src: "{{ playbook_dir }}/src/config/{{ app }}/plex_update.sh.j2", dest: "{{ skstream_local_root }}/dumb-data/zurg_RD/plex_update.sh", owner: "{{ skstream_uid }}", group: "{{ skstream_gid }}", mode: "0750" }
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host]

    - name: Check whether zurg has written its config yet
      stat: { path: "{{ skstream_local_root }}/dumb-data/zurg_RD/config.yml" }
      register: skstream_zurg_cfg
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host]

    - name: Point zurg on_library_update at the hook (skstream-dumb.service reads it on restart)
      lineinfile: { path: "{{ skstream_local_root }}/dumb-data/zurg_RD/config.yml", regexp: '^#?\s*on_library_update:', line: 'on_library_update: sh plex_update.sh "$@"' }
      when: skstream_zurg_cfg.stat.exists | default(false)
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host]

    - name: Install the swarm-wait helper on the media node
      copy: { src: "{{ playbook_dir }}/src/{{ app }}/sk-wait-swarm-net", dest: /usr/local/sbin/sk-wait-swarm-net, owner: root, group: root, mode: '0755' }
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host]

    - name: Install skstream-dumb.service on the media node
      template: { src: "{{ playbook_dir }}/src/config/{{ app }}/skstream-dumb.service.j2", dest: "/etc/systemd/system/skstream-dumb{{ skstream_sfx }}.service", owner: root, group: root, mode: '0644' }
      register: skstream_unit
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host]

    - name: Get the owner's Plex friends-watchlist RSS feed URL (needs Plex Pass)
      uri:
        url: https://discover.provider.plex.tv/rss
        method: POST
        headers: { X-Plex-Token: "{{ skstream.PLEX_TOKEN }}", X-Plex-Client-Identifier: skstacks-skstream, Accept: application/json }
        body_format: json
        body: { feedType: friendsWatchlist }
        status_code: [200, 201]
      register: skstream_friends_rss
      no_log: true
      when: skstream.PLEX_FRIENDS_WATCHLIST | default(false) | bool
      tags: [host, watchlists]

    - name: Install skstream-converge on the media node
      copy: { src: "{{ playbook_dir }}/src/{{ app }}/skstream-converge", dest: /usr/local/sbin/skstream-converge, owner: root, group: root, mode: '0755' }
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host, watchlists]

    - name: Converge the cli_debrid pin and Plex watchlist sources (upsert only)
      # Edits only keys skstream owns; UI changes and other sources survive.
      # The spec carries tokens, so it goes on stdin and the task is no_log.
      command:
        argv:
          - python3
          - /usr/local/sbin/skstream-converge
          - --dumb-config
          - "/var/data/{{ app }}-{{ env }}/dumb/config/dumb_config.json"
          - --cli-config
          - "{{ skstream_local_root }}/dumb-data/cli_debrid/config/config.json"
        stdin: >-
          {{ {
            'cli_debrid_version': skstream.CLI_DEBRID_VERSION | default('v0.7.81') | string,
            'other_watchlists': skstream.PLEX_OTHER_WATCHLISTS | default([]),
            'friends_rss_url': (((skstream_friends_rss.json | default({})).RSSInfo | default([{}]))[0].url | default('')
                                if (skstream.PLEX_FRIENDS_WATCHLIST | default(false) | bool) else ''),
            'versions': ['1080p'],
            'filter_out': skstream.CLI_DEBRID_FILTER_OUT | default(None),
            'preferred_filter_out': skstream.CLI_DEBRID_PREFERRED_FILTER_OUT | default(None),
            'foreign_language_penalty': skstream.CLI_DEBRID_FOREIGN_LANGUAGE_PENALTY | default(None),
            'minimum_scrape_score': skstream.CLI_DEBRID_MINIMUM_SCRAPE_SCORE | default(None),
            'reverse_parser_default_version': skstream.CLI_DEBRID_REVERSE_PARSER_DEFAULT_VERSION | default(None),
            'cutoff_date': skstream.CUTOFF_DATE | default('') | string,
            'check_minutes': skstream.WATCHLIST_CHECK_MINUTES | default(5) | int
          } | to_json }}
      register: skstream_converge
      changed_when: (skstream_converge.stdout | from_json).values() | select | list | length > 0
      no_log: true
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host, watchlists]

    - name: Show what the converge changed (booleans only)
      debug: { msg: "{{ skstream_converge.stdout }}" }
      tags: [host, watchlists]

    - name: Stop host-level Plex before the stack deploy when PLEX_MODE is swarm
      # One Plex per database: the swarm task must not start beside the unit.
      systemd: { name: "skstream-plex{{ skstream_sfx }}.service", state: stopped, enabled: false }
      failed_when: false
      when: not (skstream_plex_host | bool)
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host, deploy]

    - name: Remove the Plex Traefik file route when PLEX_MODE is swarm (the swarm labels route it)
      file: { path: "{{ skstream.TRAEFIK_DYNAMIC_DIR }}/skstream{{ skstream_sfx }}.yml", state: absent }
      when:
        - not (skstream_plex_host | bool)
        - (skstream.TRAEFIK_DYNAMIC_DIR | default('') | string) | length > 0
      tags: [deploy]

    - name: Find the render group of /dev/dri on the media node (hardware transcoding)
      stat: { path: /dev/dri/renderD128 }
      register: skstream_render_node
      when: skstream_plex_host | bool and (skstream.PLEX_HW_TRANSCODE | default(false) | bool)
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host]

    - name: Warn when hardware transcoding is on but the media node has no render node
      debug:
        msg: >-
          PLEX_HW_TRANSCODE is true but /dev/dri/renderD128 does not exist on
          {{ skstream.MEDIA_NODE }}; Plex starts and transcodes in software.
      when:
        - skstream_plex_host | bool and (skstream.PLEX_HW_TRANSCODE | default(false) | bool)
        - not (skstream_render_node.stat.exists | default(false))
      tags: [host]

    - name: Install skstream-plex.service on the media node (PLEX_MODE host)
      template: { src: "{{ playbook_dir }}/src/config/{{ app }}/skstream-plex.service.j2", dest: "/etc/systemd/system/skstream-plex{{ skstream_sfx }}.service", owner: root, group: root, mode: '0644' }
      vars:
        skstream_render_gid: "{{ skstream_render_node.stat.gid | default('') if (skstream_render_node.stat.exists | default(false)) else '' }}"
      register: skstream_plex_unit
      when: skstream_plex_host | bool
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host]

    - name: Install the Plex Traefik file route (PLEX_MODE host)
      template: { src: "{{ playbook_dir }}/src/config/{{ app }}/skstream-traefik.yml.j2", dest: "{{ skstream.TRAEFIK_DYNAMIC_DIR }}/skstream{{ skstream_sfx }}.yml", owner: root, group: root, mode: "0644" }
      when:
        - skstream_plex_host | bool
        - (skstream.TRAEFIK_DYNAMIC_DIR | default('') | string) | length > 0
      tags: [deploy]

    - name: Pre-pull the stack images (a registry refusal must not take a running service down)
      include_tasks:
        file: ../../shared/tasks/prepull_images.yml
        apply:
          tags:
            - deploy
            - prepull
      tags:
        - deploy
        - prepull

    - name: Deploy {{ app }} stack
      shell: "cd /var/data/{{ app }}-{{ env }} && ./deploy"
      register: deploy_output
      tags: [deploy]
    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags: [deploy]

    - name: Enable and start skstream-dumb.service (restart when the unit or the cli_debrid pin changed)
      # DUMB installs the pinned cli_debrid release when it starts.
      systemd:
        name: "skstream-dumb{{ skstream_sfx }}.service"
        enabled: true
        daemon_reload: true
        state: "{{ 'restarted' if (skstream_unit.changed | default(false)) or ((skstream_converge.stdout | default('{}') | from_json).dumb_changed | default(false)) else 'started' }}"
      register: skstream_dumb_start
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host, deploy]

    - name: Enable and start skstream-plex.service (PLEX_MODE host; restart when the unit or env changed)
      # After the stack deploy, which removed any swarm Plex; the unit also
      # waits for a swarm Plex task to be gone before it starts.
      systemd:
        name: "skstream-plex{{ skstream_sfx }}.service"
        enabled: true
        daemon_reload: true
        state: "{{ 'restarted' if (skstream_plex_unit.changed | default(false)) or (skstream_env_files.changed | default(false)) else 'started' }}"
      when: skstream_plex_host | bool
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host, deploy]

    - name: Restart only cli_debrid when only its sources changed (the rclone mount stays up)
      command:
        argv: [docker, exec, "skstream-dumb{{ skstream_sfx }}", curl, -fsS, -X, POST, "http://127.0.0.1:8000/process/restart-service",
               -H, "Content-Type: application/json", -d, '{"process_name": "CLI Debrid"}']
      when:
        - (skstream_converge.stdout | default('{}') | from_json).cli_changed | default(false)
        - not (skstream_dumb_start.changed | default(false))
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host, deploy]

    - name: Install the skstream audio-language guard on the media node
      # The guard runs inside skstream-dumb (python3, the plex hostname, the
      # cli_debrid files); the host wrapper hands it the Plex owner token on stdin.
      copy: { src: "{{ playbook_dir }}/src/{{ app }}/{{ item.src }}", dest: "{{ item.dest }}", owner: "{{ item.owner }}", group: "{{ item.group }}", mode: '0755' }
      loop:
        - { src: skstream-langguard, dest: "{{ skstream_local_root }}/dumb-data/skstream-langguard", owner: "{{ skstream_uid }}", group: "{{ skstream_gid }}" }
        - { src: skstream-langguard-run, dest: /usr/local/sbin/skstream-langguard-run, owner: root, group: root }
      when: skstream.LANGGUARD_ENABLED | default(true) | bool
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host, langguard]

    - name: Install the skstream-langguard service and timer
      template: { src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item }}.j2", dest: "/etc/systemd/system/{{ item | replace('skstream-langguard', 'skstream-langguard' + skstream_sfx) }}", owner: root, group: root, mode: '0644' }
      loop: [skstream-langguard.service, skstream-langguard.timer]
      when: skstream.LANGGUARD_ENABLED | default(true) | bool
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host, langguard]

    - name: Enable the skstream-langguard timer (or stop it when LANGGUARD_ENABLED is false)
      systemd:
        name: "skstream-langguard{{ skstream_sfx }}.timer"
        enabled: "{{ skstream.LANGGUARD_ENABLED | default(true) | bool }}"
        state: "{{ 'started' if (skstream.LANGGUARD_ENABLED | default(true) | bool) else 'stopped' }}"
        daemon_reload: true
      register: skstream_langguard_timer
      # Disabling on a node that never had the timer is fine; enabling must work.
      failed_when: (skstream_langguard_timer.failed | default(false)) and (skstream.LANGGUARD_ENABLED | default(true) | bool)
      delegate_to: "{{ skstream.MEDIA_NODE }}"
      tags: [host, langguard]

    - name: Create or update the skstream portal tile in Authentik
      # On by default (AUTHENTIK_TILE: true); opt out per instance with
      # AUTHENTIK_TILE: false. skstream sits behind the cluster's domain-wide
      # Traefik ForwardAuth catch-all already; this just gives it a
      # bookmark tile on the Authentik portal, bound to a group, with no
      # provider. See shared/tasks/authentik_portal_tile.yml.
      include_tasks: ../../shared/tasks/authentik_portal_tile.yml
      vars:
        portal_tile:
          enabled: "{{ skstream.AUTHENTIK_TILE | default(true) | bool }}"
          slug: "{{ skstream.AUTHENTIK_TILE_SLUG | default(app, true) }}"
          name: "{{ skstream.AUTHENTIK_TILE_NAME | default('SKStream (Plex)', true) }}"
          launch_url: "https://skstream{{ '' if env == 'prod' else '-' + env }}.{{ skstream.CLUSTERNAME }}.{{ skstream.DOMAIN }}"
          group: "{{ skstream.AUTHENTIK_TILE_GROUP | default('skadmin', true) }}"
          icon: "{{ skstream.AUTHENTIK_TILE_ICON | default('fa://fa-film', true) }}"
          icon_file: "{{ skstream.AUTHENTIK_TILE_ICON_FILE | default('icon.png', true) }}"
          icon_name: "{{ skstream.AUTHENTIK_TILE_ICON_NAME | default('plex', true) }}"
          open_in_new_tab: "{{ skstream.AUTHENTIK_TILE_OPEN_IN_NEW_TAB | default(true) | bool }}"
          description: "{{ skstream.AUTHENTIK_TILE_DESCRIPTION | default('', true) }}"
      tags:
        - config
        - authentik
