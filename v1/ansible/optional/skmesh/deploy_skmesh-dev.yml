---
- import_playbook: ../../shared/meta/skstack-header.yml

- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

- hosts: selected_manager_group
  become: true
  vars:
    app: skmesh
    env: dev
    service_name: skmesh
    service_type: optional
  pre_tasks:
    - name: Select vault file dynamically
      import_tasks: ../../shared/tasks/select_vault_file.yml
      tags:
        - config
    - name: Load selected vault file
      include_vars: "{{ vault_file_path }}"
      tags:
        - config

    - name: Resolve skmesh.AUTH_MODE (standalone | authentik)
      set_fact:
        skmesh_auth_mode: "{{ skmesh.AUTH_MODE | default('standalone') | string | lower }}"
      tags:
        - config

    # Instances written before AUTH_MODE existed were Authentik-wired and
    # carry NETBIRD_AUTH_CLIENT_ID; refuse to flip them to standalone (a
    # different user store) just because AUTH_MODE is unset.
    - name: Check skmesh.AUTH_MODE and the vault keys it needs
      assert:
        that:
          - skmesh_auth_mode in ['standalone', 'authentik']
          - skmesh.AUTH_MODE is defined or skmesh.NETBIRD_AUTH_CLIENT_ID is not defined
          - skmesh_auth_mode != 'authentik' or (skmesh.IDP_MANAGER_PASSWORD | default('') | string | length) >= 32
          - skmesh_auth_mode != 'authentik' or (skmesh.SSO_HOST_IP | default('') | string | length) > 0
        fail_msg: >-
          skmesh.AUTH_MODE must be 'standalone' or 'authentik' (got '{{ skmesh_auth_mode }}'),
          and must be set explicitly when the vault carries NETBIRD_AUTH_CLIENT_ID (an
          Authentik-era vault). authentik mode also needs IDP_MANAGER_PASSWORD (32+ chars,
          e.g. openssl rand -hex 32) and SSO_HOST_IP. See the skmesh README "Authentication".
        quiet: true
      tags:
        - config

    - name: Define default network variables when not provided in vault
      set_fact:
        app_networks: >-
          {{ skmesh_dev_networks | default([{'name': 'skmesh-dev', 'subnet': '172.16.244.0/24'}, {'name': 'cloud-public-dev', 'subnet': '172.16.202.0/24'}]) }}
      tags:
        - networks
        - config
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

  tasks:
    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags:
        - networks

    - name: Create the {{ app }} directories (direct bind mount structure)
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "/var/data/{{ app }}-{{ env }}", owner: "root", group: "root", mode: "0755" }
        - { path: "/var/data/runtime/{{ app }}-{{ env }}/postgres", owner: "999", group: "999", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/database-dump", owner: "root", group: "root", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/management", owner: "root", group: "root", mode: "0700" }
        - { path: "/var/data/{{ app }}-{{ env }}/signal", owner: "root", group: "root", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/relay", owner: "root", group: "root", mode: "0755" }
        - { path: "/var/data/config/{{ app }}-{{ env }}", owner: "root", group: "root", mode: "0755" }

    - name: Process {{ app }} environment templates
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0640'
      loop:
        - { src: "{{ app }}.sh.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env" }
        - { src: "postgres.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/postgres.env" }
        - { src: "postgres-backup.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/postgres-backup.env" }
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env" }
        - { src: "turnserver.conf.j2", dest: "/var/data/config/{{ app }}-{{ env }}/turnserver.conf" }
      tags:
        - templates

    # management.json holds the datastore key, relay/TURN secrets and (in
    # authentik mode) the IdP manager's app password: owner-only.
    - name: Process {{ app }} management.json template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/management.json.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/management.json"
        owner: root
        group: root
        mode: '0600'
      tags:
        - templates

    - name: Write the CA management trusts for HTTPS to the IdP (skmesh.EXTRA_CA_CERT)
      copy:
        content: "{{ skmesh.EXTRA_CA_CERT }}"
        dest: "/var/data/config/{{ app }}-{{ env }}/extra-ca.pem"
        owner: root
        group: root
        mode: '0644'
      when: skmesh.EXTRA_CA_CERT | default('') | length > 0
      tags:
        - templates

    - name: Create or update the Authentik provider, application and IdP manager account
      include_tasks:
        file: tasks/authentik.yml
        apply:
          tags:
            - authentik
            - deploy
      when: skmesh_auth_mode == 'authentik'
      tags:
        - authentik
        - deploy

    - name: Process {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0600'
      tags:
        - compose

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags:
        - compose

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags:
        - deploy-script

    - name: Create {{ app }} control script symlink
      file:
        src: /var/data/{{ app }}-{{ env }}/deploy
        dest: /var/data/deploy_{{ app }}-{{ env }}
        force: yes
        owner: root
        group: root
        mode: '0755'
        state: link
      tags:
        - deploy-script

    - name: Deploy {{ app }} stack
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        ./deploy
      register: deploy_output
      tags:
        - deploy

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags:
        - deploy

    - name: Wait for management container to start and fix permissions
      shell: |
        for i in {1..30}; do
          if docker service ls --filter name={{ app }}-{{ env }}_management --format '{{ '{{' }}.Replicas{{ '}}' }}' | grep -q "1/1"; then
            break
          fi
          sleep 2
        done

        chown -R root:root /var/data/{{ app }}-{{ env }}/management || true
        chown -R root:root /var/data/{{ app }}-{{ env }}/signal || true
        chown -R root:root /var/data/{{ app }}-{{ env }}/relay || true

        # Never a blanket `chmod -R 755` here: management/ is NetBird's
        # /var/lib/netbird (store, keys, GeoLite and IdP data). Management
        # runs as root, so owner-only: dirs 0700, files 0600 (x bits kept).
        M=/var/data/{{ app }}-{{ env }}/management
        chmod -R u+rwX,go-rwx "$M" || true
      when: deploy_output.rc == 0
      ignore_errors: yes
      tags:
        - post-deploy
