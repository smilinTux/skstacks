---
- import_playbook: ../../shared/meta/skstack-header.yml

- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

- hosts: selected_manager_group
  become: true
  vars:
    app: skmesh
    env: prod
    service_name: skmesh
    service_type: optional
    # Postgres major of the skmesh image, parsed exactly like skmesh.yml.j2 (same default).
    # Below 18 the runtime directory IS PGDATA (mounted at /var/lib/postgresql/data) and must
    # be 0700. From 18 on it is the PARENT of PGDATA (mounted at /var/lib/postgresql); the
    # alpine entrypoint runs as uid 70 and must traverse it, so a 999-owned 0700 parent stops
    # initdb ("mkdir: can't create directory '/var/lib/postgresql/18/'"). The entrypoint sets
    # PGDATA itself to 0700 there.
    skmesh_pg_major: "{{ (skmesh.POSTGRES_IMAGE | default('postgres:18-alpine')).split('@')[0].split('/')[-1].split(':')[-1].lstrip('pg').split('.')[0].split('-')[0] | int(0) }}"
    # The uid the image's postgres runs as: 70 in the alpine images, 999 in the Debian ones. The
    # entrypoint chowns PGDATA to it on every start, so a deploy that wrote another owner made drift
    # (live 70 vs 999) and, below 18 where this directory IS PGDATA, a window with a foreign owner.
    skmesh_pg_uid: "{{ '70' if 'alpine' in (skmesh.POSTGRES_IMAGE | default('postgres:18-alpine')).split('@')[0] else '999' }}"
  pre_tasks:
    - name: Select vault file dynamically
      import_tasks: ../../shared/tasks/select_vault_file.yml
      tags:
        - config
    - name: Load selected vault file
      include_vars: "{{ vault_file_path }}"
      tags:
        - config

    - name: Resolve skmesh.AUTH_MODE (standalone | authentik)
      set_fact:
        skmesh_auth_mode: "{{ skmesh.AUTH_MODE | default('standalone') | string | lower }}"
      tags:
        - config

    # Instances written before AUTH_MODE existed were Authentik-wired and
    # carry NETBIRD_AUTH_CLIENT_ID; refuse to flip them to standalone (a
    # different user store) just because AUTH_MODE is unset.
    # Bundled coturn (DEPLOY_COTURN): a relay range it can use, and the
    # shared secret NetBird management and other TURN clients mint from.
    - name: Check the bundled coturn settings
      assert:
        that:
          - (skmesh.TURN_MIN_PORT | default(49152) | int) >= 1024
          - (skmesh.TURN_MAX_PORT | default(65535) | int) <= 65535
          - (skmesh.TURN_MIN_PORT | default(49152) | int) < (skmesh.TURN_MAX_PORT | default(65535) | int)
          - (skmesh.TURN_SECRET | default('') | string | length) >= 32
        fail_msg: >-
          skmesh.DEPLOY_COTURN needs TURN_MIN_PORT < TURN_MAX_PORT within 1024-65535 and a
          TURN_SECRET of at least 32 characters. See README "TURN / STUN".
      when: skmesh.DEPLOY_COTURN | default(false) | bool
      tags:
        - config

    - name: Check skmesh.AUTH_MODE and the vault keys it needs
      assert:
        that:
          - skmesh_auth_mode in ['standalone', 'authentik']
          - skmesh.AUTH_MODE is defined or skmesh.NETBIRD_AUTH_CLIENT_ID is not defined
          - skmesh_auth_mode != 'authentik' or (skmesh.IDP_MANAGER_PASSWORD | default('') | string | length) >= 32
          - skmesh_auth_mode != 'authentik' or (skmesh.SSO_HOST_IP | default('') | string | length) > 0
        fail_msg: >-
          skmesh.AUTH_MODE must be 'standalone' or 'authentik' (got '{{ skmesh_auth_mode }}'),
          and must be set explicitly when the vault carries NETBIRD_AUTH_CLIENT_ID (an
          Authentik-era vault). authentik mode also needs IDP_MANAGER_PASSWORD (32+ chars,
          e.g. openssl rand -hex 32) and SSO_HOST_IP. See the skmesh README "Authentication".
        quiet: true
      tags:
        - config

    - name: Define default network variables when not provided in vault
      set_fact:
        app_networks: >-
          {{ skmesh_prod_networks | default([{'name': 'skmesh-prod', 'subnet': '172.16.243.0/24'}, {'name': 'cloud-public-prod', 'subnet': '172.16.200.0/24'}]) }}
      tags:
        - networks
        - config
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

  tasks:
    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags:
        - networks

    - name: Create the {{ app }} directories (direct bind mount structure)
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "/var/data/{{ app }}-{{ env }}", owner: "root", group: "root", mode: "0755" }
        - { path: "/var/data/runtime/{{ app }}-{{ env }}/postgres", owner: "{{ skmesh_pg_uid }}", group: "{{ skmesh_pg_uid }}", mode: "{{ '0700' if (skmesh_pg_major | int) < 18 else '0755' }}" }
        - { path: "/var/data/{{ app }}-{{ env }}/database-dump", owner: "root", group: "root", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/management", owner: "root", group: "root", mode: "0700" }
        - { path: "/var/data/{{ app }}-{{ env }}/signal", owner: "root", group: "root", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/relay", owner: "root", group: "root", mode: "0755" }
        - { path: "/var/data/config/{{ app }}-{{ env }}", owner: "root", group: "root", mode: "0755" }

    - name: Process {{ app }} environment templates
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0640'
      loop:
        - { src: "{{ app }}.sh.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env" }
        - { src: "postgres.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/postgres.env" }
        - { src: "postgres-backup.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/postgres-backup.env" }
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env" }
        - { src: "turnserver.conf.j2", dest: "/var/data/config/{{ app }}-{{ env }}/turnserver.conf" }
        - { src: "coturn-run.sh.j2", dest: "/var/data/config/{{ app }}-{{ env }}/coturn-run.sh" }
      register: skmesh_env_templates
      tags:
        - templates

    # management.json holds the datastore key, relay/TURN secrets and (in
    # authentik mode) the IdP manager's app password: owner-only.
    - name: Process {{ app }} management.json template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/management.json.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/management.json"
        owner: root
        group: root
        mode: '0600'
      tags:
        - templates

    - name: Write the CA management trusts for HTTPS to the IdP (skmesh.EXTRA_CA_CERT)
      copy:
        content: "{{ skmesh.EXTRA_CA_CERT }}"
        dest: "/var/data/config/{{ app }}-{{ env }}/extra-ca.pem"
        owner: root
        group: root
        mode: '0644'
      when: skmesh.EXTRA_CA_CERT | default('') | length > 0
      tags:
        - templates

    - name: Create or update the Authentik provider, application and IdP manager account
      include_tasks:
        file: tasks/authentik.yml
        apply:
          tags:
            - authentik
            - deploy
      when: skmesh_auth_mode == 'authentik'
      tags:
        - authentik
        - deploy

    - name: Process {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0600'
      tags:
        - compose

    # The 503 fallback router (src/config/skmesh/traefik-unavailable.yml.j2)
    # goes into the top level of every fence dynamic/ directory present here
    # (skfence and/or skfenceha), never a subdirectory (the fences refuse
    # to deploy while one exists). No fence directory: nothing is written.
    - name: Find the Traefik dynamic config directories (skfence, skfenceha)
      stat:
        path: "/var/data/config/{{ item }}-{{ env }}/dynamic"
      loop:
        - skfence
        - skfenceha
      register: skmesh_fence_dynamic_dirs
      tags:
        - traefik

    - name: Render the {{ app }} 503 fallback router into each Traefik dynamic directory
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/traefik-unavailable.yml.j2"
        dest: "/var/data/config/{{ item.item }}-{{ env }}/dynamic/{{ app }}-{{ env }}.yml"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ skmesh_fence_dynamic_dirs.results | selectattr('stat.exists') | selectattr('stat.isdir') | list }}"
      loop_control:
        label: "{{ item.item }}"
      tags:
        - traefik

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags:
        - compose

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags:
        - deploy-script

    - name: Create {{ app }} control script symlink
      file:
        src: /var/data/{{ app }}-{{ env }}/deploy
        dest: /var/data/deploy_{{ app }}-{{ env }}
        force: yes
        owner: root
        group: root
        mode: '0755'
        state: link
      tags:
        - deploy-script

    - name: Refuse a Postgres data directory from another major (fail closed, before the deploy)
      include_tasks:
        file: ../../shared/tasks/postgres_major_guard.yml
        apply:
          tags:
            - deploy
            - postgres-major
      vars:
        pg_guard_app: skmesh
        pg_guard_image: "{{ skmesh.POSTGRES_IMAGE | default('postgres:18-alpine') }}"
        pg_guard_data_path: "/var/data/runtime/{{ app }}-{{ env }}/postgres"
        pg_guard_pin_var: skmesh.POSTGRES_IMAGE
      tags:
        - deploy
        - postgres-major

    - name: Deploy {{ app }} stack
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        ./deploy
      register: deploy_output
      tags:
        - deploy

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags:
        - deploy

    # turnserver.conf and coturn-run.sh are bind mounts, so a changed file
    # leaves the service spec unchanged and the stack deploy keeps the old
    # turnserver (it reads its config only at start). Restart it then.
    - name: Restart coturn when its config changed
      shell: docker service update --force --detach {{ app }}-{{ env }}_coturn
      when:
        - skmesh.DEPLOY_COTURN | default(false) | bool
        - skmesh_env_templates.results
          | selectattr('changed')
          | map(attribute='item.src')
          | select('in', ['turnserver.conf.j2', 'coturn-run.sh.j2'])
          | list | length > 0
      tags:
        - deploy

    - name: Wait for management container to start and fix permissions
      shell: |
        for i in {1..30}; do
          if docker service ls --filter name={{ app }}-{{ env }}_management --format '{{ '{{' }}.Replicas{{ '}}' }}' | grep -q "1/1"; then
            break
          fi
          sleep 2
        done

        # Incremental, never `chown -R` / `chmod -R`: those rewrite every
        # entry on every deploy even when nothing is wrong (on NFS, one
        # SETATTR round trip each). These three dirs are NetBird state (a
        # store db, keys, GeoLite and IdP data: tens of files, no bulk
        # data), so walking them is cheap; the finds only change entries
        # whose owner or mode is actually wrong.
        for S in /var/data/{{ app }}-{{ env }}/management /var/data/{{ app }}-{{ env }}/signal /var/data/{{ app }}-{{ env }}/relay; do
          [ -d "$S" ] || continue
          find "$S" \( ! -user 0 -o ! -group 0 \) -exec chown -h root:root {} + || true
        done

        # Never a blanket `chmod -R 755` here: management/ is the NetBird
        # /var/lib/netbird (store, keys, GeoLite and IdP data). Management
        # runs as root, so owner-only: dirs 0700, files 0600 (x bits kept).
        M=/var/data/{{ app }}-{{ env }}/management
        find "$M" ! -type l \( -perm /0077 -o \( -type d ! -perm -0700 \) -o \( -type f ! -perm -0600 \) \) -exec chmod u+rwX,go-rwx {} + || true
      when: deploy_output.rc == 0
      ignore_errors: yes
      tags:
        - post-deploy
