---
# skstor: Garage (S3-compatible object storage), replacing MinIO (see
# docs/decisions/skstor-backend.md -- MinIO's images and repo are gone).
# TODO before deploy: register the staging overlay subnet below in
# shared/networks if this estate tracks one; set the skstor vault vars (see
# this service's README.md for the full list, in particular skstor.rpc_secret
# which has no default and must be a random 32-byte hex string); ensure the
# image is pullable on swarm nodes. After the first deploy, run the one-time
# `garage key create` / `garage bucket create` / `garage bucket allow` cycle
# from the README for each consumer -- Garage has no MinIO-style root
# credential every consumer can reuse.
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skstor
    env: staging
    service_name: skstor
    service_type: optional
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Define network variables
      # Networks are created idempotently by the create_networks.yml shared
      # task below. Reference: See shared/networks for all registered
      # network subnets.
      set_fact:
        app_networks: "{{ skstor.networks | default([
          { 'name': 'skstor-staging', 'subnet': '172.16.82.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'cloud-public-staging', 'subnet': '172.16.201.0/24', 'driver': 'overlay', 'attachable': true }
        ]) }}"
      tags:
        - networks
        - config

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    - name: Ensure python3-pip is installed
      apt:
        name: python3-pip
        state: present

    - name: Install Docker SDK for Python (required for docker_swarm_service_info)
      pip:
        name: docker
        state: present

    - name: Create the {{ app }} directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "/var/data/{{ app }}-{{ env }}", owner: "root", group: "root", mode: "0755" }
        - { path: "/var/data/{{ app }}-{{ env }}/data", owner: "1000", group: "1000", mode: "0770" }
        - { path: "/var/data/{{ app }}-{{ env }}/meta", owner: "1000", group: "1000", mode: "0770" }
        - { path: "/var/data/config/{{ app }}-{{ env }}", owner: "root", group: "root", mode: "0755" }

    - name: Copy {{ app }} config files except templates
      copy:
        src: "{{ item }}"
        dest: /var/data/config/{{ app }}-{{ env }}/
        owner: root
        group: root
        mode: '0644'
      with_fileglob:
        - "src/config/{{ app }}/*"
      when: "'.j2' not in item"
      tags:
        - config

    - name: Copy {{ app }} base src files (excluding templates)
      copy:
        src: "{{ playbook_dir }}/src/{{ app }}"
        dest: "/var/data/{{ app }}-{{ env }}/"
        force: yes
        backup: yes
      tags:
        - parentdir
        - backup

    - name: Process {{ app }} environment templates
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { src: "{{ app }}.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env", mode: "0640" }
        - { src: "{{ app }}.sh.env.j2", dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env", mode: "0640" }
        - { src: "garage.toml.j2", dest: "/var/data/config/{{ app }}-{{ env }}/garage.toml", mode: "0600" }
      tags:
        - templates

    - name: Process {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags:
        - compose

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags:
        - compose

    - name: Process {{ app }} deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags:
        - templates
        - deploy-script

    - name: Create {{ app }} control script symlink
      file:
        src: /var/data/{{ app }}-{{ env }}/deploy
        dest: /var/data/deploy_{{ app }}-{{ env }}
        force: yes
        owner: root
        group: root
        mode: '0755'
        state: link

    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags:
        - networks

    - name: Deploy {{ app }} stack
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        timeout 600 ./deploy || (echo "Deploy script timed out or failed" >&2 && exit 1)
      register: deploy_output
      tags:
        - deploy

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags:
        - deploy

    - name: Post-deploy Check Garage service health
      community.docker.docker_swarm_service_info:
        name: "{{ app }}-{{ env }}_garage"
      register: garage_service
      ignore_errors: yes
      tags:
        - post-deploy
