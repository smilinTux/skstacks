---
# skbackup defaults. The deploy merges the instance vault's `skbackup:` block
# over this (recursively), so an instance sets only what differs. Every key
# is documented in README.md ("Vault contract").
skbackup_defaults:
  # White-label layer (README "White-labelling"). Everything a customer sees
  # on the storage host comes from here: CLI banner and help, alert subjects
  # and bodies, reports, systemd unit descriptions and names, the install
  # paths (/usr/local/lib/<short_name>, /etc/<short_name>, ...), restic tags.
  branding:
    product_name: SKBackup
    short_name: skbackup
    tagline: Snapshots, local copies and offsite backups for SKStacks storage hosts
    alert_prefix: SKBackup
    report_footer: SKBackup, part of SKStacks
    contact: ""
    logo_url: ""
    credits: false
    credits_text: Powered by SKStacks (https://github.com/smilinTux/skstacks)
  # Optional prefix for the systemd unit NAMES: "acme-" gives
  # acme-<short_name>-run.timer. Descriptions always use product_name.
  unit_prefix: ""
  # restic --host for every offsite snapshot. Empty: the inventory hostname.
  host_label: ""

  # Where the swarm's data lives on the storage host.
  #   zfs: data_target is a dataset (tank/data); snapshots are ZFS snapshots.
  #   dir: data_target is a directory; snapshots are rsync --link-dest trees
  #        under snap_dir_root. For hosts and test clusters without ZFS only:
  #        the first snapshot is a full copy.
  snapshot_backend: zfs
  data_target: ""
  state_dir: ""        # default /var/lib/<short_name>
  snap_dir_root: ""    # dir backend only; default <state_dir>/snapshots
  ionice: true         # run copies and restic under ionice -c3 nice -n19

  # Tier 1: snapshots of the whole data dataset, plus the pre-deploy helper.
  snapshots:
    enabled: true
    # sanoid (zfs only, installs sanoid and manages /etc/sanoid/sanoid.conf)
    # or builtin (count-based, any backend; the only choice for dir).
    engine: sanoid
    retention: {hourly: 36, daily: 30, weekly: 8, monthly: 6}
    builtin_keep: 48
    builtin_schedule: "hourly"
    predeploy_keep_days: 30
    predeploy_keep_min: 2

  # Tier 2: per-app copy from a frozen snapshot into a second pool/disk.
  copy:
    enabled: false
    target: ""          # parent dataset (zfs) or directory (dir)
    bwlimit_kbps: 40000
    retention: {daily: 7, weekly: 4, monthly: 3}
    apps: []            # [{name, excludes: [], retention: {daily: 14}}]

  # Tier 3: DB dump hooks and freshness gates, run before the snapshot.
  dumps:
    enabled: false
    required: true      # a failed hook or stale dump aborts the run
    hooks: []           # [{name, command, timeout: 1800}]
    checks: []          # [{app, glob, max_age_hours: 26}]

  # Tier 4: restic to an S3/B2 (or any restic) repository.
  offsite:
    enabled: false
    repository: ""      # s3:https://s3.<region>.backblazeb2.com/<bucket>/<path>
    password: ""        # the restic repository password (keep an offline copy)
    env: {}             # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, B2_*, ...
    limit_upload_kbps: 8000
    tags: []            # extra tags on every snapshot (short_name is always added)
    ignore_inode: true
    sets: []            # [{name, source: copy|data, apps: [], tags: [], excludes: []}]
    forget: {daily: 14, weekly: 8, monthly: 12}
    install: apt        # apt | url | none
    url: ""             # install: url -> a restic_<ver>_linux_<arch>.bz2 release asset
    sha256: ""          # of that .bz2, required with install: url

  # Tier 5: restore test (sampled restic dump vs the frozen source + check).
  restore_test:
    enabled: false
    samples: 20
    read_data_subset: "5%"
    hooks: []           # [{name, command, timeout}] extra checks, e.g. load a dump

  # Tier 6: staleness checks and alerts.
  alerts:
    enabled: true
    notifier: log       # log | command
    # command: one line, split on whitespace, placeholders substituted per
    # word: {level} {key} {subject} {body} {message}. Never run by a shell.
    command: ""
    max_age_hours: {snapshot: 2, copy: 26, dumps: 26, offsite: 26, restore_test: 840}
    pool_capacity_pct: 80

  schedule:
    run: "*-*-* 05:30:00"
    prune: "Sun *-*-* 07:00:00"
    restore_test: "Sun *-*-01..07 08:00:00"
    check: "*-*-* *:17:00"
