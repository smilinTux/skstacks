---
# skwrit: the worker of the skwrit matter engine (document drafting with
# quality gates, release and publishing into Nextcloud). One digest-pinned
# worker service the workflow engine (skflow) calls over a shared overlay,
# and an optional Nextcloud MCP service. The image is built per site, so it
# has no default and must be pinned by digest in the vault. Secrets, the
# state volume and the engine's overlay already exist (Swarm secrets are
# made by hand, never by this play). Opt-in: nothing renders unless this
# playbook runs. See README.md.
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skwrit
    env: prod
    service_name: skwrit
    service_type: optional
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Refuse a missing skwrit vault block
      assert:
        that:
          - skwrit is defined and skwrit is mapping
        fail_msg: >-
          ERROR: no skwrit vault block. Add `skwrit:` to the skwrit vault
          file (see README.md "Configuration (vault)").
        quiet: true
      tags: [config]

    - name: Resolve the skwrit settings
      set_fact:
        sw_stack: "{{ skwrit.STACK_NAME | default('skwrit-' + env, true) }}"
        sw_service: "{{ skwrit.WORKER_SERVICE | default('worker', true) }}"
        sw_mcp_enabled: "{{ skwrit.NEXTCLOUD_MCP_ENABLED | default(false, true) | bool }}"
        sw_mcp_image: "{{ skwrit.NEXTCLOUD_MCP_IMAGE | default('ghcr.io/cbcoutinho/nextcloud-mcp-server:0.199.4@sha256:4db27920ca54f13965f8a509bcaf8491c2d06a476cc1b77062868ae901c2f0f1', true) }}"
        sw_constraints: "{{ skwrit.PLACEMENT_CONSTRAINTS | default(['node.role == worker'], true) }}"
        sw_extra_hosts: "{{ skwrit.EXTRA_HOSTS | default([], true) }}"
      tags: [config]

    - name: Validate the image pins, names and lists
      assert:
        that:
          - "'@sha256:' in (skwrit.SKWRIT_IMAGE | default('') | string)"
          - (not (sw_mcp_enabled | bool)) or ('@sha256:' in sw_mcp_image)
          - sw_stack is match('^[a-z0-9][a-z0-9-]*$')
          - sw_service is match('^[a-z0-9][a-z0-9-]*$')
          - (skwrit.NEXTCLOUD_URL | default('', true) | string) is match('^https?://')
          - sw_constraints is sequence and sw_constraints is not string
          - sw_extra_hosts is sequence and sw_extra_hosts is not string
          - sw_extra_hosts | select('match', '^[A-Za-z0-9.-]+:[A-Za-z0-9.:-]+$') | list | length == sw_extra_hosts | length
        fail_msg: >-
          ERROR: skwrit.SKWRIT_IMAGE must be pinned by digest (@sha256:),
          NEXTCLOUD_MCP_IMAGE too when NEXTCLOUD_MCP_ENABLED is true,
          NEXTCLOUD_URL must be an http(s) URL, STACK_NAME and WORKER_SERVICE
          plain lowercase names, PLACEMENT_CONSTRAINTS and EXTRA_HOSTS
          lists (EXTRA_HOSTS entries host:address). See README.md.
        quiet: true
      tags: [config]

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    - name: Create the {{ app }} directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /var/data/{{ app }}-{{ env }}
        - /var/data/config/{{ app }}-{{ env }}

    - name: Process {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags: [compose]

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags: [compose]

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags: [deploy-script]

    - name: Create {{ app }} control script symlink
      file:
        src: "/var/data/{{ app }}-{{ env }}/deploy"
        dest: "/var/data/deploy_{{ app }}-{{ env }}"
        force: yes
        owner: root
        group: root
        state: link
      tags: [deploy-script]

    - name: Deploy {{ app }} stack
      # The secrets, the state volume and the engine overlay are external:
      # the deploy script stops with a clear message when one is missing.
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        ./deploy
      register: deploy_output
      tags: [deploy]

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags: [deploy]
