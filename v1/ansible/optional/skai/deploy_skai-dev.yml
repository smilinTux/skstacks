---
# skai: an answer engine on Open WebUI (a pinned release, by digest). Chat and
# task models through an OpenAI-compatible gateway, web search through
# SearXNG (skpeek), uploads and fetched pages embedded through skembed and
# stored in its own pgvector Postgres, the skcorpus tool server registered
# through config, one model preset per corpus, Authentik OIDC with
# group-based admin, a portal tile, optional voice. Configured purely
# through env (ENABLE_PERSISTENT_CONFIG false): no setup wizard state.
# See README.md.
- import_playbook: ../../shared/meta/skstack-header.yml

# Step 1: Select manager node with failover
# Run on all hosts to ensure it executes even with -l limit
- hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tasks:
    - name: Select manager node from manager group
      import_tasks: ../../shared/tasks/select_manager_node.yml
      vars:
        target_group: "{{ target_manager_group | default('swarm_managers') }}"

# Step 2: Deploy to selected manager
- hosts: selected_manager_group
  become: true
  vars:
    app: skai
    env: dev
    service_name: skai
    service_type: optional
    ska_default_image: "ghcr.io/open-webui/open-webui:v0.13.4@sha256:d5168bfbc28609eff5bea1b438dd864cf64d185cf6582c02244865e18385b901"
    ska_default_db_image: "pgvector/pgvector:0.8.7-pg17-bookworm@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd"
    ska_default_voice_image: "ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8"
    # The answer-from-the-corpus instructions every corpus preset gets
    # (skai.CORPORA[].system_prompt replaces it per corpus). {corpus} is the
    # corpus name, {title} the preset's display name.
    ska_default_corpus_prompt: |-
      You answer questions from the {title} knowledge base (corpus "{corpus}") using the corpus tools. Do not answer from memory when the corpus can answer.
      Work in layers:
      1. Connections first: for who or what is connected to whom or what, call graph_entity and graph_neighbors (corpus "{corpus}").
      2. Substance next: call corpus_search (corpus "{corpus}") with a focused query; search again with other words when the first results are thin.
      3. Context when needed: call corpus_get on a hit for its neighbouring chunks.
      Quote chunk text word for word only when the user asks for a quote; otherwise summarize in your own words.
      Always cite every source you used as: title, file_path, chunk_index. If the corpus has nothing on the question, say so plainly instead of guessing.
  pre_tasks:
    - name: Select vault file based on domain and cluster
      import_tasks: ../../shared/tasks/select_vault_file.yml

    - name: Load vault file
      include_vars: "{{ vault_file_path }}"
      when: vault_file_path is defined

    - name: Resolve the skai settings
      set_fact:
        ska_base_domain: "{{ skai.DOMAIN | default(domain) if skai.CLOUDFLARED | default(false) | bool else (skai.CLUSTERNAME | default(cluster_name)) ~ '.' ~ (skai.DOMAIN | default(domain)) }}"
        ska_image: "{{ skai.IMAGE | default(ska_default_image, true) }}"
        ska_db_image: "{{ skai.DB_IMAGE | default(ska_default_db_image, true) }}"
        ska_voice_image: "{{ skai.VOICE_IMAGE | default(ska_default_voice_image, true) }}"
        ska_voice: "{{ skai.VOICE | default(false) | bool }}"
        ska_auth_mode: "{{ skai.AUTH_MODE | default('oidc', true) | string | lower }}"
        ska_router: "skai{{ '' if env == 'prod' else '-' + env }}"
        ska_middlewares: "{{ skai.MIDDLEWARES | default('skai-chain@file', true) }}"
        ska_tls_options: "{{ skai.TLS_OPTIONS | default('none', true) }}"
        ska_gateway_url: "{{ skai.GATEWAY_URL | default('', true) | string }}"
        ska_default_model: "{{ skai.DEFAULT_MODEL | default('', true) | string }}"
        ska_task_model: "{{ skai.TASK_MODEL | default(skai.DEFAULT_MODEL | default('', true), true) | string }}"
        ska_searxng_url: "{{ skai.SEARXNG_URL | default('http://skpeek-' + env + '_skpeek:8080/search?q=<query>', true) | string }}"
        ska_web_search: "{{ skai.WEB_SEARCH | default(true) | bool }}"
        ska_embed_url: "{{ skai.EMBED_URL | default('http://skembed-' + env + '_skembed:8080/v1', true) | string }}"
        ska_embed_model: "{{ skai.EMBED_MODEL | default('', true) | string }}"
        ska_corpus_url: "{{ skai.CORPUS_URL | default('http://skcorpus-' + env + '_skcorpus:8000', true) | string }}"
        ska_corpus_enabled: "{{ skai.CORPUS_TOKEN | default('', true) | string | length > 0 }}"
        ska_corpora: "{{ skai.CORPORA | default([], true) }}"
        ska_admin_group: "{{ skai.ADMIN_GROUP | default('skadmin', true) | string }}"
        ska_user_groups: "{{ skai.USER_GROUPS | default(['*'], true) }}"
        ska_provisioner_email: "{{ skai.PROVISIONER_EMAIL | default('skai-provisioner@' ~ (skai.DOMAIN | default(domain)), true) | string }}"
        ska_data_path: "{{ skai.DATA_PATH | default('/var/data/' + app + '-' + env + '/data', true) }}"
        ska_db_path: "{{ skai.DB_PATH | default('/var/data/' + app + '-' + env + '/postgres', true) }}"
        ska_dump_path: "{{ skai.DUMP_PATH | default('/var/data/' + app + '-' + env + '/dump', true) }}"
        ska_voice_path: "{{ skai.VOICE_PATH | default('/var/data/' + app + '-' + env + '/voice', true) }}"
        ska_db_placement: "{{ skai.DB_PLACEMENT_CONSTRAINTS | default(['node.role == worker'], true) }}"
        ska_placement: "{{ skai.PLACEMENT_CONSTRAINTS | default(['node.role == worker'], true) }}"
      tags: [always]

    - name: Resolve the public host and the OIDC endpoints
      set_fact:
        ska_host: "{{ skai.HOSTNAME | default('skai' + ('' if env == 'prod' else '-' + env) + '.' + ska_base_domain, true) }}"
        ska_oidc_client_id: "{{ skai.OIDC_CLIENT_ID | default(skai.AUTHENTIK_TILE_SLUG | default(app, true), true) | string }}"
        ska_oidc_sso_host: "{{ skai.OIDC_SSO_HOST | default('sso' ~ ('' if env == 'prod' else '-' ~ env) ~ '.' ~ (skai.CLUSTERNAME | default(cluster_name)) ~ '.' ~ (skai.DOMAIN | default(domain)), true) | string }}"
      tags: [always]

    - name: Resolve the OIDC discovery URL
      set_fact:
        ska_oidc_discovery_url: "{{ skai.OIDC_DISCOVERY_URL | default('https://' ~ ska_oidc_sso_host ~ '/application/o/' ~ ska_oidc_client_id ~ '/.well-known/openid-configuration', true) | string }}"
      tags: [always]

    - name: Validate the image pins
      assert:
        that:
          - ska_image is search('@sha256:[0-9a-f]{64}$')
          - ska_db_image is search('@sha256:[0-9a-f]{64}$')
          - ska_voice_image is search('@sha256:[0-9a-f]{64}$')
        fail_msg: "ERROR: skai.IMAGE, DB_IMAGE and VOICE_IMAGE must be pinned by digest (name:tag@sha256:<64 hex>)."
        quiet: true
      tags: [always]

    - name: Validate the host, secrets and the model gateway
      assert:
        that:
          - ska_host is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
          - (skai.SECRET_KEY | default('') | string | length) >= 32
          - (skai.DB_PASSWORD | default('') | string | length) >= 16
          - skai.DB_PASSWORD | string is match('^[A-Za-z0-9._~-]+$')
          - (skai.PROVISIONER_PASSWORD | default('') | string | length) >= 32
          - ska_provisioner_email is match('^[A-Za-z0-9._+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$')
          - ska_gateway_url is match('^https?://[A-Za-z0-9._-]+(:[0-9]+)?(/.*)?$')
          - (skai.GATEWAY_API_KEY | default('') | string | length) > 0
          - ska_middlewares is match('^[A-Za-z0-9@._,-]+$')
        fail_msg: >-
          ERROR: skai needs a valid HOSTNAME (or CLUSTERNAME/DOMAIN), SECRET_KEY (32+
          chars), DB_PASSWORD (16+ chars of letters, digits and . _ ~ -, it goes into a
          URL), PROVISIONER_PASSWORD (32+ chars) and a valid PROVISIONER_EMAIL,
          GATEWAY_URL (an http(s) URL of an OpenAI-compatible API) and GATEWAY_API_KEY,
          and MIDDLEWARES a comma-separated list of middleware names.
        quiet: true
      tags: [always]

    - name: Validate web search, embeddings and the corpus tool server
      assert:
        that:
          - (not ska_web_search) or (ska_searxng_url is match('^https?://[A-Za-z0-9._-]+(:[0-9]+)?/.*<query>'))
          - ska_embed_url is match('^https?://[A-Za-z0-9._-]+(:[0-9]+)?(/.*)?$')
          - ska_embed_model | length > 0
          - ska_corpus_url is match('^https?://[A-Za-z0-9._-]+(:[0-9]+)?(/.*)?$')
          - (not ska_corpus_enabled) or (skai.CORPUS_TOKEN | string | length >= 32)
          - ska_corpora is sequence and ska_corpora is not string
          - ska_corpora | length == 0 or ska_corpus_enabled
          - ska_corpora | rejectattr('name', 'defined') | list | length == 0
          - ska_corpora | map(attribute='name') | map('string') | reject('match', '^[A-Za-z0-9][A-Za-z0-9._-]*$') | list | length == 0
          - ska_corpora | map(attribute='name') | list | unique | length == ska_corpora | length
          - ska_corpora | length == 0 or ska_default_model | length > 0 or ska_corpora | rejectattr('base_model', 'defined') | list | length == 0
        fail_msg: >-
          ERROR: with WEB_SEARCH, SEARXNG_URL must be an http(s) URL containing <query>.
          EMBED_URL must be an http(s) URL and EMBED_MODEL set (the skembed MODEL_NAME).
          CORPUS_TOKEN (when set) needs 32+ chars and equals skcorpus.API_TOKEN. CORPORA
          needs CORPUS_TOKEN, unique plain-token names, and a base_model per corpus or a
          DEFAULT_MODEL.
        quiet: true
      tags: [always]

    - name: Validate the sign-in mode
      assert:
        that:
          - ska_auth_mode in ['oidc', 'local']
          - ska_auth_mode == 'local' or (skai.OIDC_CLIENT_SECRET | default('') | string | length) >= 32
          - ska_oidc_client_id is match('^[a-z0-9][a-z0-9-]*$')
          - ska_oidc_sso_host is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
          - ska_oidc_discovery_url is match('^https://')
          - ska_admin_group is match('^[A-Za-z0-9][A-Za-z0-9 ._-]*$')
          - ska_user_groups is sequence and ska_user_groups is not string and ska_user_groups | length > 0
          - ska_user_groups | map('string') | reject('match', '^([*]|[A-Za-z0-9][A-Za-z0-9 ._-]*)$') | list | length == 0
        fail_msg: >-
          ERROR: skai.AUTH_MODE must be oidc (default) or local. oidc needs
          OIDC_CLIENT_SECRET (32+ chars, the same value as sksso.SKAI_OIDC_CLIENT_SECRET),
          OIDC_CLIENT_ID a lowercase slug, OIDC_SSO_HOST a host name or OIDC_DISCOVERY_URL
          an https URL. ADMIN_GROUP is an Authentik group name; USER_GROUPS a non-empty
          list of group names or ["*"] (no commas: they are comma-joined for Open WebUI).
        quiet: true
      tags: [always]

    - name: Validate voice
      assert:
        that:
          - (skai.VOICE_API_KEY | default('') | string | length) >= 16
        fail_msg: "ERROR: skai.VOICE: true needs VOICE_API_KEY (16+ chars, openssl rand -hex 16)."
        quiet: true
      when: ska_voice | bool
      tags: [always]

    - name: Fail closed on local data paths without a placement pin
      # A path outside /var/data is local disk on one node: without a
      # node.hostname constraint swarm may reschedule onto an empty directory
      # (an empty database). Same rule as skgraph/skvector.
      assert:
        that:
          - (ska_db_placement | select('search', 'node.hostname') | list | length > 0) or (ska_db_path.startswith('/var/data/') and ska_dump_path.startswith('/var/data/'))
          - (ska_placement | select('search', 'node.hostname') | list | length > 0) or (ska_data_path.startswith('/var/data/') and ska_voice_path.startswith('/var/data/'))
        fail_msg: >-
          skai.DB_PATH/DUMP_PATH (or DATA_PATH/VOICE_PATH) point at local disk but
          DB_PLACEMENT_CONSTRAINTS (or PLACEMENT_CONSTRAINTS) has no node.hostname == ... entry.
        quiet: true
      tags: [always]

    - name: Build the tool server connections (skcorpus, through config)
      # Open WebUI v0.13 TOOL_SERVER_CONNECTIONS: one OpenAPI server, bearer key,
      # enabled, readable by every signed-in user (access_grants), referenced
      # by presets as tool id "server:<info.id>".
      set_fact:
        ska_tool_servers: >-
          {{ [{
            'url': ska_corpus_url,
            'path': 'openapi.json',
            'type': 'openapi',
            'auth_type': 'bearer',
            'key': skai.CORPUS_TOKEN | default('', true) | string,
            'config': {'enable': true, 'access_grants': [{'principal_type': 'user', 'principal_id': '*', 'permission': 'read'}]},
            'info': {'id': 'skcorpus', 'name': skai.CORPUS_TOOL_NAME | default('Corpus search', true), 'description': 'Read-only search over the configured knowledge corpora (vectors and graph).'}
          }] if ska_corpus_enabled | bool else [] }}
      no_log: true
      tags: [always]

    - name: Define network variables from vault (idempotent network creation)
      # Subnets: skai-prod 172.16.120.0/24, -staging .121, -dev .122. The app
      # also joins skpeek, skembed and skcorpus (their subnets must match those
      # roles' own playbooks); cloud-public-<env> is shared.
      set_fact:
        app_networks: "{{ skai.networks | default([
          { 'name': 'skai-dev', 'subnet': '172.16.122.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'cloud-public-dev', 'subnet': '172.16.202.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'skpeek-dev', 'subnet': '172.16.149.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'skembed-dev', 'subnet': '172.16.128.0/24', 'driver': 'overlay', 'attachable': true },
          { 'name': 'skcorpus-dev', 'subnet': '172.16.125.0/24', 'driver': 'overlay', 'attachable': true }
        ]) }}"
      tags: [networks, config]

  tasks:
    - name: Deploying {{ app }}
      debug:
        msg: Running SKStacks deploy {{ app }} scripts...

    - name: Create the {{ app }} directories (not recursive)
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "/var/data/{{ app }}-{{ env }}"
        - "/var/data/{{ app }}-{{ env }}/provision"
        - "/var/data/config/{{ app }}-{{ env }}"
        - "{{ ska_data_path }}"
      when: item.startswith('/var/data/')

    - name: Create the {{ app }} database directories (postgres uid 999, not recursive)
      file:
        path: "{{ item }}"
        state: directory
        owner: '999'
        group: '999'
        mode: '0700'
      loop:
        - "{{ ska_db_path }}"
        - "{{ ska_dump_path }}"
      when: item.startswith('/var/data/')

    - name: Create the {{ app }} voice model cache (speaches runs as uid 1000)
      file:
        path: "{{ ska_voice_path }}"
        state: directory
        owner: '1000'
        group: '1000'
        mode: '0755'
      when: ska_voice | bool and ska_voice_path.startswith('/var/data/')

    - name: Install the preset provisioner
      copy:
        src: "{{ playbook_dir }}/app/provision_presets.py"
        dest: "/var/data/{{ app }}-{{ env }}/provision/provision_presets.py"
        owner: root
        group: root
        mode: '0644'
      tags: [app]

    - name: Process the {{ app }} corpus presets (no secrets)
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/presets.json.j2"
        dest: "/var/data/{{ app }}-{{ env }}/provision/presets.json"
        owner: root
        group: root
        mode: '0644'
      tags: [templates]

    - name: Process {{ app }} secrets env (root only)
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.env.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.env"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      register: skai_env
      tags: [templates]

    - name: Process {{ app }} database env (root only)
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/postgres.env.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/postgres.env"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      tags: [templates]

    - name: Process {{ app }} database backup env (root only)
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/postgres-backup.env.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/postgres-backup.env"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      tags: [templates]

    - name: Process {{ app }} voice env (root only)
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/voice.env.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/voice.env"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      when: ska_voice | bool
      tags: [templates]

    - name: Process {{ app }} shell env
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.sh.env.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.sh.env"
        owner: root
        group: root
        mode: '0640'
      tags: [templates]

    - name: Process {{ app }} Docker Compose template
      template:
        src: "{{ playbook_dir }}/src/config/{{ app }}/{{ app }}.yml.j2"
        dest: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        owner: root
        group: root
        mode: '0644'
      tags: [compose]

    - name: Create docker-compose.yml symlink
      file:
        src: "/var/data/config/{{ app }}-{{ env }}/{{ app }}.yml"
        dest: "/var/data/config/{{ app }}-{{ env }}/docker-compose.yml"
        force: yes
        owner: root
        group: root
        state: link
      tags: [compose]

    - name: Process deploy script template
      template:
        src: "{{ playbook_dir }}/src/{{ app }}/deploy.j2"
        dest: "/var/data/{{ app }}-{{ env }}/deploy"
        owner: root
        group: root
        mode: '0755'
      tags: [deploy-script]

    - name: Create {{ app }} control script symlink
      file:
        src: "/var/data/{{ app }}-{{ env }}/deploy"
        dest: "/var/data/deploy_{{ app }}-{{ env }}"
        force: yes
        owner: root
        group: root
        state: link
      tags: [deploy-script]

    - name: Ensure overlay networks exist from app_networks variable
      include_tasks: ../../shared/tasks/create_networks.yml
      tags: [networks]

    - name: Deploy {{ app }} stack
      # The env file is env_file: a changed value alone does not change the
      # service spec, so the deploy script restarts an existing app service
      # when the play changed it.
      shell: |
        cd /var/data/{{ app }}-{{ env }}
        RESTART={{ '1' if skai_env is changed else '0' }} ./deploy
      register: deploy_output
      tags: [deploy]

    - name: Show deploy output
      debug: var=deploy_output.stdout_lines
      tags: [deploy]

    - name: Wait for the swarm node running the skai task
      # Polls until a task reports Running; the preset provisioner below runs
      # there (docker exec). Only needed when presets are configured.
      shell: |
        STATES=$(docker service ps "{{ app }}-{{ env }}_skai" --filter "desired-state=running" --format "{{ '{{.Node}} {{.CurrentState}}' }}")
        NODE=$(printf '%s\n' "$STATES" | awk '$2 == "Running" {print $1; exit}')
        if [ -z "$NODE" ]; then
          echo "{{ app }}-{{ env }}_skai has no Running task yet; current: $(printf '%s' "${STATES:-no task scheduled}" | tr '\n' ';')" >&2
          exit 1
        fi
        echo "$NODE"
      register: skai_node
      until: skai_node.rc == 0 and (skai_node.stdout | trim | length > 0)
      retries: "{{ ((skai.FIRST_START_WAIT_SECONDS | default(900) | int) + 4) // 5 }}"
      delay: 5
      changed_when: false
      when: ska_corpora | length > 0
      tags: [deploy, presets]

    - name: Create or update the corpus model presets (Open WebUI API, inside the container)
      # The provisioner signs in as the env-created admin (its credentials are
      # in the container env, never on a command line) and creates or updates
      # each preset by id; it never deletes one. See app/provision_presets.py.
      shell: |
        set -o pipefail
        CID=""
        for _ in $(seq 1 60); do
          CID=$(docker ps -q -f "name={{ app }}-{{ env }}_skai." | head -n1)
          [ -n "$CID" ] && break
          sleep 5
        done
        if [ -z "$CID" ]; then
          echo "no running {{ app }}-{{ env }}_skai container on this node" >&2
          exit 1
        fi
        docker exec "$CID" python3 /provision/provision_presets.py /provision/presets.json
      args:
        executable: /bin/bash
      delegate_to: "{{ skai_node.stdout | trim }}"
      register: skai_presets_out
      changed_when: "'PRESET_CREATED' in skai_presets_out.stdout or 'PRESET_UPDATED' in skai_presets_out.stdout"
      when: ska_corpora | length > 0
      tags: [deploy, presets]

    - name: Show the preset provisioner output
      debug: var=skai_presets_out.stdout_lines
      when: ska_corpora | length > 0
      tags: [deploy, presets]

    - name: Create or update the skai portal tile in Authentik
      # On by default (AUTHENTIK_TILE: true). The tile slug is the OIDC client
      # id, so with AUTH_MODE oidc the sksso blueprint's Application and this
      # tile are ONE Application (the shared task keeps its provider), and who
      # may sign in is this tile's group binding. See
      # shared/tasks/authentik_portal_tile.yml.
      include_tasks: ../../shared/tasks/authentik_portal_tile.yml
      vars:
        portal_tile:
          enabled: "{{ skai.AUTHENTIK_TILE | default(true) | bool }}"
          slug: "{{ skai.AUTHENTIK_TILE_SLUG | default(app, true) }}"
          name: "{{ skai.AUTHENTIK_TILE_NAME | default('SKAI', true) }}"
          launch_url: "https://{{ ska_host }}"
          group: "{{ skai.AUTHENTIK_TILE_GROUP | default('skadmin', true) }}"
          icon: "{{ skai.AUTHENTIK_TILE_ICON | default('fa://fa-robot', true) }}"
          open_in_new_tab: "{{ skai.AUTHENTIK_TILE_OPEN_IN_NEW_TAB | default(true) | bool }}"
          description: "{{ skai.AUTHENTIK_TILE_DESCRIPTION | default('Answer engine: chat, web search and the knowledge base', true) }}"
      tags:
        - config
        - authentik
