# skaegis internal TLS, the standard wazuh-docker way: the upstream
# wazuh-certs-generator image reads certs.yml and writes one root CA, a node
# certificate per component and the admin client certificate into the certs
# dir. Runs ONCE: when root-ca.pem already exists nothing is generated (a new
# CA would break every component's trust and the indexer's admin DN until all
# of them restart together). To rotate, see SOP.md "Rotate the internal
# certificates". The generator downloads the matching wazuh-certs-tool from
# packages.wazuh.com, so the node it runs on needs outbound HTTPS once.

- name: Resolve where the certificates live
  set_fact:
    ska_certs_node: "{{ skaegis.DATA_NODE | default(inventory_hostname, true) if not ska_data_path.startswith('/var/data/') else inventory_hostname }}"
    ska_cert_files:
      - root-ca.pem
      - root-ca-manager.pem
      - admin.pem
      - admin-key.pem
      - wazuh.indexer.pem
      - wazuh.indexer-key.pem
      - wazuh.manager.pem
      - wazuh.manager-key.pem
      - wazuh.dashboard.pem
      - wazuh.dashboard-key.pem

- name: Check for an existing root CA
  stat:
    path: "{{ ska_certs_path }}/root-ca.pem"
  register: ska_root_ca
  delegate_to: "{{ ska_certs_node }}"

- name: Write the certificate tool input
  template:
    src: "{{ playbook_dir }}/src/config/{{ app }}/certs.yml.j2"
    dest: /var/data/config/{{ app }}-{{ env }}/certs.yml
    owner: root
    group: root
    mode: '0644'
  delegate_to: "{{ ska_certs_node }}"

- name: Generate the certificates (wazuh-certs-generator, first deploy only)
  shell: |
    set -eu
    docker run --rm \
      -v "{{ ska_certs_path }}/:/certificates/" \
      -v "/var/data/config/{{ app }}-{{ env }}/certs.yml:/config/certs.yml:ro" \
      -e CERT_TOOL_VERSION={{ skaegis.CERT_TOOL_VERSION | default('4.14', true) }} \
      -e CERT_TOOL_REPOSITORY=prod \
      "{{ ska_certs_image }}"
  when: not ska_root_ca.stat.exists
  register: ska_certs_run
  delegate_to: "{{ ska_certs_node }}"

- name: Record that a new certificate set was issued
  set_fact:
    skaegis_certs_issued: "{{ ska_certs_run is changed }}"

- name: Check every certificate the stack mounts is present
  stat:
    path: "{{ ska_certs_path }}/{{ item }}"
  loop: "{{ ska_cert_files }}"
  register: ska_cert_stats
  delegate_to: "{{ ska_certs_node }}"

- name: Fail loudly on an incomplete certificate set
  assert:
    that:
      - ska_cert_stats.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      ERROR: {{ ska_certs_path }} is missing
      {{ ska_cert_stats.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}.
      A partial set means the generator failed half way: move the directory
      aside and rerun to issue a fresh set (SOP.md "Rotate the internal
      certificates").
    quiet: true

- name: Own the certificates by uid 1000, read-only (indexer and dashboard run as 1000)
  # Explicit per file, never recursive. The manager and the backup sidecar
  # run as root and read them anyway.
  file:
    path: "{{ ska_certs_path }}/{{ item }}"
    owner: '1000'
    group: root
    mode: '0400'
  loop: "{{ ska_cert_files }}"
  delegate_to: "{{ ska_certs_node }}"
