# New release notes go in the topmost CHANGELOG section, never under a release
# that is already tagged (tools/changelog_placement.py). Cheap: no installs.
name: changelog placement
on:
  pull_request:
    paths: ['CHANGELOG.md', 'tools/changelog_placement.py', '.github/workflows/changelog.yml']

jobs:
  placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: python3 tools/changelog_placement.py "origin/${{ github.base_ref }}"
