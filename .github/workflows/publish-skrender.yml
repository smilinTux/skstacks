name: Publish to PyPI

on:
  push:
    tags: ["skrender-v*"]
  workflow_dispatch:

permissions:
  contents: read

# Trusted Publishing (OIDC) on PyPI for this project:
#   owner=smilinTux  repo=skstacks  workflow=publish-skrender.yml  environment=pypi
# No PyPI token is stored anywhere. Tests gate PRs in CI; a release only
# needs to build cleanly and pass `twine check`.
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/skrender
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: v2/skrender/dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
